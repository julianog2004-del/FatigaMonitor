function renderNutReportsList(){
  const body = document.getElementById('nutReportsBody');
  if(!body) return;
  const isCoach = S.user.type==='coach';
  const myAth = !isCoach ? DB.athletes.find(a=>a.userId===S.user.id) : null;
  const reps = DB.nutritionReports.filter(r=> isCoach ? r.coachId===S.user.id : (myAth && r.athleteId===myAth.id) || (myAth && r.athleteName===myAth.name)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(!reps.length){
    body.innerHTML = `<div class="empty" style="padding:24px"><i class="fas fa-folder-open" style="font-size:28px;color:var(--border);margin-bottom:8px"></i><p style="font-size:12px;color:var(--muted)">${isCoach?'No hay informes nutricionales guardados':'Tu entrenador aún no ha creado un informe para ti'}</p></div>`;
    return;
  }
  body.innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Fecha</th><th>Nombre</th><th>Sexo</th><th>Peso</th><th>Objetivo</th><th>Calorías</th><th>Acciones</th></tr></thead>
    <tbody>${reps.map(r=>`<tr>
      <td>${fmtDate(r.createdAt)}</td>
      <td style="font-weight:600">${r.athleteName}</td>
      <td>${r.sex==='hombre'?'H':'M'}</td>
      <td>${r.weight} kg</td>
      <td><span style="font-family:var(--mono);font-size:10px">${r.activityName}</span></td>
      <td style="font-family:'DM Sans',var(--sans);font-weight:700">${r.totalCal.toFixed(0)} kcal</td>
      <td>
        <div class="flex gap-4">
          <button class="btn btn-secondary btn-sm" onclick="viewNutReportDetail('${r.id}')"><i class="fas fa-eye"></i> Ver</button>
          <button class="btn btn-secondary btn-sm" onclick="printNutReport('${r.id}')"><i class="fas fa-file-pdf"></i> PDF</button>
          ${isCoach?`<button class="btn btn-ghost btn-sm" onclick="deleteNutReport('${r.id}')" style="color:var(--danger)"><i class="fas fa-trash-alt"></i></button>`:''}
        </div>
      </td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function nutFillAthlete(){
  const sel = document.getElementById('nutAthlete');
  if(!sel) return;
  const aid = parseInt(sel.value);
  if(!aid){
    ['nutName','nutAge','nutWeight','nutHeight'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    return;
  }
  const a = DB.athletes.find(x=>x.id===aid);
  if(!a) return;
  document.getElementById('nutName').value = a.name||'';
  if(a.age) document.getElementById('nutAge').value = a.age;
  if(a.weight) document.getElementById('nutWeight').value = a.weight;
  if(a.height) document.getElementById('nutHeight').value = a.height;
  if(a.sex){
    const sexSel = document.getElementById('nutSex');
    if(sexSel) sexSel.value = a.sex;
  }
}

function updateNutDistOptions(){
  const nMeals = parseInt(document.getElementById('nutMenuMeals')?.value)||4;
  const cfg = NUT_MEAL_CONFIGS[nMeals];
  if(!cfg) return;
  const sel = document.getElementById('nutMenuDist');
  if(!sel) return;
  sel.innerHTML = Object.entries(cfg.dists).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
}

function calcNutricion(){
  const name = document.getElementById('nutName').value || 'Atleta';
  const sex = document.getElementById('nutSex').value;
  const age = parseFloat(document.getElementById('nutAge').value)||0;
  const weight = parseFloat(document.getElementById('nutWeight').value)||0;
  const height = parseFloat(document.getElementById('nutHeight').value)||0;
  const actFactor = parseFloat(document.getElementById('nutActivity').value)||1.725;
  const formula = document.getElementById('nutFormula').value;

  if(!age||!weight||!height){ toast('Completa edad, peso y altura','warn'); return; }

  // Dual formula system
  const mifflinM = 10*weight + 6.25*height - 5*age + 5;
  const mifflinF = 10*weight + 6.25*height - 5*age - 161;
  const harrisM = 88.362 + 13.397*weight + 4.799*height - 5.677*age;
  const harrisF = 447.593 + 9.247*weight + 3.098*height - 4.330*age;
  const gerM = formula==='harris'?harrisM:mifflinM;
  const gerF = formula==='harris'?harrisF:mifflinF;
  const ger = sex==='hombre' ? gerM : gerF;
  const formulaName = formula==='harris'?'Harris-Benedict (Roza 1984)':'Mifflin-St Jeor';

  // IMC
  const heightM = height/100;
  const imc = weight/(heightM*heightM);
  const imcCat = imc<18.5?'Bajo peso':imc<25?'Normopeso':imc<30?'Sobrepeso':'Obesidad';
  const imcColor = imc<18.5?'var(--warn)':imc<25?'var(--ok)':imc<30?'var(--warn)':'var(--danger)';

  // Check advanced customization
  const advOpen = document.querySelector('details[style*="margin-bottom:16px"]')?.open;
  const customProtGkg = advOpen ? parseFloat(document.getElementById('nutProtGkg').value) : null;
  const customFatGkg = advOpen ? parseFloat(document.getElementById('nutFatGkg').value) : null;
  const customCalAdj = advOpen ? parseInt(document.getElementById('nutCalAdj').value) : null;

  document.getElementById('nutResults').style.display = 'block';

  // Biometrics cards
  const totalCal = ger * actFactor;
  document.getElementById('nutBioCards').innerHTML = `
    <div class="grid-4 mb-16">
      <div class="stat-card c-pri"><div class="st-icon pri"><i class="fas fa-fire"></i></div>
        <div class="st-val">${ger.toFixed(0)}</div><div class="st-label">GER (kcal) — ${formulaName}</div></div>
      <div class="stat-card c-warn"><div class="st-icon warn"><i class="fas fa-running"></i></div>
        <div class="st-val">${totalCal.toFixed(0)}</div><div class="st-label">GET Diario (NAF ×${actFactor})</div></div>
      <div class="stat-card" style="border-left:3px solid ${imcColor}"><div class="st-icon" style="background:${imcColor}15;color:${imcColor}"><i class="fas fa-weight"></i></div>
        <div class="st-val" style="color:${imcColor}">${imc.toFixed(1)}</div><div class="st-label">IMC — ${imcCat}</div></div>
      <div class="stat-card c-pri"><div class="st-icon pri"><i class="fas fa-percentage"></i></div>
        <div class="st-val">${(weight/heightM/heightM*0+((sex==='hombre'?(86.01*Math.log10(weight)-78.14):(86.01*Math.log10(weight)-78.14-10)))).toFixed(1)>0?Math.max(5,Math.min(45,(1.20*imc+0.23*age-10.8*(sex==='hombre'?1:0)-5.4))).toFixed(1):'--'}</div>
        <div class="st-label">% Grasa Estimado (Deurenberg)</div></div>
    </div>`;

  // Activity levels table
  const levels = [
    {name:'Sedentario', factor:1.2},
    {name:'Ligero', factor:1.375},
    {name:'Moderado', factor:1.55},
    {name:'Intenso', factor:1.725},
    {name:'Muy intenso', factor:1.9}
  ];
  const selIdx = levels.findIndex(l=>l.factor===actFactor);
  const calAdj = customCalAdj!==null ? customCalAdj : 200;
  document.getElementById('nutCalTable').innerHTML = `<table>
    <thead><tr><th>Nivel</th><th>NAF</th><th>${sex==='hombre'?'H':'M'} GER</th><th>GET</th><th style="color:var(--ok)">Déficit (−${calAdj})</th><th>Mant.</th><th style="color:var(--accent)">Superávit (+${calAdj})</th></tr></thead>
    <tbody>${levels.map((l,i)=>{
      const tot = ger*l.factor;
      const isSel = i===selIdx;
      return `<tr style="${isSel?'background:rgba(139,115,64,.08);font-weight:600':''}">
        <td>${l.name}${isSel?' <i class="fas fa-check-circle" style="color:var(--ok)"></i>':''}</td>
        <td style="text-align:center">×${l.factor}</td>
        <td style="text-align:center">${ger.toFixed(0)}</td>
        <td style="text-align:center;font-weight:700">${tot.toFixed(0)}</td>
        <td style="text-align:center;color:var(--ok)">${(tot-calAdj).toFixed(0)}</td>
        <td style="text-align:center;color:var(--primary)">${tot.toFixed(0)}</td>
        <td style="text-align:center;color:var(--accent)">${(tot+calAdj).toFixed(0)}</td>
      </tr>`;
    }).join('')}</tbody></table>`;

  // Macro computation helper
  function computeMacros(targetCal, goalType){
    let pGkg, fGkg;
    if(customProtGkg!==null && advOpen){
      pGkg = customProtGkg;
      fGkg = customFatGkg;
    } else {
      const aIdx = selIdx>=0?selIdx:3;
      pGkg = goalType==='loss'?[2.0,2.1,2.2,2.2,2.3][aIdx]:goalType==='gain'?[2.1,2.2,2.3,2.3,2.4][aIdx]:[2.0,2.1,2.2,2.2,2.3][aIdx];
      const fM = goalType==='loss'?[0.7,0.7,0.8,0.8,0.8][aIdx]:goalType==='gain'?[1.0,1.1,1.2,1.2,1.3][aIdx]:[0.85,0.9,1.0,1.0,1.1][aIdx];
      const fF = goalType==='loss'?[0.9,0.9,1.0,1.0,1.0][aIdx]:goalType==='gain'?[1.2,1.3,1.4,1.4,1.5][aIdx]:[1.0,1.1,1.2,1.2,1.3][aIdx];
      fGkg = sex==='hombre'?fM:fF;
    }
    const p=pGkg*weight, f=fGkg*weight;
    const pK=p*4, fK=f*9, cK=Math.max(0,targetCal-pK-fK), c=cK/4;
    return {prot:p, fat:f, carb:c, protKcal:pK, fatKcal:fK, carbKcal:cK, total:targetCal, pGkg, fGkg};
  }

  const lossCal = totalCal - calAdj;
  const maintCal = totalCal;
  const gainCal = totalCal + calAdj;
  const mLoss = computeMacros(lossCal,'loss');
  const mMaint = computeMacros(maintCal,'maintenance');
  const mGain = computeMacros(gainCal,'gain');

  // 3 Goal summary cards
  document.getElementById('nutGoalCards').innerHTML = [
    {m:mLoss, label:'Déficit (−'+calAdj+')', color:'var(--ok)', icon:'fa-fire-alt'},
    {m:mMaint, label:'Mantenimiento', color:'var(--primary)', icon:'fa-balance-scale'},
    {m:mGain, label:'Superávit (+'+calAdj+')', color:'var(--accent)', icon:'fa-dumbbell'}
  ].map(g=>`<div class="stat-card" style="border-left:3px solid ${g.color}">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><i class="fas ${g.icon}" style="color:${g.color}"></i><span style="font-family:var(--mono);font-size:10px;color:${g.color};text-transform:uppercase;letter-spacing:.5px">${g.label}</span></div>
    <div style="font-family:'DM Sans',var(--sans);font-size:28px;font-weight:700;color:${g.color}">${g.m.total.toFixed(0)} <span style="font-size:12px;font-weight:400">kcal</span></div>
    <div style="display:flex;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px">
      <span style="color:var(--danger)">P:${g.m.prot.toFixed(0)}g</span>
      <span style="color:var(--warn)">G:${g.m.fat.toFixed(0)}g</span>
      <span style="color:var(--ok)">HC:${g.m.carb.toFixed(0)}g</span>
    </div>
  </div>`).join('');

  // Macro detail cards
  function macroCard(m){
    return `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:3px;border:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Proteínas</div>
          <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--danger)">${m.prot.toFixed(0)}g</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${m.protKcal.toFixed(0)} kcal · ${m.pGkg.toFixed(1)} g/kg</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:3px;border:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Grasas</div>
          <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--warn)">${m.fat.toFixed(0)}g</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${m.fatKcal.toFixed(0)} kcal · ${m.fGkg.toFixed(1)} g/kg</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:3px;border:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Hidratos</div>
          <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--ok)">${m.carb.toFixed(0)}g</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${m.carbKcal.toFixed(0)} kcal · ${(m.carb/weight).toFixed(1)} g/kg</div>
        </div>
      </div>
      <div style="text-align:center;font-family:'DM Sans',var(--sans);font-size:14px;font-weight:700;color:var(--primary)">Total: ${m.total.toFixed(0)} kcal</div>`;
  }
  document.getElementById('nutFatLoss').innerHTML = macroCard(mLoss);
  document.getElementById('nutMaintenance').innerHTML = macroCard(mMaint);
  document.getElementById('nutMuscleGain').innerHTML = macroCard(mGain);

  // SMAE Equivalents Panel
  function buildSMAETable(m, goalLabel){
    const targetProt=m.prot, targetFat=m.fat, targetCarb=m.carb, totalCal=m.total;
    // SMAE distribution algorithm — dynamic, calorie-aware, target-matching
    const eq = {};
    let remP=targetProt, remF=targetFat, remC=targetCarb;

    // Dynamic caps based on total caloric target
    const cerealCap = totalCal<2000?8 : totalCal<2500?12 : totalCal<3000?15 : totalCal<3500?18 : 22;
    const frutaCap = totalCal<2000?3 : totalCal<2500?4 : totalCal<3000?5 : 6;
    const legumCap = totalCal<2000?1 : totalCal<2500?2 : totalCal<3000?3 : 4;

    // 1. Verduras (fixed 4-6, low cal, high micronutrient)
    eq['verduras'] = totalCal<2000?4:5; remP-=eq['verduras']*2; remC-=eq['verduras']*4;
    // 2. Frutas (scaled with energy needs)
    eq['frutas'] = Math.max(3, Math.min(frutaCap, Math.round(remC*0.15/15))); remC-=eq['frutas']*15;
    // 3. Leche (1-2 for calcium & quality protein)
    eq['leche_semi'] = Math.max(1, Math.min(2, Math.round(remP*0.08/9))); remP-=eq['leche_semi']*9; remF-=eq['leche_semi']*4; remC-=eq['leche_semi']*12;
    // 4. Leguminosas (fiber + plant protein + carbs) — placed BEFORE AOA so we know its protein contribution
    eq['leguminosas'] = Math.max(1, Math.min(legumCap, Math.round(remC*0.10/20)));
    remP-=eq['leguminosas']*8; remF-=eq['leguminosas']*1; remC-=eq['leguminosas']*20;
    // 5. Cereales sin grasa — main carb source, dynamic cap. Pre-allocate so AOA can account for its protein.
    eq['cereales_sg'] = Math.max(4, Math.min(cerealCap, Math.round(Math.max(0,remC)/15)));
    remC-=eq['cereales_sg']*15; remP-=eq['cereales_sg']*2;
    // 5b. If still >30g carbs remaining, add cereales con grasa
    if(remC > 30){
      eq['cereales_cg'] = Math.max(1, Math.min(4, Math.round(remC/15)));
      remC-=eq['cereales_cg']*15; remP-=eq['cereales_cg']*2; remF-=eq['cereales_cg']*5;
    }
    // 6. AOA — fills the remaining protein gap (now properly computed). Pick categories based on remaining fat budget.
    const aoaEq = Math.max(0, Math.round(remP/7));
    if(aoaEq > 0){
      // Distribute AOA across fat categories based on how much fat budget is left
      // Fat per AOA: mb=1, bg=3, mg=5, ag=8
      const fatPerAOA = aoaEq>0 ? remF/aoaEq : 0;
      if(fatPerAOA <= 1.5){
        // Very low fat budget — almost all very lean
        eq['aoa_mb'] = aoaEq;
      } else if(fatPerAOA <= 3){
        // Mostly very lean, some lean
        eq['aoa_mb'] = Math.round(aoaEq*0.7); eq['aoa_bg'] = aoaEq - eq['aoa_mb'];
      } else if(fatPerAOA <= 5){
        // Balanced
        eq['aoa_mb'] = Math.round(aoaEq*0.45); eq['aoa_bg'] = Math.round(aoaEq*0.35); eq['aoa_mg'] = aoaEq - eq['aoa_mb'] - eq['aoa_bg'];
      } else {
        // Higher fat budget allowed
        eq['aoa_mb'] = Math.round(aoaEq*0.30); eq['aoa_bg'] = Math.round(aoaEq*0.35); eq['aoa_mg'] = aoaEq - eq['aoa_mb'] - eq['aoa_bg'];
      }
      remP -= aoaEq*7;
      remF -= (eq['aoa_mb']||0)*1 + (eq['aoa_bg']||0)*3 + (eq['aoa_mg']||0)*5 + (eq['aoa_ag']||0)*8;
    }
    // 7. Grasas — fill the remaining fat budget. No forced minimums (they were inflating low-fat targets)
    const fatTotal = Math.max(0, remF);
    if(fatTotal >= 5){
      eq['grasas_sp'] = Math.max(1, Math.min(6, Math.round(fatTotal*0.6/5)));
      if(fatTotal >= 10) eq['grasas_cp'] = Math.max(1, Math.min(4, Math.round(fatTotal*0.4/5)));
    } else {
      // Tiny fat budget — just one minimal serving
      eq['grasas_sp'] = 1;
    }

    const rows = SMAE_GROUPS.filter(g=>eq[g.id]&&eq[g.id]>0).map(g=>{
      const n = eq[g.id];
      return `<tr>
        <td style="padding:4px 4px"><i class="fas ${g.icon}" style="color:${g.color};margin-right:4px;width:12px;text-align:center;font-size:10px"></i>${g.name}</td>
        <td style="text-align:center;padding:4px 2px;font-family:'DM Sans',var(--sans);font-weight:700;font-size:14px">${n}</td>
        <td style="padding:4px 4px;font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1.3">${g.portion}</td>
        <td style="text-align:center;padding:4px 2px;font-family:var(--mono);font-size:10px">${n*g.kcal}</td>
        <td style="text-align:center;padding:4px 2px;font-family:var(--mono);font-size:10px;color:var(--danger)">${n*g.prot}</td>
        <td style="text-align:center;padding:4px 2px;font-family:var(--mono);font-size:10px;color:var(--warn)">${n*g.fat}</td>
        <td style="text-align:center;padding:4px 2px;font-family:var(--mono);font-size:10px;color:var(--ok)">${n*g.carb}</td>
      </tr>`;
    }).join('');
    const totals = SMAE_GROUPS.filter(g=>eq[g.id]&&eq[g.id]>0).reduce((t,g)=>{const n=eq[g.id];return{k:t.k+n*g.kcal,p:t.p+n*g.prot,f:t.f+n*g.fat,c:t.c+n*g.carb};},{k:0,p:0,f:0,c:0});
    const html = `<div style="margin-bottom:16px;min-width:0"><div style="font-family:var(--mono);font-size:11px;font-weight:600;margin-bottom:8px;letter-spacing:.5px">${goalLabel}</div>
    <div style="overflow-x:auto"><table style="font-size:11px;width:100%;border-collapse:collapse;table-layout:fixed"><colgroup><col style="width:32%"><col style="width:9%"><col style="width:23%"><col style="width:11%"><col style="width:8%"><col style="width:8%"><col style="width:9%"></colgroup><thead><tr><th style="text-align:left;padding:4px 4px;font-size:9px">Grupo</th><th style="padding:4px 2px;font-size:9px">Eq.</th><th style="text-align:left;padding:4px 4px;font-size:9px">Porción</th><th style="padding:4px 2px;font-size:9px">kcal</th><th style="padding:4px 2px;font-size:9px">P</th><th style="padding:4px 2px;font-size:9px">G</th><th style="padding:4px 2px;font-size:9px">HC</th></tr></thead>
    <tbody>${rows}
    <tr style="background:var(--bg);font-weight:700;font-size:10px"><td style="padding:4px">TOTAL</td><td></td><td></td>
      <td style="text-align:center;padding:4px 2px">${totals.k}</td><td style="text-align:center;padding:4px 2px;color:var(--danger)">${totals.p}</td>
      <td style="text-align:center;padding:4px 2px;color:var(--warn)">${totals.f}</td><td style="text-align:center;padding:4px 2px;color:var(--ok)">${totals.c}</td></tr>
    <tr style="font-size:9px;color:var(--muted)"><td style="padding:3px 4px">Objetivo</td><td></td><td></td>
      <td style="text-align:center;padding:3px 2px">${m.total.toFixed(0)}</td><td style="text-align:center;padding:3px 2px">${m.prot.toFixed(0)}</td>
      <td style="text-align:center;padding:3px 2px">${m.fat.toFixed(0)}</td><td style="text-align:center;padding:3px 2px">${m.carb.toFixed(0)}</td></tr>
    </tbody></table></div></div>`;
    return {html, eq};
  }
  const smaeLoss  = buildSMAETable(mLoss,  'Déficit (−'+calAdj+' kcal)');
  const smaeMaint = buildSMAETable(mMaint, 'Mantenimiento');
  const smaeGain  = buildSMAETable(mGain,  'Superávit (+'+calAdj+' kcal)');
  const smaePanel = document.getElementById('nutSMAEPanel');
  if(smaePanel) smaePanel.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px">`
    + smaeLoss.html + smaeMaint.html + smaeGain.html + '</div>';

  // ===== MICRONUTRIENTES (EFSA) =====
  const profile = document.getElementById('nutProfile')?.value || 'general';
  const microPanel = document.getElementById('nutMicroPanel');
  if(microPanel){
    microPanel.innerHTML = renderMicroPanel(smaeMaint.eq, age, sex, profile);
  }
  // Guardar eq para re-render al cambiar perfil sin re-calcular
  window._nutLastMaintEq = smaeMaint.eq;
  window._nutLastProfileArgs = {age, sex};

  // Yield Factors table
  const yieldEl = document.getElementById('nutYieldTable');
  if(yieldEl) yieldEl.innerHTML = `<table style="font-size:12px"><thead><tr><th>Alimento</th><th>Factor (crudo→cocido)</th><th>Ejemplo</th></tr></thead>
    <tbody>${Object.entries(YIELD_FACTORS).map(([k,v])=>`<tr><td style="font-weight:600">${k}</td><td style="text-align:center;font-family:'DM Sans',var(--sans);font-weight:700">${v.raw2cooked}</td><td style="font-family:var(--mono);font-size:10px;color:var(--muted)">${v.note}</td></tr>`).join('')}</tbody></table>`;

  // Store data for charts
  window._nutChartData = {
    loss: {prot:mLoss.protKcal, fat:mLoss.fatKcal, carb:mLoss.carbKcal},
    maint: {prot:mMaint.protKcal, fat:mMaint.fatKcal, carb:mMaint.carbKcal},
    gain: {prot:mGain.protKcal, fat:mGain.fatKcal, carb:mGain.carbKcal}
  };
  // Store for menu/report generation
  window._nutCalcData = {name, sex, age, weight, height, actFactor, formula, ger, totalCal, imc, imcCat, calAdj, mLoss, mMaint, mGain};
  setupNutricionCharts();

  document.getElementById('nutResults').scrollIntoView({behavior:'smooth', block:'start'});
}

function setupNutricionCharts(){
  if(!window._nutChartData) return;
  const d = window._nutChartData;
  const colors = ['#A04040','#9E8035','#4A7A5A'];
  const labels = ['Proteínas','Grasas','Hidratos'];
  const chartOpts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:true,position:'bottom',labels:{color:'#8A7E6B',font:{size:9,family:'DM Mono'},padding:8,usePointStyle:true}}}
  };

  ['nutLoss','nutMaint','nutGain'].forEach(k=>{if(S.charts[k]) try{S.charts[k].destroy();}catch(e){}});

  [{el:'nutChartLoss',key:'nutLoss',data:d.loss},{el:'nutChartMaint',key:'nutMaint',data:d.maint},{el:'nutChartGain',key:'nutGain',data:d.gain}].forEach(c=>{
    const el = document.getElementById(c.el);
    if(el) S.charts[c.key] = new Chart(el, {type:'doughnut',data:{labels,datasets:[{data:[c.data.prot,c.data.fat,c.data.carb],backgroundColor:colors,borderColor:'#FDFBF7',borderWidth:2}]},options:chartOpts});
  });
}

function generateShoppingList(menuRec){
  const list = {};
  menuRec.menu.forEach(day=>{
    day.meals.forEach(meal=>{
      meal.ingredients.forEach(ing=>{
        const key = ing.n.toLowerCase().trim();
        if(!list[key]) list[key]={name:ing.n, total:0};
        list[key].total += ing.g;
      });
    });
  });
  const sorted = Object.values(list).sort((a,b)=>b.total-a.total);
  // Group by category
  const protFoods=['pollo','pavo','ternera','salmón','merluza','atún','huevo','cerdo','carne','jamón','chorizo','camarón','surimi','bacalao','trucha','mojarra'];
  const carbFoods=['arroz','pasta','pan ','avena','patata','boniato','tortilla','quinoa','lentejas','garbanzos','frijol','cuscús','harina'];
  const fatFoods=['aceite','aguacate','mantequilla','nueces','almendras','cacahuete','semillas'];
  const cats = {prot:[],carb:[],fat:[],veg:[],other:[]};
  sorted.forEach(it=>{
    const n=it.name.toLowerCase();
    if(protFoods.some(p=>n.includes(p))) cats.prot.push(it);
    else if(carbFoods.some(p=>n.includes(p))) cats.carb.push(it);
    else if(fatFoods.some(p=>n.includes(p))) cats.fat.push(it);
    else if(['tomate','lechuga','brócoli','espinaca','calabacín','zanahoria','pimiento','cebolla','champiñon','espárrago','judía','pepino','berenjena','col','acelga','coliflor','apio'].some(v=>n.includes(v))) cats.veg.push(it);
    else cats.other.push(it);
  });
  function catRows(items){return items.map(it=>`<tr><td>${it.name}</td><td style="text-align:right;font-family:'DM Sans',var(--sans);font-weight:700">${it.total>=1000?(it.total/1000).toFixed(1)+' kg':it.total+'g'}</td></tr>`).join('');}

  const el = document.getElementById('nutShoppingList');
  if(!el) return;
  el.style.display='block';
  el.innerHTML = `<div class="card mt-24" style="border-left:3px solid var(--ok)">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      ${[{title:'Proteínas',items:cats.prot,icon:'fa-drumstick-bite',color:'var(--danger)'},
         {title:'Carbohidratos',items:cats.carb,icon:'fa-bread-slice',color:'var(--ok)'},
         {title:'Grasas',items:cats.fat,icon:'fa-tint',color:'var(--warn)'},
         {title:'Verduras y Frutas',items:cats.veg,icon:'fa-carrot',color:'#4A7A5A'},
         {title:'Otros',items:cats.other,icon:'fa-box',color:'var(--muted)'}
      ].filter(c=>c.items.length).map(c=>`
        <div><div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><i class="fas ${c.icon}" style="color:${c.color}"></i><span style="font-family:var(--mono);font-size:10px;color:${c.color};text-transform:uppercase;letter-spacing:.5px;font-weight:600">${c.title}</span></div>
        <table style="font-size:12px;width:100%"><tbody>${catRows(c.items)}</tbody></table></div>`).join('')}
    </div>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

function getSelectedAllergens(){
  const checks = document.querySelectorAll('#nutAllergens input[type=checkbox]:checked');
  return Array.from(checks).map(c=>c.value);
}

function generateWeeklyMenu(){
  const name = document.getElementById('nutName').value||'Atleta';
  const sex = document.getElementById('nutSex').value;
  const age = parseFloat(document.getElementById('nutAge').value)||0;
  const weight = parseFloat(document.getElementById('nutWeight').value)||0;
  const height = parseFloat(document.getElementById('nutHeight').value)||0;
  const actFactor = parseFloat(document.getElementById('nutActivity').value)||1.7;
  if(!age||!weight||!height){ toast('Primero completa los datos personales y calcula','warn'); return; }

  const goal = document.getElementById('nutMenuGoal').value;
  const nMeals = parseInt(document.getElementById('nutMenuMeals')?.value)||4;
  const distKey = document.getElementById('nutMenuDist').value;
  const mealCfg = NUT_MEAL_CONFIGS[nMeals];
  const dist = mealCfg.dists[distKey]?.values || mealCfg.dists['estandar'].values;
  const allergens = getSelectedAllergens();

  const formula = document.getElementById('nutFormula')?.value||'mifflin';
  const ger = formula==='harris'
    ?(sex==='hombre'?(88.362+13.397*weight+4.799*height-5.677*age):(447.593+9.247*weight+3.098*height-4.330*age))
    :(sex==='hombre'?(10*weight+6.25*height-5*age+5):(10*weight+6.25*height-5*age-161));
  const totalCal = ger*actFactor;
  const advOpen = document.querySelector('details[style*="margin-bottom:16px"]')?.open;
  const customCalAdj = advOpen ? parseInt(document.getElementById('nutCalAdj')?.value||'200') : 200;
  const goalAdj2 = goal==='loss'?-customCalAdj:goal==='gain'?customCalAdj:goal==='custom'?(advOpen?parseInt(document.getElementById('nutCalAdj')?.value||'0'):0):0;
  const targetCal = totalCal + goalAdj2;

  // Target macros
  const levels=[{f:1.2},{f:1.375},{f:1.55},{f:1.725},{f:1.9}];
  const actIdx=Math.max(0,levels.findIndex(l=>l.f===actFactor));
  const customProtGkg = advOpen ? parseFloat(document.getElementById('nutProtGkg')?.value||'2.2') : null;
  const customFatGkg = advOpen ? parseFloat(document.getElementById('nutFatGkg')?.value||'1.0') : null;
  let protGkg, fatGkg;
  if(customProtGkg!==null && advOpen){
    protGkg = customProtGkg; fatGkg = customFatGkg;
  } else {
    protGkg = goal==='loss'?[2.0,2.1,2.2,2.2,2.3][actIdx]:goal==='gain'?[2.1,2.2,2.3,2.3,2.4][actIdx]:[2.0,2.1,2.2,2.2,2.3][actIdx];
    const fM = goal==='loss'?[0.7,0.7,0.8,0.8,0.8][actIdx]:goal==='gain'?[1.0,1.1,1.2,1.2,1.3][actIdx]:[0.85,0.9,1.0,1.0,1.1][actIdx];
    const fF = goal==='loss'?[0.9,0.9,1.0,1.0,1.0][actIdx]:goal==='gain'?[1.2,1.3,1.4,1.4,1.5][actIdx]:[1.0,1.1,1.2,1.2,1.3][actIdx];
    fatGkg = sex==='hombre'?fM:fF;
  }
  const totalProt=protGkg*weight, totalFat=fatGkg*weight;
  const totalCarb=Math.max(0,(targetCal-totalProt*4-totalFat*9)/4);

  const mealTypes = mealCfg.types;
  const mealLabels = mealCfg.labels;
  const dayNames = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

  // Filter recipes by allergens (using recipe pool mapping for extra meal types)
  function recipesFor(mealType){
    const pool = mealTypeToRecipePool(mealType);
    return NUT_RECIPES.filter(r=>r.meal.includes(pool) && !r.allergens.some(a=>allergens.includes(a)));
  }

  // Build menu
  const menu = [];
  const usedRecipes = {}; // track per meal type to avoid consecutive repeats
  mealTypes.forEach(mt=>usedRecipes[mt]=[]);

  for(let d=0;d<7;d++){
    const day = {name:dayNames[d], meals:[]};
    for(let m=0;m<mealTypes.length;m++){
      const mt = mealTypes[m];
      const mealCal = targetCal * dist[m]/100;
      const mealProt = totalProt * dist[m]/100;
      const mealFat = totalFat * dist[m]/100;
      const mealCarb = totalCarb * dist[m]/100;

      const available = recipesFor(mt);
      if(!available.length){
        day.meals.push({name:'Sin recetas disponibles (revisa alergias)',ingredients:[],kcal:0,prot:0,carb:0,fat:0,scale:1});
        continue;
      }

      // Pick recipe: avoid last 2 used for this meal type
      const recent = usedRecipes[mt].slice(-2);
      let candidates = available.filter(r=>!recent.includes(r.name));
      if(!candidates.length) candidates = available;

      // Pick randomly
      const recipe = candidates[Math.floor(Math.random()*candidates.length)];
      usedRecipes[mt].push(recipe.name);

      // Scale to match target calories for this meal
      const scale = mealCal / recipe.kcal;
      const scaledIngredients = recipe.ingredients.map(ing=>({
        n: ing.n,
        g: Math.round(ing.g * scale)
      }));

      day.meals.push({
        name: recipe.name,
        ingredients: scaledIngredients,
        kcal: Math.round(recipe.kcal*scale),
        prot: Math.round(recipe.prot*scale),
        carb: Math.round(recipe.carb*scale),
        fat: Math.round(recipe.fat*scale),
        scale: scale,
        targetKcal: Math.round(mealCal),
        targetProt: Math.round(mealProt),
        targetFat: Math.round(mealFat),
        targetCarb: Math.round(mealCarb)
      });
    }
    menu.push(day);
  }

  // Auto-save to DB
  const athSel = document.getElementById('nutAthlete');
  const athleteId = athSel ? parseInt(athSel.value)||null : null;
  if(!DB.weeklyMenus) DB.weeklyMenus = [];
  const menuRecord = {
    id: uid(), coachId: S.user.id, athleteId,
    menu, name, sex, age, weight, height, actFactor,
    goal, targetCal, totalProt, totalFat, totalCarb,
    allergens, nMeals, dist: distKey, createdAt: TODAY
  };
  DB.weeklyMenus.push(menuRecord);
  save();
  window._nutMenuId = menuRecord.id;
  window._nutMenu = menuRecord;
  toast('Menú generado y guardado para '+name);
  renderSavedMenusList();
  renderWeeklyMenu(menuRecord);
  generateShoppingList(menuRecord);
}

  const mealLabels = mealCfg.labels;
  const mealTypes = mealCfg.types;
  const mt = mealTypes[mealIdx];
  const pool = mealTypeToRecipePool(mt);
  const allergens = rec.allergens||[];

  // Get available recipes for swap (use recipe pool mapping)
  const available = NUT_RECIPES.filter(r=>r.meal.includes(pool) && !r.allergens.some(a=>allergens.includes(a)));
  const recipeOptions = available.map(r=>`<option value="${r.name}" ${r.name===meal.name?'selected':''}>${r.name}</option>`).join('');

  let ingRows = meal.ingredients.map((ing,i)=>`

  showModal(`

      <div class="form-group mb-16">

    <button class="btn-ghost" style="color:var(--danger);border:none;cursor:pointer;padding:4px 8px" onclick="this.closest('.meal-ing-row').remove()"><i class="fas fa-trash-alt"></i></button>`;

function swapMealRecipe(menuId, dayIdx, mealIdx){
  const sel = document.getElementById('editMealSwap');
  const recipeName = sel.value;
  if(!recipeName) return;
  const recipe = NUT_RECIPES.find(r=>r.name===recipeName);
  if(!recipe) return;

  // Get target kcal for this meal from the menu record
  const rec = (DB.weeklyMenus||[]).find(m=>m.id===menuId);
  if(!rec) return;
  const meal = rec.menu[dayIdx].meals[mealIdx];
  const targetKcal = meal.targetKcal || meal.kcal;
  const scale = targetKcal / recipe.kcal;

  // Update fields
  document.getElementById('editMealName').value = recipe.name;
  document.getElementById('editMealProt').value = Math.round(recipe.prot*scale);
  document.getElementById('editMealFat').value = Math.round(recipe.fat*scale);
  document.getElementById('editMealCarb').value = Math.round(recipe.carb*scale);
  document.getElementById('editMealKcal').value = Math.round(recipe.kcal*scale);

  // Rebuild ingredients
  const container = document.getElementById('editMealIngs');
  container.innerHTML = recipe.ingredients.map((ing,i)=>`
    <div class="flex gap-8 mb-8 meal-ing-row" data-idx="${i}">
      <div class="form-group" style="flex:2;margin:0"><input type="text" class="ing-name" value="${ing.n}" style="font-size:12px;padding:6px 8px"></div>
      <div class="form-group" style="flex:1;margin:0"><input type="number" class="ing-g" value="${Math.round(ing.g*scale)}" min="0" style="font-size:12px;padding:6px 8px"></div>
      <button class="btn-ghost" style="color:var(--danger);border:none;cursor:pointer;padding:4px 8px" onclick="this.closest('.meal-ing-row').remove()"><i class="fas fa-trash-alt"></i></button>
    </div>`).join('');
}

function saveMealEdit(menuId, dayIdx, mealIdx){
  const rec = (DB.weeklyMenus||[]).find(m=>m.id===menuId);
  if(!rec) return;

  // Read values from modal
  const name = document.getElementById('editMealName').value;
  const prot = parseInt(document.getElementById('editMealProt').value)||0;
  const fat = parseInt(document.getElementById('editMealFat').value)||0;
  const carb = parseInt(document.getElementById('editMealCarb').value)||0;
  const kcal = parseInt(document.getElementById('editMealKcal').value)||0;

  const ingRows = document.querySelectorAll('#editMealIngs .meal-ing-row');
  const ingredients = [];
  ingRows.forEach(row=>{
    const n = row.querySelector('.ing-name').value.trim();
    const g = parseInt(row.querySelector('.ing-g').value)||0;
    if(n && g>0) ingredients.push({n, g});
  });

  // Update the meal in the record
  rec.menu[dayIdx].meals[mealIdx] = {
    ...rec.menu[dayIdx].meals[mealIdx],
    name, ingredients, prot, fat, carb, kcal
  };

  save();
  closeModal();
  toast('Comida actualizada');
  window._nutMenu = rec;
  renderWeeklyMenu(rec);
}

function copyMenuMeal(menuId, dayIdx, mealIdx){
  const rec = (DB.weeklyMenus||[]).find(m=>m.id===menuId);
  if(!rec) return;
  const meal = JSON.parse(JSON.stringify(rec.menu[dayIdx].meals[mealIdx]));
  showCopyMealModal(menuId, dayIdx, mealIdx, meal);

  const nMeals = rec?.nMeals || 4;
  const mealCfg = NUT_MEAL_CONFIGS[nMeals] || NUT_MEAL_CONFIGS[4];
  const dayNames = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const mealLabels = mealCfg.labels;
  const mealIcons = mealCfg.icons;
  window._copyMealData = mealData;
  window._copyMenuId = menuId;

  let grid = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px">`;
  grid += `<thead><tr><th style="padding:8px;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.5px;border-bottom:2px solid var(--border)"></th>`;
  mealLabels.forEach((ml,i) => {
    grid += `<th style="padding:8px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.5px;border-bottom:2px solid var(--border)"><i class="fas ${mealIcons[i]}" style="margin-right:4px"></i>${ml}</th>`;
  });
  grid += `</tr></thead><tbody>`;
  dayNames.forEach((dn, di) => {
    grid += `<tr><td style="padding:6px 8px;font-weight:600;font-size:11px;border-bottom:1px solid var(--border)">${dn}</td>`;
    mealLabels.forEach((ml, mi) => {
      const isSrc = di===srcDay && mi===srcMeal;
      const bg = isSrc ? 'background:rgba(139,115,64,.12)' : '';
      const label = isSrc ? '<span style="font-family:var(--mono);font-size:8px;color:var(--primary);display:block;margin-top:2px">ORIGEN</span>' : '';
      grid += `<td style="text-align:center;padding:6px;border-bottom:1px solid var(--border);${bg}">
        <input type="checkbox" class="copy-meal-cb" data-day="${di}" data-meal="${mi}" ${isSrc?'checked disabled':''} style="cursor:${isSrc?'default':'pointer'}">
        ${label}
      </td>`;
    });
    grid += `</tr>`;
  });
  grid += `</tbody></table></div>`;

  showModal(`
    <div class="modal-hdr">
      <div class="modal-title"><i class="fas fa-copy" style="margin-right:8px"></i>Copiar Comida</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div style="padding:24px">
      <div style="background:rgba(139,115,64,.06);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:16px;font-size:12px">
        <i class="fas fa-info-circle" style="color:var(--primary);margin-right:6px"></i>
        Copiando: <strong>${mealData.name}</strong> (${mealLabels[srcMeal]} — ${dayNames[srcDay]}).<br>
        <span style="color:var(--muted)">Selecciona los destinos donde pegar esta comida.</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn btn-secondary btn-sm" onclick="document.querySelectorAll('.copy-meal-cb:not(:disabled)').forEach(c=>c.checked=true)"><i class="fas fa-check-double"></i> Seleccionar todos</button>
        <button class="btn btn-secondary btn-sm" onclick="document.querySelectorAll('.copy-meal-cb:not(:disabled)').forEach(c=>c.checked=false)"><i class="fas fa-times"></i> Deseleccionar</button>
      </div>
      ${grid}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="pasteCopiedMeal()"><i class="fas fa-paste" style="margin-right:4px"></i>Pegar en seleccionados</button>
      </div>
    </div>
  `, 640);
}

function pasteCopiedMeal(){
  const menuId = window._copyMenuId;
  const mealData = window._copyMealData;
  const rec = (DB.weeklyMenus||[]).find(m=>m.id===menuId);
  if(!rec || !mealData) return;
  const checks = document.querySelectorAll('.copy-meal-cb:checked:not(:disabled)');
  if(!checks.length){ toast('Selecciona al menos un destino','warn'); return; }
  checks.forEach(cb => {
    const di = parseInt(cb.dataset.day);
    const mi = parseInt(cb.dataset.meal);
    rec.menu[di].meals[mi] = JSON.parse(JSON.stringify(mealData));
  });
  save();
  closeModal();
  toast('Comida pegada en ' + checks.length + ' destino(s)');
  window._nutMenu = rec;
  renderWeeklyMenu(rec);
}

  // Build shopping list aggregated across all 7 days

  m.menu.forEach(day=>day.meals.forEach(meal=>meal.ingredients.forEach(ing=>{
    const key = ing.n.toLowerCase().trim();
    if(!shopMap[key]) shopMap[key]={name:ing.n,total:0};
    shopMap[key].total += ing.g;

  const shopSorted = Object.values(shopMap).sort((a,b)=>b.total-a.total);
  const protFoods=['pollo','pavo','ternera','salmón','merluza','atún','huevo','cerdo','carne','jamón','chorizo','camarón','surimi','bacalao','trucha','mojarra'];

  const fatFoods=['aceite','aguacate','mantequilla','nueces','almendras','cacahuete','semillas'];
  const vegFoods=['tomate','lechuga','brócoli','espinaca','calabacín','zanahoria','pimiento','cebolla','champiñon','espárrago','judía','pepino','berenjena','col','acelga','coliflor','apio'];

// ===== NUTRITION REPORTS =====
function saveNutritionReport(){
  const name = document.getElementById('nutName').value || 'Atleta';
  const sex = document.getElementById('nutSex').value;
  const age = parseFloat(document.getElementById('nutAge').value)||0;
  const weight = parseFloat(document.getElementById('nutWeight').value)||0;
  const height = parseFloat(document.getElementById('nutHeight').value)||0;
  const actFactor = parseFloat(document.getElementById('nutActivity').value)||1.725;
  const formula = document.getElementById('nutFormula')?.value||'mifflin';
  if(!age||!weight||!height){ toast('Primero calcula los datos','warn'); return; }

  const levels = [{name:'Sedentario',factor:1.2},{name:'Ligero',factor:1.375},{name:'Moderado',factor:1.55},{name:'Intenso',factor:1.725},{name:'Muy intenso',factor:1.9}];
  const actIdx = Math.max(0,levels.findIndex(l=>l.factor===actFactor));
  const ger = formula==='harris'
    ?(sex==='hombre'?(88.362+13.397*weight+4.799*height-5.677*age):(447.593+9.247*weight+3.098*height-4.330*age))
    :(sex==='hombre'?(10*weight+6.25*height-5*age+5):(10*weight+6.25*height-5*age-161));
  const totalCal = ger*actFactor;
  const advOpen = document.querySelector('details[style*="margin-bottom:16px"]')?.open;
  const calAdj = advOpen ? Math.abs(parseInt(document.getElementById('nutCalAdj')?.value||'200')) : 200;
  const lossCal = totalCal-calAdj, gainCal = totalCal+calAdj;

  const protGkgLoss=[2.0,2.1,2.2,2.2,2.3][actIdx], protGkgGain=[2.1,2.2,2.3,2.3,2.4][actIdx];
  const fatGkgLoss = sex==='hombre'?[0.7,0.7,0.8,0.8,0.8][actIdx]:[0.9,0.9,1.0,1.0,1.0][actIdx];
  const fatGkgGain = sex==='hombre'?[1.0,1.1,1.2,1.2,1.3][actIdx]:[1.2,1.3,1.4,1.4,1.5][actIdx];

  const lProt=protGkgLoss*weight, lFat=fatGkgLoss*weight, lProtK=lProt*4, lFatK=lFat*9, lCarbK=Math.max(0,lossCal-lProtK-lFatK), lCarb=lCarbK/4;
  const gProt=protGkgGain*weight, gFat=fatGkgGain*weight, gProtK=gProt*4, gFatK=gFat*9, gCarbK=Math.max(0,gainCal-gProtK-gFatK), gCarb=gCarbK/4;

  // All levels data
  const allLevels = levels.map((l,i)=>{
    const tot = ger*l.factor;
    const pk=[2.0,2.1,2.2,2.2,2.3][i], pgk=[2.1,2.2,2.3,2.3,2.4][i];
    const fkLM=[0.7,0.7,0.8,0.8,0.8][i], fkLF=[0.9,0.9,1.0,1.0,1.0][i];
    const fkGM=[1.0,1.1,1.2,1.2,1.3][i], fkGF=[1.2,1.3,1.4,1.4,1.5][i];
    const fkL=sex==='hombre'?fkLM:fkLF, fkG=sex==='hombre'?fkGM:fkGF;
    return {
      name:l.name, factor:l.factor, total:tot,
      loss:{cal:tot-200, protG:pk*weight, fatG:fkL*weight, carbG:Math.max(0,tot-200-pk*weight*4-fkL*weight*9)/4},
      gain:{cal:tot+200, protG:pgk*weight, fatG:fkG*weight, carbG:Math.max(0,tot+200-pgk*weight*4-fkG*weight*9)/4}
    };
  });

  const athSel = document.getElementById('nutAthlete');
  const athleteId = athSel ? parseInt(athSel.value)||null : null;

  const report = {
    id: uid(), coachId: S.user.id, athleteId, athleteName: name,
    createdAt: TODAY, sex, age, weight, height,
    activityFactor: actFactor, activityName: levels[actIdx].name,
    ger, totalCal, lossCal, gainCal,
    lossMacros: {protG:lProt,protK:lProtK,fatG:lFat,fatK:lFatK,carbG:lCarb,carbK:lCarbK},
    gainMacros: {protG:gProt,protK:gProtK,fatG:gFat,fatK:gFatK,carbG:gCarb,carbK:gCarbK},
    allLevels
  };

  DB.nutritionReports.push(report);
  save();
  toast('Informe nutricional guardado');
  renderNutReportsList();
  viewNutReportDetail(report.id);
}

function deleteNutReport(rid){
  if(!confirm('¿Eliminar este informe nutricional?')) return;
  DB.nutritionReports = DB.nutritionReports.filter(r=>r.id!==rid);

function viewNutReportDetail(rid){
  const r = DB.nutritionReports.find(x=>x.id===rid);
  if(!r) return;
  const sexLabel = r.sex==='hombre'?'Hombre':'Mujer';
  const uid_rpt = Date.now();

  showModal(`
    <div class="modal-hdr">
      <div class="modal-title"><i class="fas fa-utensils" style="margin-right:8px;color:var(--primary)"></i>Informe Nutricional — ${r.athleteName}</div>
      <div class="flex gap-8">
        <button class="btn btn-secondary btn-sm" onclick="printNutReport('${r.id}')"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
    </div>
    <div class="report-box" style="padding:32px">
      <!-- Header -->
      <div class="rpt-hdr">
        <div><div class="rpt-logo">Fatiga<span>Monitor</span> Pro</div><div style="font-size:11px;color:#9ca3af;margin-top:2px">Informe Nutricional</div></div>
        <div class="rpt-meta"><div style="font-weight:600;color:#1a1a1a">${r.athleteName}</div><div>${fmtDate(r.createdAt)}</div></div>
      </div>

      <!-- Personal Data -->
      <div class="rpt-section">
        <div class="rpt-section-title">Datos Personales</div>
        <div class="rpt-grid" style="grid-template-columns:repeat(5,1fr)">
          <div class="rpt-stat"><div class="rpt-stat-val" style="font-size:16px">${r.athleteName}</div><div class="rpt-stat-lbl">Nombre</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val">${sexLabel}</div><div class="rpt-stat-lbl">Sexo</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val">${r.age}</div><div class="rpt-stat-lbl">Edad</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val">${r.weight} kg</div><div class="rpt-stat-lbl">Peso</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val">${r.height} cm</div><div class="rpt-stat-lbl">Altura</div></div>
        </div>
      </div>

      <!-- GER & Total -->
      <div class="rpt-section">
        <div class="rpt-section-title">Gasto Energético</div>
        <div class="rpt-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="rpt-stat"><div class="rpt-stat-val" style="color:var(--primary)">${r.ger.toFixed(0)}</div><div class="rpt-stat-lbl">GER (kcal)</div><div style="font-size:9px;color:#9ca3af">Mifflin-St Jeor</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val" style="color:var(--warn)">${r.totalCal.toFixed(0)}</div><div class="rpt-stat-lbl">Total Diario (kcal)</div><div style="font-size:9px;color:#9ca3af">${r.activityName} ×${r.activityFactor}</div></div>
          <div class="rpt-stat"><div class="rpt-stat-val" style="color:var(--accent)">${r.activityName}</div><div class="rpt-stat-lbl">Nivel de Actividad</div></div>
        </div>
      </div>

      <!-- Goals side by side -->
      <div class="rpt-section">
        <div class="rpt-section-title">Objetivos Nutricionales</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <!-- Fat Loss -->
          <div style="padding:16px;border-radius:4px;border:1px solid rgba(74,122,90,.3);background:rgba(74,122,90,.04)">
            <div style="font-family:var(--mono);font-size:10px;color:var(--ok);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px"><i class="fas fa-fire-alt"></i> Pérdida de Grasa (−200 kcal)</div>
            <div style="text-align:center;font-family:'DM Sans',var(--sans);font-size:24px;font-weight:700;color:var(--ok);margin-bottom:12px">${r.lossCal.toFixed(0)} kcal</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
              <div style="padding:8px;background:rgba(160,64,64,.06);border-radius:3px;border:1px solid rgba(160,64,64,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Proteínas</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--danger)">${r.lossMacros.protG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.lossMacros.protK.toFixed(0)} kcal</div>
              </div>
              <div style="padding:8px;background:rgba(158,128,53,.06);border-radius:3px;border:1px solid rgba(158,128,53,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Grasas</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--warn)">${r.lossMacros.fatG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.lossMacros.fatK.toFixed(0)} kcal</div>
              </div>
              <div style="padding:8px;background:rgba(74,122,90,.06);border-radius:3px;border:1px solid rgba(74,122,90,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Hidratos</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--ok)">${r.lossMacros.carbG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.lossMacros.carbK.toFixed(0)} kcal</div>
              </div>
            </div>
            <div style="height:180px;margin-top:12px"><canvas id="nutRptLoss_${uid_rpt}"></canvas></div>
          </div>
          <!-- Muscle Gain -->
          <div style="padding:16px;border-radius:4px;border:1px solid rgba(91,79,138,.3);background:rgba(91,79,138,.04)">
            <div style="font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px"><i class="fas fa-dumbbell"></i> Ganancia Muscular (+200 kcal)</div>
            <div style="text-align:center;font-family:'DM Sans',var(--sans);font-size:24px;font-weight:700;color:var(--accent);margin-bottom:12px">${r.gainCal.toFixed(0)} kcal</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
              <div style="padding:8px;background:rgba(160,64,64,.06);border-radius:3px;border:1px solid rgba(160,64,64,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Proteínas</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--danger)">${r.gainMacros.protG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.gainMacros.protK.toFixed(0)} kcal</div>
              </div>
              <div style="padding:8px;background:rgba(158,128,53,.06);border-radius:3px;border:1px solid rgba(158,128,53,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Grasas</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--warn)">${r.gainMacros.fatG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.gainMacros.fatK.toFixed(0)} kcal</div>
              </div>
              <div style="padding:8px;background:rgba(91,79,138,.06);border-radius:3px;border:1px solid rgba(91,79,138,.15)">
                <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">Hidratos</div>
                <div style="font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:var(--ok)">${r.gainMacros.carbG.toFixed(0)}g</div>
                <div style="font-size:10px;color:var(--muted)">${r.gainMacros.carbK.toFixed(0)} kcal</div>
              </div>
            </div>
            <div style="height:180px;margin-top:12px"><canvas id="nutRptGain_${uid_rpt}"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Full table all levels -->
      <div class="rpt-section">
        <div class="rpt-section-title">Reparto por Nivel de Actividad</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--ok);margin-bottom:6px;text-transform:uppercase">Pérdida de Grasa</div>
            <table style="width:100%;font-size:11px;border-collapse:collapse">
              <thead><tr style="background:var(--bg)"><th style="padding:6px;text-align:left">Nivel</th><th style="padding:6px;text-align:center">Prot (g)</th><th style="padding:6px;text-align:center">Grasa (g)</th><th style="padding:6px;text-align:center">HC (g)</th><th style="padding:6px;text-align:center">kcal</th></tr></thead>
              <tbody>${r.allLevels.map(l=>`<tr style="${l.factor===r.activityFactor?'background:rgba(139,115,64,.1);font-weight:600':''}">
                <td style="padding:5px">${l.name}</td><td style="padding:5px;text-align:center">${l.loss.protG.toFixed(0)}</td>
                <td style="padding:5px;text-align:center">${l.loss.fatG.toFixed(0)}</td><td style="padding:5px;text-align:center">${l.loss.carbG.toFixed(0)}</td>
                <td style="padding:5px;text-align:center;font-weight:600">${l.loss.cal.toFixed(0)}</td></tr>`).join('')}</tbody>
            </table>
          </div>
          <div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:6px;text-transform:uppercase">Ganancia Muscular</div>
            <table style="width:100%;font-size:11px;border-collapse:collapse">
              <thead><tr style="background:var(--bg)"><th style="padding:6px;text-align:left">Nivel</th><th style="padding:6px;text-align:center">Prot (g)</th><th style="padding:6px;text-align:center">Grasa (g)</th><th style="padding:6px;text-align:center">HC (g)</th><th style="padding:6px;text-align:center">kcal</th></tr></thead>
              <tbody>${r.allLevels.map(l=>`<tr style="${l.factor===r.activityFactor?'background:rgba(139,115,64,.1);font-weight:600':''}">
                <td style="padding:5px">${l.name}</td><td style="padding:5px;text-align:center">${l.gain.protG.toFixed(0)}</td>
                <td style="padding:5px;text-align:center">${l.gain.fatG.toFixed(0)}</td><td style="padding:5px;text-align:center">${l.gain.carbG.toFixed(0)}</td>
                <td style="padding:5px;text-align:center;font-weight:600">${l.gain.cal.toFixed(0)}</td></tr>`).join('')}</tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Reference -->
      <div class="rpt-section">
        <div class="rpt-section-title">Rangos de Referencia</div>
        <table style="width:100%;font-size:11px;border-collapse:collapse">
          <thead><tr style="background:var(--bg)"><th style="padding:6px;text-align:left">Macronutriente</th><th style="padding:6px;text-align:center">kcal/g</th><th style="padding:6px;text-align:center">Rango (Pérdida)</th><th style="padding:6px;text-align:center">Rango (Ganancia)</th></tr></thead>
          <tbody>
            <tr><td style="padding:5px;font-weight:600;color:var(--danger)">Proteínas</td><td style="padding:5px;text-align:center">4</td><td style="padding:5px;text-align:center">1,8 – 2,5 g/kg</td><td style="padding:5px;text-align:center">1,8 – 2,5 g/kg</td></tr>
            <tr><td style="padding:5px;font-weight:600;color:var(--warn)">Grasas</td><td style="padding:5px;text-align:center">9</td><td style="padding:5px;text-align:center">0,7 – 1,0 g/kg</td><td style="padding:5px;text-align:center">1,0 – 1,5 g/kg</td></tr>
            <tr><td style="padding:5px;font-weight:600;color:var(--ok)">Hidratos de Carbono</td><td style="padding:5px;text-align:center">4</td><td style="padding:5px;text-align:center">Restante</td><td style="padding:5px;text-align:center">Restante</td></tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top:24px;padding-top:12px;border-top:1px solid #e5e7eb;font-size:10px;color:#9ca3af;text-align:center">
        FatigaMonitor Pro · Informe Nutricional · Ecuación Mifflin-St Jeor · ${fmtDate(r.createdAt)}
      </div>
    </div>
  `, 860);

  // Render doughnut charts in modal
  setTimeout(()=>{
    const colors = ['#A04040','#9E8035','#4A7A5A'];
    const labels = ['Proteínas','Grasas','Hidratos'];
    const opts = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{color:'#8A7E6B',font:{size:9,family:'DM Mono'},padding:8,usePointStyle:true}}}};
    const elL = document.getElementById('nutRptLoss_'+uid_rpt);
    const elG = document.getElementById('nutRptGain_'+uid_rpt);
    if(elL) new Chart(elL,{type:'doughnut',data:{labels,datasets:[{data:[r.lossMacros.protK,r.lossMacros.fatK,r.lossMacros.carbK],backgroundColor:colors,borderColor:'#fff',borderWidth:2}]},options:opts});
    if(elG) new Chart(elG,{type:'doughnut',data:{labels,datasets:[{data:[r.gainMacros.protK,r.gainMacros.fatK,r.gainMacros.carbK],backgroundColor:colors,borderColor:'#fff',borderWidth:2}]},options:opts});
  },100);
}

function printNutReport(rid){
  const r = DB.nutritionReports.find(x=>x.id===rid);
  if(!r) return;
  const sexLabel = r.sex==='hombre'?'Hombre':'Mujer';

  // Render offscreen charts to images
  const colors = ['#A04040','#9E8035','#4A7A5A'];
  const labels = ['Proteínas','Grasas','Hidratos'];

  function renderDoughnut(data){
    const c = document.createElement('canvas'); c.width=300; c.height=300;
    document.body.appendChild(c);
    const chart = new Chart(c,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderColor:'#fff',borderWidth:2}]},options:{responsive:false,animation:false,plugins:{legend:{display:true,position:'bottom',labels:{color:'#333',font:{size:10,family:'Inter'},padding:8,usePointStyle:true}}}}});
    const img = c.toDataURL('image/png');
    chart.destroy(); document.body.removeChild(c);
    return img;
  }

  const lossImg = renderDoughnut([r.lossMacros.protK,r.lossMacros.fatK,r.lossMacros.carbK]);
  const gainImg = renderDoughnut([r.gainMacros.protK,r.gainMacros.fatK,r.gainMacros.carbK]);

  function macroBlock(title, color, cal, macros, img){
    return `<div style="flex:1;padding:16px;border:1px solid ${color}33;border-radius:4px;background:${color}08">
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:${color};text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">${title}</div>
      <div style="text-align:center;font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:${color};margin-bottom:10px">${cal.toFixed(0)} kcal</div>
      <table style="width:100%;font-size:10px;border-collapse:collapse;margin-bottom:10px">
        <tr><td style="padding:4px;color:#A04040;font-weight:600">Proteínas</td><td style="padding:4px;text-align:center">${macros.protG.toFixed(0)}g</td><td style="padding:4px;text-align:right;color:#888">${macros.protK.toFixed(0)} kcal</td></tr>
        <tr><td style="padding:4px;color:#9E8035;font-weight:600">Grasas</td><td style="padding:4px;text-align:center">${macros.fatG.toFixed(0)}g</td><td style="padding:4px;text-align:right;color:#888">${macros.fatK.toFixed(0)} kcal</td></tr>
        <tr><td style="padding:4px;color:#4A7A5A;font-weight:600">Hidratos</td><td style="padding:4px;text-align:center">${macros.carbG.toFixed(0)}g</td><td style="padding:4px;text-align:right;color:#888">${macros.carbK.toFixed(0)} kcal</td></tr>
      </table>
      <div style="text-align:center"><img src="${img}" style="width:200px;height:200px"></div>
    </div>`;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe Nutricional — ${r.athleteName}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      @page{size:A4;margin:20mm 18mm}
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Inter',sans-serif;font-size:12px;color:#2C2418;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .page{max-width:210mm;margin:0 auto;padding:20px}
      .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #8B7340;padding-bottom:12px;margin-bottom:20px}
      .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:#2C2418;letter-spacing:2px}
      .logo span{color:#8B7340}
      .meta{text-align:right;font-family:'DM Mono',monospace;font-size:10px;color:#8A7E6B}
      .section{margin-bottom:18px}
      .section-title{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#8A7E6B;border-bottom:1px solid #D6CCBA;padding-bottom:4px;margin-bottom:10px}
      .stats{display:flex;gap:12px;flex-wrap:wrap}
      .stat{flex:1;min-width:80px;text-align:center;padding:10px;background:#F5F0E8;border-radius:3px;border:1px solid #D6CCBA}
      .stat-val{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;color:#8B7340}
      .stat-lbl{font-family:'DM Mono',monospace;font-size:8px;color:#8A7E6B;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
      table{width:100%;border-collapse:collapse;font-size:10px}
      th{background:#F5F0E8;padding:5px;text-align:center;font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#8A7E6B;border:1px solid #D6CCBA}
      td{padding:5px;border:1px solid #D6CCBA;text-align:center}
      .footer{margin-top:20px;padding-top:8px;border-top:1px solid #D6CCBA;font-size:9px;color:#8A7E6B;text-align:center}
      .sel-row{background:rgba(139,115,64,.1);font-weight:600}
    </style>
  </head><body>
    <div class="page">
      <div class="hdr">
        <div><div class="logo">Fatiga<span>Monitor</span> Pro</div><div style="font-size:10px;color:#8A7E6B;margin-top:2px">Informe Nutricional</div></div>
        <div class="meta"><div style="font-weight:600;color:#2C2418">${r.athleteName}</div><div>${fmtDate(r.createdAt)}</div></div>
      </div>

      <div class="section">
        <div class="section-title">Datos Personales</div>
        <div class="stats">
          <div class="stat"><div class="stat-val" style="font-size:14px">${r.athleteName}</div><div class="stat-lbl">Nombre</div></div>
          <div class="stat"><div class="stat-val">${sexLabel}</div><div class="stat-lbl">Sexo</div></div>
          <div class="stat"><div class="stat-val">${r.age}</div><div class="stat-lbl">Edad</div></div>
          <div class="stat"><div class="stat-val">${r.weight} kg</div><div class="stat-lbl">Peso</div></div>
          <div class="stat"><div class="stat-val">${r.height} cm</div><div class="stat-lbl">Altura</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Gasto Energético</div>
        <div class="stats">
          <div class="stat"><div class="stat-val">${r.ger.toFixed(0)}</div><div class="stat-lbl">GER (kcal) — Mifflin-St Jeor</div></div>
          <div class="stat"><div class="stat-val" style="color:#9E8035">${r.totalCal.toFixed(0)}</div><div class="stat-lbl">Total Diario (kcal)</div></div>
          <div class="stat"><div class="stat-val" style="font-size:13px">${r.activityName}</div><div class="stat-lbl">Actividad (×${r.activityFactor})</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Objetivos Nutricionales</div>
        <div style="display:flex;gap:14px">
          ${macroBlock('Pérdida de Grasa (−200 kcal)','#4A7A5A',r.lossCal,r.lossMacros,lossImg)}
          ${macroBlock('Ganancia Muscular (+200 kcal)','#5B4F8A',r.gainCal,r.gainMacros,gainImg)}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Reparto por Nivel de Actividad</div>
        <div style="display:flex;gap:14px">
          <div style="flex:1">
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:#4A7A5A;margin-bottom:4px;text-transform:uppercase">Pérdida de Grasa</div>
            <table><thead><tr><th>Nivel</th><th>Prot (g)</th><th>Grasa (g)</th><th>HC (g)</th><th>kcal</th></tr></thead>
            <tbody>${r.allLevels.map(l=>`<tr class="${l.factor===r.activityFactor?'sel-row':''}"><td style="text-align:left">${l.name}</td><td>${l.loss.protG.toFixed(0)}</td><td>${l.loss.fatG.toFixed(0)}</td><td>${l.loss.carbG.toFixed(0)}</td><td style="font-weight:600">${l.loss.cal.toFixed(0)}</td></tr>`).join('')}</tbody></table>
          </div>
          <div style="flex:1">
            <div style="font-family:'DM Mono',monospace;font-size:9px;color:#5B4F8A;margin-bottom:4px;text-transform:uppercase">Ganancia Muscular</div>
            <table><thead><tr><th>Nivel</th><th>Prot (g)</th><th>Grasa (g)</th><th>HC (g)</th><th>kcal</th></tr></thead>
            <tbody>${r.allLevels.map(l=>`<tr class="${l.factor===r.activityFactor?'sel-row':''}"><td style="text-align:left">${l.name}</td><td>${l.gain.protG.toFixed(0)}</td><td>${l.gain.fatG.toFixed(0)}</td><td>${l.gain.carbG.toFixed(0)}</td><td style="font-weight:600">${l.gain.cal.toFixed(0)}</td></tr>`).join('')}</tbody></table>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Rangos de Referencia</div>
        <table><thead><tr><th style="text-align:left">Macronutriente</th><th>kcal/g</th><th>Rango (Pérdida)</th><th>Rango (Ganancia)</th></tr></thead>
        <tbody>
          <tr><td style="text-align:left;color:#A04040;font-weight:600">Proteínas</td><td>4</td><td>1,8 – 2,5 g/kg</td><td>1,8 – 2,5 g/kg</td></tr>

function setupAthDashCharts(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  if(!ath) return;
  // CMJ
  const cmjData = DB.cmj.filter(c=>c.athleteId===ath.id && c.date>=daysAgo(30)).sort((a,b)=>a.date.localeCompare(b.date));
  const cmjValsAth = cmjData.map(c=>c.value);
  const cmjMinAth = Math.min(...cmjValsAth, ath.cmjBase);
  const cmjMaxAth = Math.max(...cmjValsAth, ath.cmjBase);
  const cmjPadAth = (cmjMaxAth - cmjMinAth) * 0.25 || 2;
  mkChart('chartAthCMJ',{
    type:'line',
    data:{
      labels:cmjData.map(c=>fmtShort(c.date)),
      datasets:[
        {label:'CMJ (cm)',data:cmjValsAth,borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.1)',fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#5B4F8A'},
        {label:'Baseline ('+ath.cmjBase+' cm)',data:cmjData.map(()=>ath.cmjBase),borderColor:'rgba(160,64,64,.7)',borderDash:[6,4],pointRadius:0,borderWidth:2,fill:false}
      ]
    },
    options:{scales:{y:{suggestedMin: cmjMinAth - cmjPadAth, suggestedMax: cmjMaxAth + cmjPadAth}}}
  });
  // Wellness
  const wellData = DB.wellness.filter(w=>w.athleteId===ath.id && w.date>=daysAgo(30)).sort((a,b)=>a.date.localeCompare(b.date));
  mkChart('chartAthWell',{
    type:'line',
    data:{
      labels:wellData.map(w=>fmtShort(w.date)),
      datasets:[
        {label:'Wellness',data:wellData.map(w=>w.score),borderColor:'#4A7A5A',backgroundColor:'rgba(74,122,90,.1)',fill:true,tension:.3,pointRadius:2},
        {label:'Umbral',data:wellData.map(()=>3.5),borderColor:'rgba(139,115,64,.5)',borderDash:[5,5],pointRadius:0,fill:false}
      ]
    },
    options:{scales:{y:{min:1,max:5}}}
  });
}

             'mood|Estado de Ánimo|¿Cómo es tu estado de ánimo hoy?|5=Excelente, 1=Muy malo',
             'sleep|Calidad del Sueño|¿Cómo has dormido esta noche?|5=Muy bien, 1=Muy mal',
             'stress|Nivel de Estrés|¿Cuál es tu nivel de estrés?|5=Sin estrés, 1=Muy estresado',
             'motivation|Motivación|¿Cuál es tu motivación para entrenar?|5=Muy alta, 1=Ninguna'
          ].map(item=>{
            const [key,label,question,scale] = item.split('|');

              <div style="margin-bottom:20px">
                <div class="flex justify-between mb-8">

                  <span style="font-size:12px;color:var(--muted)">${scale}</span>
                </div>
                <div class="stars" data-key="${key}">
                  ${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" onclick="setStar('${key}',${n})">&#9733;</span>`).join('')}
                </div>
              </div>`;
          }).join('')}
        </div>

        <button class="btn btn-primary btn-lg btn-full" onclick="submitCheckin()"><i class="fas fa-check"></i> Enviar Check-in</button>
      </div>
    </div>`;
}

const checkinData = {fatigue:0,mood:0,sleep:0,stress:0,motivation:0};
function setStar(key, val){
  checkinData[key] = val;
  document.querySelectorAll(`.stars[data-key="${key}"] .star`).forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.val)<=val);
  });
}

function submitCheckin(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  const cmjVal = parseFloat(document.getElementById('checkinCMJ').value);
  if(!cmjVal||cmjVal<5||cmjVal>100){ toast('Introduce un valor de CMJ válido (5-100 cm)','error'); return; }
  const keys = ['fatigue','mood','sleep','stress','motivation'];
  if(keys.some(k=>!checkinData[k])){ toast('Completa todas las valoraciones de bienestar','error'); return; }

  // Save CMJ
  DB.cmj.push({id:uid(), athleteId:ath.id, date:TODAY, value:cmjVal});

  // Save Wellness
  const score = +(keys.reduce((s,k)=>s+checkinData[k],0)/5).toFixed(1);
  DB.wellness.push({id:uid(), athleteId:ath.id, date:TODAY, ...checkinData, score});

  save();
  toast('Check-in registrado correctamente');
  // Reset
  keys.forEach(k=>checkinData[k]=0);
  navigate('athlete-dashboard');
  renderSidebar();
}

  const microColors = {gradual:'#2D7A5C',corriente:'#5B4F8A',choque:'#A04040',restablecimiento:'#4A7A5A',competicion:'#9E8035',aproximacion:'#C47820',control:'#7B6EAA'};

        </div>

        ${nextWeeks.map(w=>{
          const pct = (w.targetLoad/25)*100;

          return `<div class="macro-row${w.weekNum===currentWeek?' style="background:rgba(91,79,138,.1);border-radius:8px"':''}">

  const plan = DB.plans.find(p=>p.athleteId===ath.id);
  const currentWeek = plan ? Math.max(1, Math.ceil(diffDays(TODAY, plan.startDate)/7)) : 1;
  const cw = plan ? (plan.weeks.find(w=>w.weekNum===currentWeek) || plan.weeks[0]) : null;
  const sessions = DB.sessions.filter(s=>s.athleteId===ath.id).sort((a,b)=>b.date.localeCompare(a.date));
  const today = sessions.filter(s=>s.date===TODAY);
  const week = sessions.filter(s=>s.date>=daysAgo(7));
  const days = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  const dayLabels = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const dayLabelsFull = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const todayDay = new Date().getDay(); // 0=Sun
  const dayIdx = todayDay===0?6:todayDay-1;

  // Find current mesociclo and microciclo for detailed sessions (allow navigation via params)
  const autoMeso = plan&&plan.mesociclos ? Math.min(Math.ceil(currentWeek/4), plan.mesociclos.length) : 1;
  const autoMicro = ((currentWeek-1)%4)+1;
  const currentMeso = S.params.athMeso || autoMeso;
  const currentMicro = S.params.athMicro || autoMicro;
  const dsKey = `${currentMeso}-${currentMicro}`;
  const detailedSessions = plan&&plan.detailedSessions&&plan.detailedSessions[dsKey] ? plan.detailedSessions[dsKey] : null;

  // Build detailed session cards for today and this week
  let todayDetailHTML = '';
  let weekDetailHTML = '';
  if(detailedSessions){
    const todaySes = detailedSessions[dayIdx];
    if(todaySes){
      const exs = todaySes.exercises.filter(e=>e.name);
      if(exs.length){
        todayDetailHTML = `
          <div class="card mb-24">
            <div class="card-title"><i class="fas fa-dumbbell" style="margin-right:6px"></i>Entrenamiento de Hoy — ${dayLabelsFull[dayIdx]} ${todaySes.volume?'· Vol: '+todaySes.volume:''}</div>
            <div class="tbl-wrap"><table>
              <thead><tr><th>Ejercicio</th><th>Kg</th><th>Serie 1</th><th>Serie 2</th><th>Serie 3</th><th>Serie 4</th><th>RIR</th><th>Desc.</th></tr></thead>
              <tbody>${exs.map(ex=>`<tr>
                <td style="font-weight:600">${ex.name}</td>
                <td><span style="font-family:'DM Sans';font-weight:700;color:var(--primary)">${ex.kg||'—'}</span></td>
                <td>${ex.s1||'—'}</td><td>${ex.s2||'—'}</td><td>${ex.s3||'—'}</td><td>${ex.s4||'—'}</td>
                <td><span style="font-weight:700;color:var(--accent)">${ex.rir||'—'}</span></td>
                <td>${ex.descanso?ex.descanso+"'":"—"}</td>
              </tr>`).join('')}</tbody>
            </table></div>
            ${todaySes.observations?`<div style="font-size:12px;color:var(--muted);margin-top:8px;padding:8px;background:var(--bg);border-radius:3px"><i class="fas fa-comment" style="margin-right:4px"></i>${todaySes.observations}</div>`:''}
          </div>`;
      }
    }
    // All week sessions with exercises
    weekDetailHTML = detailedSessions.map((ses,si)=>{
      const exs = ses.exercises.filter(e=>e.name);
      if(!exs.length) return '';
      const isToday = si===dayIdx;
      return `
        <div class="card mb-16" style="${isToday?'border-color:var(--primary);border-width:2px':''}">
          <div class="flex justify-between items-center mb-12">
            <div class="card-title" style="margin:0"><i class="fas fa-calendar-day" style="margin-right:6px"></i>${dayLabelsFull[si]} — Sesión ${si+1} ${isToday?'<span class="badge badge-pri" style="margin-left:6px">HOY</span>':''}</div>
            <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${ses.volume?'Vol: '+ses.volume:''}</span>
          </div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Ejercicio</th><th>Kg</th><th>Serie 1</th><th>Serie 2</th><th>Serie 3</th><th>Serie 4</th><th>RIR</th><th>Desc.</th></tr></thead>
            <tbody>${exs.map(ex=>`<tr>
              <td style="font-weight:600">${ex.name}</td>
              <td><span style="font-family:'DM Sans';font-weight:700;color:var(--primary)">${ex.kg||'—'}</span></td>
              <td>${ex.s1||'—'}</td><td>${ex.s2||'—'}</td><td>${ex.s3||'—'}</td><td>${ex.s4||'—'}</td>
              <td><span style="font-weight:700;color:var(--accent)">${ex.rir||'—'}</span></td>
              <td>${ex.descanso?ex.descanso+"'":"—"}</td>
            </tr>`).join('')}</tbody>
          </table></div>
          ${ses.observations?`<div style="font-size:12px;color:var(--muted);margin-top:8px;padding:8px;background:var(--bg);border-radius:3px"><i class="fas fa-comment" style="margin-right:4px"></i>${ses.observations}</div>`:''}

    }).join('');
  }

  // Mesociclo selector for athlete to browse weeks
  const athMesoNav = plan&&plan.mesociclos&&plan.mesociclos.length ? `
    <div class="card mb-24">
      <div class="card-title">Planificación del Entrenador — Semana ${currentMicro} del Mesociclo ${currentMeso}</div>
      <div class="flex gap-6 mb-12" style="flex-wrap:wrap">
        ${plan.mesociclos.map(m=>`<button class="btn ${m.num===currentMeso?'btn-primary':'btn-secondary'} btn-sm" onclick="navigate('athlete-workouts',{athMeso:${m.num},athMicro:1})">${m.name}</button>`).join('')}
      </div>
      <div class="flex gap-6">
        ${plan.mesociclos[currentMeso-1]?plan.mesociclos[currentMeso-1].microcycles.map((mc,i)=>`<button class="btn ${i+1===currentMicro?'btn-primary':'btn-secondary'} btn-sm" onclick="navigate('athlete-workouts',{athMeso:${currentMeso},athMicro:${i+1}})">Semana ${i+1}</button>`).join(''):''}
      </div>
    </div>` : '';

  return `
    <div class="pg-header">
      <div><div class="pg-title">Mis Entrenamientos</div><div class="pg-sub">Semana ${currentWeek} · ${cw?getMicroTypeName(cw.type):'—'}</div></div>
      <div class="flex gap-8">

    </div>
    <div class="pg-body">
      ${plan&&plan.schedule?`
      <div class="card mb-24">
        <div class="card-title">Horario Semanal</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
          ${days.map((d,i)=>`<div style="text-align:center;padding:12px;background:${i===dayIdx?'rgba(139,115,64,.1)':'var(--bg)'};border:1px solid ${i===dayIdx?'var(--primary)':'var(--border)'};border-radius:4px">
            <div style="font-family:var(--mono);font-size:10px;color:${i===dayIdx?'var(--primary)':'var(--muted)'};margin-bottom:4px;font-weight:${i===dayIdx?'600':'400'}">${dayLabels[i]}</div>
