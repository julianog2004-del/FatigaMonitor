          </div>
        </div>

        <!-- Wellness -->
        <div class="card mb-24">
          <div class="card-title"><i class="fas fa-heart" style="margin-right:6px"></i>Cuestionario de Bienestar (Wellness Score)</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:20px">Valora cada aspecto del 1 (peor) al 5 (mejor)</div>

          ${['fatigue|Nivel de Fatiga|¿Cómo de fatigado/a te sientes?|5=Sin fatiga, 1=Muy fatigado',
             'mood|Estado de Ánimo|¿Cómo es tu estado de ánimo hoy?|5=Excelente, 1=Muy malo',
             'sleep|Calidad del Sueño|¿Cómo has dormido esta noche?|5=Muy bien, 1=Muy mal',
             'stress|Nivel de Estrés|¿Cuál es tu nivel de estrés?|5=Sin estrés, 1=Muy estresado',
             'motivation|Motivación|¿Cuál es tu motivación para entrenar?|5=Muy alta, 1=Ninguna'
          ].map(item=>{
            const [key,label,question,scale] = item.split('|');
            return `
              <div style="margin-bottom:20px">
                <div class="flex justify-between mb-8">
                  <div><span style="font-weight:600;font-size:14px">${label}</span><br><span style="font-size:12px;color:var(--muted)">${question}</span></div>
                  <span style="font-size:12px;color:var(--muted)">${scale}</span>
                </div>
                <div class="stars" data-key="${key}">
                  ${[1,2,3,4,5].map(n=>`<span class="star" data-val="${n}" onclick="setStar('${key}',${n})">&#9733;</span>`).join('')}
                </div>
              </div>`;
          }).join('')}
        </div>

        <button class="btn btn-primary btn-lg btn-full" onclick="submitCheckin()"><i class="fas fa-check"></i> Enviar Check-in</button>
      </div>
    </div>`;
}

const checkinData = {fatigue:0,mood:0,sleep:0,stress:0,motivation:0};
function setStar(key, val){
  checkinData[key] = val;
  document.querySelectorAll(`.stars[data-key="${key}"] .star`).forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.val)<=val);
  });
}

function submitCheckin(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  const cmjVal = parseFloat(document.getElementById('checkinCMJ').value);
  if(!cmjVal||cmjVal<5||cmjVal>100){ toast('Introduce un valor de CMJ válido (5-100 cm)','error'); return; }
  const keys = ['fatigue','mood','sleep','stress','motivation'];
  if(keys.some(k=>!checkinData[k])){ toast('Completa todas las valoraciones de bienestar','error'); return; }

  // Save CMJ
  DB.cmj.push({id:uid(), athleteId:ath.id, date:TODAY, value:cmjVal});

  // Save Wellness
  const score = +(keys.reduce((s,k)=>s+checkinData[k],0)/5).toFixed(1);
  DB.wellness.push({id:uid(), athleteId:ath.id, date:TODAY, ...checkinData, score});

  save();
  toast('Check-in registrado correctamente');
  // Reset
  keys.forEach(k=>checkinData[k]=0);
  navigate('athlete-dashboard');
  renderSidebar();
}

function viewAthPlan(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  if(!ath) return '';
  const plan = DB.plans.find(p=>p.athleteId===ath.id);
  if(!plan) return `<div class="pg-header"><div><div class="pg-title">Mi Plan de Entrenamiento</div></div></div><div class="pg-body"><div class="empty"><i class="fas fa-calendar-times"></i><p>Tu entrenador aún no ha creado un plan</p></div></div>`;

  const currentWeek = Math.max(1, Math.ceil(diffDays(TODAY, plan.startDate)/7));
  const cw = plan.weeks.find(w=>w.weekNum===currentWeek) || plan.weeks[0];
  const progress = Math.round((currentWeek/52)*100);
  const microColors = {corriente:'#5B4F8A',choque:'#A04040',restablecimiento:'#4A7A5A',competicion:'#9E8035',control:'#7B6EAA'};
  const nextWeeks = plan.weeks.filter(w=>w.weekNum>=currentWeek && w.weekNum<currentWeek+4);

  return `
    <div class="pg-header"><div><div class="pg-title">Mi Plan de Entrenamiento</div><div class="pg-sub">${plan.name}</div></div></div>
    <div class="pg-body">
      <div class="grid-2 mb-24">
        <div class="card">
          <div class="card-title">Progreso del Macrociclo</div>
          <div class="flex items-center gap-12 mb-12">
            <div style="font-family:'DM Sans',var(--sans);font-size:28px;font-weight:700;letter-spacing:-.5px;color:var(--primary-l)">Semana ${currentWeek}</div>
            <div style="font-size:14px;color:var(--muted)">de 52</div>
          </div>
          <div class="pbar" style="height:10px"><div class="pbar-fill" style="width:${progress}%;background:linear-gradient(90deg,var(--primary),var(--accent-alt))"></div></div>
          <div style="font-size:12px;color:var(--muted);margin-top:8px">${progress}% completado · ${52-currentWeek} semanas restantes</div>
        </div>
        <div class="card">
          <div class="card-title">Microciclo Actual</div>
          <div class="flex items-center gap-12 mb-12">
            <span class="micro-tag ${cw.type}" style="font-size:14px;padding:6px 14px">${getMicroTypeName(cw.type)}</span>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Carga objetivo: ${cw.targetLoad}/25</div>
          <div class="pbar"><div class="pbar-fill" style="width:${(cw.targetLoad/25)*100}%;background:${microColors[cw.type]||'var(--accent)'}"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Próximas Semanas</div>
        ${nextWeeks.map(w=>{
          const pct = (w.targetLoad/25)*100;
          const color = microColors[w.type]||'#5B4F8A';
          return `<div class="macro-row${w.weekNum===currentWeek?' style="background:rgba(91,79,138,.1);border-radius:8px"':''}">

            ${w.weekNum===currentWeek?'<span class="badge badge-pri">Actual</span>':''}

      </div>

  if(!ath) return '';
  const plan = DB.plans.find(p=>p.athleteId===ath.id);
  const currentWeek = plan ? Math.max(1, Math.ceil(diffDays(TODAY, plan.startDate)/7)) : 1;
  const cw = plan ? (plan.weeks.find(w=>w.weekNum===currentWeek) || plan.weeks[0]) : null;
  const sessions = DB.sessions.filter(s=>s.athleteId===ath.id).sort((a,b)=>b.date.localeCompare(a.date));
  const today = sessions.filter(s=>s.date===TODAY);
  const week = sessions.filter(s=>s.date>=daysAgo(7));
  const days = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  const dayLabels = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const dayLabelsFull = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const todayDay = new Date().getDay(); // 0=Sun
  const dayIdx = todayDay===0?6:todayDay-1;

  // Find current mesociclo and microciclo for detailed sessions (allow navigation via params)
  const autoMeso = plan&&plan.mesociclos ? Math.min(Math.ceil(currentWeek/4), plan.mesociclos.length) : 1;
  const autoMicro = ((currentWeek-1)%4)+1;
  const currentMeso = S.params.athMeso || autoMeso;
  const currentMicro = S.params.athMicro || autoMicro;
  const dsKey = `${currentMeso}-${currentMicro}`;
  const detailedSessions = plan&&plan.detailedSessions&&plan.detailedSessions[dsKey] ? plan.detailedSessions[dsKey] : null;

  // Build detailed session cards for today and this week
  let todayDetailHTML = '';
  let weekDetailHTML = '';
  if(detailedSessions){
    const todaySes = detailedSessions[dayIdx];
    if(todaySes){
      const exs = todaySes.exercises.filter(e=>e.name);
      if(exs.length){
        todayDetailHTML = `
          <div class="card mb-24">
            <div class="card-title"><i class="fas fa-dumbbell" style="margin-right:6px"></i>Entrenamiento de Hoy — ${dayLabelsFull[dayIdx]} ${todaySes.volume?'· Vol: '+todaySes.volume:''}</div>
            <div class="tbl-wrap"><table>
              <thead><tr><th>Ejercicio</th><th>Kg</th><th>Serie 1</th><th>Serie 2</th><th>Serie 3</th><th>Serie 4</th><th>RIR</th><th>Desc.</th></tr></thead>
              <tbody>${exs.map(ex=>`<tr>
                <td style="font-weight:600">${ex.name}</td>
                <td><span style="font-family:'DM Sans';font-weight:700;color:var(--primary)">${ex.kg||'—'}</span></td>
                <td>${ex.s1||'—'}</td><td>${ex.s2||'—'}</td><td>${ex.s3||'—'}</td><td>${ex.s4||'—'}</td>
                <td><span style="font-weight:700;color:var(--accent)">${ex.rir||'—'}</span></td>
                <td>${ex.descanso?ex.descanso+"'":"—"}</td>
              </tr>`).join('')}</tbody>
            </table></div>
            ${todaySes.observations?`<div style="font-size:12px;color:var(--muted);margin-top:8px;padding:8px;background:var(--bg);border-radius:3px"><i class="fas fa-comment" style="margin-right:4px"></i>${todaySes.observations}</div>`:''}
          </div>`;
      }
    }
    // All week sessions with exercises
    weekDetailHTML = detailedSessions.map((ses,si)=>{
      const exs = ses.exercises.filter(e=>e.name);
      if(!exs.length) return '';
      const isToday = si===dayIdx;
      return `
        <div class="card mb-16" style="${isToday?'border-color:var(--primary);border-width:2px':''}">

function saveAthSession(athId){
  const date = document.getElementById('athSesDate').value;
  const type = document.getElementById('athSesType').value;
  const volume = parseInt(document.getElementById('athSesVol').value)||0;
  const intensity = parseInt(document.getElementById('athSesInt').value)||0;
  const rpe = sesRPEVal || 5;
  const notes = document.getElementById('athSesNotes').value;
  if(!date||!volume){toast('Indica fecha y volumen','error');return;}

  // Save wellness if filled
  const wellResult = saveWellnessFromSession(athId, date);
  if(wellResult===false) return;

  const extLoad = parseFloat(((volume*intensity/100*rpe/10)/10).toFixed(1));
  DB.sessions.push({
    id:uid(), athleteId:athId, coachId: DB.athletes.find(a=>a.id===athId)?.coachId||1,
    date, type, microType:'corriente', volume, intensity, rpe, extLoad,
    notes, logged:true
  });
  save(); closeModal(); sesRPEVal=0; toast('Entrenamiento registrado'+(wellResult===true?' (con wellness)':''));
  navigate('athlete-workouts');
}

function setupProgressCharts(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  if(!ath) return;
  // CMJ (all data)
  const cmjAll = DB.cmj.filter(c=>c.athleteId===ath.id).sort((a,b)=>a.date.localeCompare(b.date));
  mkChart('chartProgCMJ',{
    type:'line',
    data:{
      labels:cmjAll.map(c=>fmtShort(c.date)),
      datasets:[
        {label:'CMJ (cm)',data:cmjAll.map(c=>c.value),borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.1)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#5B4F8A'},
        {label:'Baseline',data:cmjAll.map(()=>ath.cmjBase),borderColor:'rgba(255,255,255,.3)',borderDash:[5,5],pointRadius:0}
      ]
    }
  });
  // Wellness (all data)
  const wellAll = DB.wellness.filter(w=>w.athleteId===ath.id).sort((a,b)=>a.date.localeCompare(b.date));
  mkChart('chartProgWell',{
    type:'line',
    data:{
      labels:wellAll.map(w=>fmtShort(w.date)),
      datasets:[
        {label:'Fatiga',data:wellAll.map(w=>w.fatigue),borderColor:'#A04040',tension:.3,pointRadius:0},
        {label:'Ánimo',data:wellAll.map(w=>w.mood),borderColor:'#5B4F8A',tension:.3,pointRadius:0},
        {label:'Sueño',data:wellAll.map(w=>w.sleep),borderColor:'#7B6EAA',tension:.3,pointRadius:0},
        {label:'Estrés',data:wellAll.map(w=>w.stress),borderColor:'#9E8035',tension:.3,pointRadius:0},
        {label:'Motivación',data:wellAll.map(w=>w.motivation),borderColor:'#4A7A5A',tension:.3,pointRadius:0}
      ]
    },
    options:{scales:{y:{min:1,max:5}}}
  });
  // Weekly load
  const weekLabels=[], weekLoads=[];
  for(let w=7;w>=0;w--){
    weekLabels.push(`Sem -${w}`);
    const from=daysAgo((w+1)*7), to=daysAgo(w*7);
    weekLoads.push(+DB.sessions.filter(s=>s.athleteId===ath.id && s.date>from && s.date<=to).reduce((sum,s)=>sum+s.extLoad,0).toFixed(1));
  }
  mkChart('chartProgLoad',{type:'bar',data:{labels:weekLabels,datasets:[{label:'Carga Semanal',data:weekLoads,backgroundColor:'rgba(91,79,138,.65)',borderRadius:6}]},options:{plugins:{legend:{display:false}}}});
  // Ratio over weeks
  const ratioData=[];
  for(let w=3;w>=0;w--){
    const wAcute = DB.sessions.filter(s=>s.athleteId===ath.id && s.date>daysAgo((w+1)*7) && s.date<=daysAgo(w*7)).reduce((sum,s)=>sum+s.extLoad,0);
    let wChronic = 0;
    for(let cw=0;cw<4;cw++){
      wChronic += DB.sessions.filter(s=>s.athleteId===ath.id && s.date>daysAgo((w+cw+1)*7) && s.date<=daysAgo((w+cw)*7)).reduce((sum,s)=>sum+s.extLoad,0);
    }
    wChronic /= 4;
    ratioData.push(wChronic?+(wAcute/wChronic).toFixed(2):1);
  }
  mkChart('chartProgRatio',{
    type:'line',
    data:{
      labels:['Sem -3','Sem -2','Sem -1','Actual'],
      datasets:[
        {label:'Ratio A/C',data:ratioData,borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.15)',fill:true,tension:.3,pointRadius:6,pointBackgroundColor:'#5B4F8A'},
        {label:'Zona ideal inf.',data:[0.8,0.8,0.8,0.8],borderColor:'rgba(74,122,90,.5)',borderDash:[5,5],pointRadius:0},
        {label:'Zona ideal sup.',data:[1.3,1.3,1.3,1.3],borderColor:'rgba(139,115,64,.5)',borderDash:[5,5],pointRadius:0}
      ]
    },
    options:{scales:{y:{min:0,max:2}}}
  });
}

function createMacrociclo(athId){
  const name = document.getElementById('macroName').value.trim();
  const sport = document.getElementById('macroSport').value.trim();
  const start = document.getElementById('macroStart').value;
  const duration = parseInt(document.getElementById('macroDuration').value)||52;
  const template = document.getElementById('macroTemplate').value;
  const etapas = [document.getElementById('macroEtapa1').value, document.getElementById('macroEtapa2').value, document.getElementById('macroEtapa3').value];
  const obj = document.getElementById('macroObj').value.trim();
  if(!name||!start){toast('Completa nombre y fecha','error');return;}

  const endDate = new Date(new Date(start).getTime() + duration*7*24*60*60*1000).toISOString().slice(0,10);
  const weeks = Array.from({length:duration},(_,i)=>{
    let type='corriente', load=15;
    if(template==='linear'){ type=i%5===4?'restablecimiento':'corriente'; load=i%5===4?10:[13,15,17,19][i%5]; }
    else if(template==='block'){const b=i%6; type=b<3?'corriente':b<5?'choque':'restablecimiento'; load=b<3?[14,16,18][b]:b<5?[20,22][b-3]:10;}
    else if(template==='undulating'){type=['corriente','choque','corriente','restablecimiento'][i%4]; load=[15,20,17,10][i%4];}
    const third=Math.floor(duration/3);
    return {weekNum:i+1, type, targetLoad:load, mesociclo:Math.ceil((i+1)/4), etapa:i<third?etapas[0]:i<third*2?etapas[1]:etapas[2], periodo:i<duration*0.5?'Preparatorio':i<duration*0.8?'Competitivo':'Transitorio', competition:false, notes:''};
  });
  // Remove old plan if exists
  DB.plans = DB.plans.filter(p=>p.athleteId!==athId);
  const numMesos = Math.ceil(duration/4);
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const sesTypes=['Hipertrofia','Fuerza Máx.','Potencia','Aeróbica','Técnica'];
  const mesociclos = Array.from({length:numMesos},(_,mi)=>({
    num:mi+1, name:monthNames[mi%12],
    microcycles: Array.from({length:4},(_,wi)=>({
      weekNum:wi+1,
      sessions: Array.from({length:7},(_,di)=>({
        num:di+1, day:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][di],
        type: di<5 ? sesTypes[di%5] : 'Descanso',
        volume: di<5 ? 80 : 0,
        intensity: di<5 ? 70 : 0
      })),
      observations:''
    }))
  }));
  const evaluations = Array.from({length:numMesos},(_,i)=>({
    num:i+1, date:'', peso:0, grasa:0, masaMuscular:0, biceps:0, pecho:0, cintura:0, cadera:0, muslo:0, gemelo:0, observations:''
  }));
  // Pre-generate detailedSessions for all meso-micro combinations
  const detailedSessions = {};
  mesociclos.forEach(m => {
    m.microcycles.forEach((mc,wi) => {
      detailedSessions[`${m.num}-${wi+1}`] = Array.from({length:7},(_,si)=>({
        num:si+1,
        exercises: Array.from({length:7},()=>({name:'',kg:'',s1:'',s2:'',s3:'',s4:'',rir:'',descanso:''})),
        observations:'', volume:''
      }));
    });
  });
  DB.plans.push({
    id:uid(), athleteId:athId, coachId:S.user.id, name, title:name, sport, startDate:start, endDate,
    schedule:{lunes:sport,martes:'Potencia',miercoles:'Aeróbica',jueves:sport,viernes:'Técnica',sabado:'—',domingo:'—'},
    objectives:[obj,'',''], observations:'', weeks, mesociclos, evaluations, progress:[], detailedSessions
  });
  save(); closeModal(); toast('Macrociclo creado'); navigate('coach-macrociclo',{planAthlete:athId});
}

function addMesociclo(athId){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  if(!plan.mesociclos) plan.mesociclos = [];
  const name = document.getElementById('mesoName').value.trim()||`Mes ${plan.mesociclos.length+1}`;
  const numWeeks = Math.min(8,Math.max(1,parseInt(document.getElementById('mesoWeeks').value)||4));
  const template = document.getElementById('mesoTemplate').value;
  const vol = parseInt(document.getElementById('mesoVol').value)||80;
  const int = parseInt(document.getElementById('mesoInt').value)||70;
  const obj = document.getElementById('mesoObj').value.trim();

  const dayLabels=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const templates = {
    standard: [{t:'Hipertrofia',v:1,i:1},{t:'Fuerza Máx.',v:1.1,i:1.1},{t:'Potencia',v:.9,i:.95},{t:'Aeróbica',v:.8,i:.7},{t:'Técnica',v:.7,i:.6},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0}],
    strength: [{t:'Fuerza Máx.',v:1.2,i:1.2},{t:'Potencia',v:1,i:1},{t:'Descanso',v:0,i:0},{t:'Fuerza Máx.',v:1.1,i:1.15},{t:'Acondicionamiento',v:.7,i:.6},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0}],
    hypertrophy: [{t:'Hipertrofia',v:1.2,i:.85},{t:'Hipertrofia',v:1.1,i:.8},{t:'Potencia',v:.8,i:1},{t:'Hipertrofia',v:1.15,i:.85},{t:'Hipertrofia',v:1,i:.8},{t:'Técnica',v:.6,i:.5},{t:'Descanso',v:0,i:0}],
    deload: [{t:'Técnica',v:.5,i:.5},{t:'Descanso',v:0,i:0},{t:'Aeróbica',v:.4,i:.4},{t:'Descanso',v:0,i:0},{t:'Técnica',v:.5,i:.5},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0}],
    empty: [{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0},{t:'Descanso',v:0,i:0}]
  };
  const tpl = templates[template]||templates.standard;

  const microcycles = Array.from({length:numWeeks},(_,wi)=>({
    weekNum:wi+1,
    sessions: Array.from({length:7},(_,di)=>({
      num:di+1, day:dayLabels[di],
      type:tpl[di].t,
      volume: Math.round(vol*tpl[di].v),
      intensity: Math.round(int*tpl[di].i)
    })),
    observations:''
  }));

  plan.mesociclos.push({num:plan.mesociclos.length+1, name, microcycles, objective:obj});
  // Also add evaluation slot
  if(!plan.evaluations) plan.evaluations=[];
  plan.evaluations.push({num:plan.evaluations.length+1, date:'', peso:0, grasa:0, masaMuscular:0, biceps:0, pecho:0, cintura:0, cadera:0, muslo:0, gemelo:0, observations:''});
  save(); closeModal(); toast(`Mesociclo "${name}" creado con ${numWeeks} microciclos`);
  navigate('coach-mesociclo',{planAthlete:athId, mesoNum:plan.mesociclos.length});
}

// ===== DELETE MESOCICLO =====
function deleteMesociclo(athId, mesoIdx){
  if(!confirm('¿Eliminar este mesociclo completo? Esta acción no se puede deshacer.')) return;
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  plan.mesociclos.splice(mesoIdx,1);
  // Renumber
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save(); toast('Mesociclo eliminado'); navigate('coach-mesociclo',{planAthlete:athId});
}

// ===== RENAME MESOCICLO =====
function renameMesociclo(athId, mesoIdx){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  const newName = prompt('Nuevo nombre para el mesociclo:', plan.mesociclos[mesoIdx].name);
  if(newName && newName.trim()){
    plan.mesociclos[mesoIdx].name = newName.trim();
    save(); navigate('coach-mesociclo', S.params);
  }
}
function renameMesoInline(athId, mesoIdx, value){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  plan.mesociclos[mesoIdx].name = value.trim()||`Mes ${mesoIdx+1}`;
  save();
}

// ===== MOVE MESOCICLO (reorder) =====
function moveMesociclo(athId, mesoIdx, direction){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  const newIdx = mesoIdx + direction;
  if(newIdx<0 || newIdx>=plan.mesociclos.length) return;
  // Swap positions
  const temp = plan.mesociclos[mesoIdx];
  plan.mesociclos[mesoIdx] = plan.mesociclos[newIdx];
  plan.mesociclos[newIdx] = temp;
  // Renumber
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save();
  toast(`Mesociclo movido a posición ${newIdx+1}`);
  navigate('coach-mesociclo',{planAthlete:athId, mesoNum:newIdx+1});
}

// ===== SWAP MESOCICLOS =====
function swapMesociclos(athId, mesoIdxA, mesoIdxB){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  if(mesoIdxA===mesoIdxB) return;
  if(!plan.mesociclos[mesoIdxA]||!plan.mesociclos[mesoIdxB]) return;
  const temp = plan.mesociclos[mesoIdxA];
  plan.mesociclos[mesoIdxA] = plan.mesociclos[mesoIdxB];
  plan.mesociclos[mesoIdxB] = temp;
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save();
  toast(`Mesociclos intercambiados: ${plan.mesociclos[mesoIdxA].name} ↔ ${plan.mesociclos[mesoIdxB].name}`);
  navigate('coach-mesociclo',{planAthlete:athId, mesoNum:mesoIdxA+1});
}

function saveMicroEdit(athId, mesoIdx, weekIdx){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  const mc = plan.mesociclos[mesoIdx].microcycles[weekIdx];
  for(let si=0;si<7;si++){
    mc.sessions[si].type = document.getElementById(`mcType${si}`).value;
    mc.sessions[si].volume = parseInt(document.getElementById(`mcVol${si}`).value)||0;
    mc.sessions[si].intensity = parseInt(document.getElementById(`mcInt${si}`).value)||0;
  }
  mc.observations = document.getElementById('mcObs').value;
  save(); closeModal(); toast('Microciclo actualizado');
  navigate('coach-mesociclo', S.params);
}

function deleteMicrociclo(athId, mesoIdx, weekIdx){
  if(!confirm('¿Eliminar este microciclo?')) return;
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  plan.mesociclos[mesoIdx].microcycles.splice(weekIdx,1);
  plan.mesociclos[mesoIdx].microcycles.forEach((mc,i)=>{mc.weekNum=i+1;});
  save(); closeModal(); toast('Microciclo eliminado');
  navigate('coach-mesociclo', S.params);
}

function deleteAthlete(athId){
  const ath = DB.athletes.find(a=>a.id===athId);

  const name = ath.name;
  // Remove user account
  DB.users = DB.users.filter(u=>u.id!==ath.userId);

  DB.athletes = DB.athletes.filter(a=>a.id!==athId);
  // Remove plans
  DB.plans = DB.plans.filter(p=>p.athleteId!==athId);
  // Remove sessions
  DB.sessions = DB.sessions.filter(s=>s.athleteId!==athId);

let sesRPEVal = 0;
const sesWellData = {fatigue:0,mood:0,sleep:0,stress:0,motivation:0};
function selRPE(el, val){
  sesRPEVal = val;
  el.parentElement.querySelectorAll('.rpe-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function setSesStar(key, val, el){
  sesWellData[key] = val;
  const container = el.closest('.stars');
  container.querySelectorAll('.star').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.val)<=val);
  });
}
function saveWellnessFromSession(athleteId, date){
  const keys = ['fatigue','mood','sleep','stress','motivation'];
  const filled = keys.filter(k=>sesWellData[k]>0);
  if(filled.length===0) return; // No wellness data entered
  if(filled.length<5){toast('Completa las 5 valoraciones de wellness o déjalas todas vacías','warn');return false;}
  // Check if wellness already exists for this athlete+date
  const existing = DB.wellness.find(w=>w.athleteId===athleteId && w.date===date);
  if(existing){
    // Update existing
    keys.forEach(k=>existing[k]=sesWellData[k]);
    existing.score = +(keys.reduce((s,k)=>s+sesWellData[k],0)/5).toFixed(1);
  } else {
    const score = +(keys.reduce((s,k)=>s+sesWellData[k],0)/5).toFixed(1);
    DB.wellness.push({id:uid(), athleteId, date, ...sesWellData, score});
  }
  // Reset
  keys.forEach(k=>sesWellData[k]=0);
  return true;
}

function addSession(){
  const athleteId = parseInt(document.getElementById('sesAthlete').value);
  const date = document.getElementById('sesDate').value;
  const type = document.getElementById('sesType').value;
  const microType = document.getElementById('sesMicro').value;

  toast('Sesión registrada correctamente'+(wellResult===true?' (con wellness)':''));
  navigate(S.view, S.params);
}

// ===== FULL A4 REPORT WITH CHARTS =====
function generateFullReport(aid){
  const ath = getAthleteById(aid);
  if(!ath){toast('Atleta no encontrado','error');return;}
  toast('Generando informe completo...','ok');

  // Gather all data
  const st = getStatus(aid);
  const ratio = getRatio(aid);
  const well = getRecentWellness(aid)||0;
  const cmjChg = getCMJChange(aid);
  const recentCMJ = getRecentCMJ(aid)||0;
  const plan = DB.plans.find(p=>p.athleteId===aid);
  const sessions7 = getAthleteSessions7d(aid);
  const sessions30 = DB.sessions.filter(s=>s.athleteId===aid && s.date>=daysAgo(30));
  const cmjData = DB.cmj.filter(c=>c.athleteId===aid && c.date>=daysAgo(60)).sort((a,b)=>a.date.localeCompare(b.date));
  const wellData = DB.wellness.filter(w=>w.athleteId===aid && w.date>=daysAgo(60)).sort((a,b)=>a.date.localeCompare(b.date));

  // Create offscreen container for charts
  const offscreen = document.createElement('div');
  offscreen.style.cssText='position:fixed;left:-9999px;top:0;width:700px';
  document.body.appendChild(offscreen);

  function makeOffChart(w,h,cfg){
    const wrap = document.createElement('div');
    wrap.style.cssText=`width:${w}px;height:${h}px`;
    const cvs = document.createElement('canvas');
    cvs.width=w; cvs.height=h;
    wrap.appendChild(cvs);
    offscreen.appendChild(wrap);
    cfg.options = cfg.options||{};
    cfg.options.responsive=false;
    cfg.options.animation=false;
    cfg.options.plugins = cfg.options.plugins||{};
    cfg.options.plugins.legend = cfg.options.plugins.legend||{display:true,labels:{color:'#555',font:{size:10,family:'Inter'}}};
    if(cfg.type!=='doughnut'&&cfg.type!=='pie'&&cfg.type!=='scatter'){
      cfg.options.scales = cfg.options.scales||{};
      cfg.options.scales.x=cfg.options.scales.x||{ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}};
      cfg.options.scales.y=cfg.options.scales.y||{ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}};
    }
    const chart = new Chart(cvs, cfg);
    const img = cvs.toDataURL('image/png');
    chart.destroy();
    return img;
  }

  // 1. CMJ Trend
  const imgCMJ = cmjData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:cmjData.map(c=>fmtShort(c.date)),datasets:[
      {label:'CMJ (cm)',data:cmjData.map(c=>c.value),borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.12)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#5B4F8A',borderWidth:2},
      {label:'Baseline',data:cmjData.map(()=>ath.cmjBase),borderColor:'rgba(150,150,150,.4)',borderDash:[5,5],pointRadius:0,borderWidth:1}
    ]}
  }) : null;

  // 2. Wellness Trend
  const imgWell = wellData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:wellData.map(w=>fmtShort(w.date)),datasets:[
      {label:'Wellness',data:wellData.map(w=>w.score),borderColor:'#4A7A5A',backgroundColor:'rgba(74,122,90,.12)',fill:true,tension:.3,pointRadius:2,borderWidth:2},
      {label:'Umbral',data:wellData.map(()=>3.5),borderColor:'rgba(158,128,53,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1}
    ]},
    options:{scales:{y:{min:1,max:5}}}
  }) : null;

  // 3. Wellness Components
  const imgWellComp = wellData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:wellData.map(w=>fmtShort(w.date)),datasets:[
      {label:'Fatiga',data:wellData.map(w=>w.fatigue),borderColor:'#A04040',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Ánimo',data:wellData.map(w=>w.mood),borderColor:'#5B4F8A',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Sueño',data:wellData.map(w=>w.sleep),borderColor:'#7B6EAA',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Estrés',data:wellData.map(w=>w.stress),borderColor:'#9E8035',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Motivación',data:wellData.map(w=>w.motivation),borderColor:'#4A7A5A',tension:.3,pointRadius:0,borderWidth:2}
    ]},
    options:{scales:{y:{min:1,max:5}}}
  }) : null;

  // 4. Weekly Load (8 weeks)
  const wkLabels=[], wkLoads=[];
  for(let w=7;w>=0;w--){
    wkLabels.push('Sem -'+w);
    const from=daysAgo((w+1)*7), to=daysAgo(w*7);
    wkLoads.push(+DB.sessions.filter(s=>s.athleteId===aid&&s.date>from&&s.date<=to).reduce((sum,s)=>sum+s.extLoad,0).toFixed(1));
  }
  const imgLoad = makeOffChart(680,200,{
    type:'bar',
    data:{labels:wkLabels,datasets:[{label:'Carga Semanal',data:wkLoads,backgroundColor:'rgba(91,79,138,.6)',borderRadius:4}]},
    options:{plugins:{legend:{display:false}}}
  });

  // 5. Ratio A/C over weeks
  const ratioArr=[];
  for(let w=3;w>=0;w--){
    const wAcute=DB.sessions.filter(s=>s.athleteId===aid&&s.date>daysAgo((w+1)*7)&&s.date<=daysAgo(w*7)).reduce((sum,s)=>sum+s.extLoad,0);
    let wChronic=0;
    for(let cw=0;cw<4;cw++) wChronic+=DB.sessions.filter(s=>s.athleteId===aid&&s.date>daysAgo((w+cw+1)*7)&&s.date<=daysAgo((w+cw)*7)).reduce((sum,s)=>sum+s.extLoad,0);
    wChronic/=4;
    ratioArr.push(wChronic?+(wAcute/wChronic).toFixed(2):1);
  }
  const imgRatio = makeOffChart(680,200,{
    type:'line',
    data:{labels:['Sem -3','Sem -2','Sem -1','Actual'],datasets:[
      {label:'Ratio A/C',data:ratioArr,borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.12)',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:'#5B4F8A',borderWidth:2},
      {label:'Zona ideal inf.',data:[0.8,0.8,0.8,0.8],borderColor:'rgba(74,122,90,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1},
      {label:'Zona ideal sup.',data:[1.3,1.3,1.3,1.3],borderColor:'rgba(158,128,53,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1}
    ]},
    options:{scales:{y:{min:0,max:2}}}
  });

  // 6. Correlation (Wellness vs CMJ)
  let imgCorr = null;
  const corrData=[];
  cmjData.forEach(c=>{ const w=wellData.find(w=>w.date===c.date); if(w) corrData.push({x:w.score,y:c.value}); });
  if(corrData.length>=3){
    const n=corrData.length,sx=corrData.reduce((s,p)=>s+p.x,0),sy=corrData.reduce((s,p)=>s+p.y,0);
    const sxy=corrData.reduce((s,p)=>s+p.x*p.y,0),sx2=corrData.reduce((s,p)=>s+p.x*p.x,0);
    const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx),intercept=(sy-slope*sx)/n;
    const r=((n*sxy-sx*sy)/Math.sqrt((n*sx2-sx*sx)*(n*corrData.reduce((s,p)=>s+p.y*p.y,0)-sy*sy))).toFixed(2);
    imgCorr = makeOffChart(340,220,{
      type:'scatter',
      data:{datasets:[
        {label:'r='+r,data:corrData,backgroundColor:'#5B4F8A',pointRadius:5},
        {label:'Tendencia',data:[{x:1,y:slope+intercept},{x:5,y:slope*5+intercept}],type:'line',borderColor:'rgba(158,128,53,.6)',borderDash:[5,3],pointRadius:0,borderWidth:2}
      ]},
      options:{scales:{
        x:{title:{display:true,text:'Wellness',color:'#777',font:{size:10}},min:1,max:5,ticks:{stepSize:1,color:'#777'}},
        y:{title:{display:true,text:'CMJ (cm)',color:'#777',font:{size:10}},ticks:{color:'#777'}}
      }}
    });
  }

  // 7. Session type distribution
  const sesTypes={};
  sessions30.forEach(s=>{ const t=getSessionTypeName(s.type); sesTypes[t]=(sesTypes[t]||0)+1; });
  const imgSesTypes = sessions30.length>=1 ? makeOffChart(340,220,{
    type:'doughnut',
    data:{labels:Object.keys(sesTypes),datasets:[{data:Object.values(sesTypes),backgroundColor:['#5B4F8A','#4A7A5A','#9E8035','#A04040','#7B6EAA','#8B7340']}]},
    options:{plugins:{legend:{position:'right'}}}
  }) : null;

  // 8. Body composition chart (evaluations — kg left axis, % right axis)
  const evals = plan && plan.evaluations ? plan.evaluations.filter(e=>e.peso>0) : [];
  let imgBodyComp = null, imgAntro = null;
  if(evals.length>=2){
    const evalLabels = evals.map(e=>e.date?fmtShort(e.date):'Eval '+e.num);

// ===== TOAST =====
function toast(msg, type='ok'){
  const box = document.getElementById('toasts');
  const icons = {ok:'<i class="fas fa-check-circle" style="color:var(--ok)"></i>', error:'<i class="fas fa-times-circle" style="color:var(--danger)"></i>', warn:'<i class="fas fa-exclamation-circle" style="color:var(--warn)"></i>'};
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.innerHTML = `${icons[type]||icons.ok}<span>${msg}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },3000);
}

// ===== INITIALIZATION =====
function repairPlans(){
  // Ensure all plans have detailedSessions for every meso-micro
  DB.plans.forEach(plan => {
    if(!plan.detailedSessions) plan.detailedSessions = {};
    if(plan.mesociclos && plan.mesociclos.length){
      plan.mesociclos.forEach(m => {
        if(m.microcycles){
          m.microcycles.forEach((mc,wi) => {
            const key = `${m.num}-${wi+1}`;
            if(!plan.detailedSessions[key]){
              plan.detailedSessions[key] = Array.from({length:7},(_,si)=>({
                num:si+1,
                exercises: Array.from({length:7},()=>({name:'',kg:'',s1:'',s2:'',s3:'',s4:'',rir:'',descanso:''})),
                observations:'', volume:''
              }));
            }
          });
        }
      });
    }
  });
  save();
}

function init(){
  load();
  repairPlans();
  const savedUser = localStorage.getItem('fm_user');
  if(savedUser){
    try{ S.user = JSON.parse(savedUser); showApp(); }
    catch(e){ document.getElementById('loginPage').classList.remove('hidden'); }
  } else {
    document.getElementById('loginPage').classList.remove('hidden');
  }
  // Enter key on login
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// Reset data (for testing)
function resetData(){ localStorage.removeItem('fm_db'); localStorage.removeItem('fm_user'); location.reload(); }

init();
</script>
</body>
</html>
