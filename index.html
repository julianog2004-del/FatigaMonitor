// Aplica el UID al atleta local y lo sube a la nube inmediatamente.
function linkAthleteGoogleUid(aid){
  const el = document.getElementById('linkGoogleUidInput');
  const uid = (el?.value||'').trim();
  if(!uid){ toast('Pega el UID del atleta','error'); return; }
  if(!/^[A-Za-z0-9_-]{10,}$/.test(uid)){ toast('UID inválido — debería ser una cadena alfanumérica','error'); return; }
  const ath = getAthleteById(aid);
  if(!ath) return;
  const dup = (DB.athletes||[]).find(x=>x.googleUid===uid && x.id!==aid);
  if(dup){ toast('Este UID ya está vinculado a '+dup.name,'error'); return; }
  ath.googleUid = uid;
  save(); // dispara _scheduleCloudSync que escribe athleteLinks + athletePlans
  toast('Cuenta vinculada. El atleta ya puede acceder a su plan desde su dispositivo.','ok');
  closeModal();
  navigate('coach-athlete-detail',{id:aid});
}

// Rompe la vinculación — borra los documentos de Firestore y quita el googleUid local.
async function unlinkAthleteGoogleUid(aid){
  const ath = getAthleteById(aid);
  if(!ath?.googleUid) return;
  if(!confirm('¿Desvincular la cuenta Google de '+ath.name+'?\nEl atleta perderá acceso a su plan desde su dispositivo.')) return;
  const oldUid = ath.googleUid;
  delete ath.googleUid;
  save();
  // Limpieza cloud (best-effort — las reglas permiten que el coach propietario borre).
  if(window.FB?.ready && window._fbUid){
    try{
      const FB = window.FB;
      await Promise.all([
        FB.deleteDoc(FB.doc(FB.db, 'athleteLinks', oldUid)).catch(()=>{}),
        FB.deleteDoc(FB.doc(FB.db, 'athletePlans', oldUid)).catch(()=>{})
      ]);
    }catch(e){ console.warn('[unlink cloud cleanup]', e); }
  }
  toast('Cuenta Google desvinculada','ok');
  navigate('coach-athlete-detail',{id:aid});
}

// ===== MACROCICLO ADAPTATIVO — aplica teoría del entrenamiento al perfil deportivo =====
// Distribuye etapas y microciclos alrededor de las fechas de competición, y escala volumen/intensidad por nivel.
function buildAdaptiveMacrociclo({athId, coachId, name, sport, sportCategory, level, goals, competitionDates, competitionType}){
  const cat = SPORT_CATEGORIES[sportCategory] || SPORT_CATEGORIES['Otro'];
  const lvl = ATHLETE_LEVELS[level] || ATHLETE_LEVELS['Intermedio'];
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dayNames=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const startDate = TODAY;
  const endDate = new Date(new Date(TODAY).getTime() + 365*24*60*60*1000).toISOString().slice(0,10);

  // 1) Tipos de sesión priorizados por énfasis del deporte + objetivos del atleta
  //    Cada objetivo refuerza 1-2 cualidades; la lista final mantiene las 5 más relevantes
  const emph = {...cat.emphasis};
  const goalBoost = {
    'Fuerza máxima':{fmax:+0.2}, 'Hipertrofia':{hipertrofia:+0.25},
    'Potencia':{potencia:+0.2}, 'Velocidad':{potencia:+0.15},
    'Resistencia aeróbica':{resAerobica:+0.25}, 'Resistencia anaeróbica':{resAnaerobica:+0.25},
    'Umbral anaeróbico':{resAerobica:+0.15, resAnaerobica:+0.15},
    'Técnica':{tecnica:+0.2}, 'Rendimiento competitivo':{potencia:+0.1,fmax:+0.1},
    'Prevención de lesiones':{tecnica:+0.15}, 'Rehabilitación':{tecnica:+0.2}, 'Salud general':{resAerobica:+0.1}
  };
  (goals||[]).forEach(g => { const b = goalBoost[g]||{}; for(const k in b) emph[k] = Math.min(1.3, (emph[k]||0) + b[k]); });
  const qualityToSession = {fmax:'Fuerza Máx.', potencia:'Potencia', hipertrofia:'Hipertrofia', resAerobica:'Aeróbica', resAnaerobica:'Anaeróbica', tecnica:'Técnica'};
  const ranked = Object.entries(emph).sort((a,b)=>b[1]-a[1]).map(([k])=>qualityToSession[k]);
  const sesPriority = [...new Set(ranked)].slice(0,5);

  // 2) Distribución semanal: 5 sesiones + 2 descansos (puede variar por nivel)
  const sesPerWeek = level==='Iniciante' ? 4 : level==='Elite' ? 6 : 5;
  const weeklySes = Array.from({length:7}, (_,di) => di < sesPerWeek ? sesPriority[di % sesPriority.length] : 'Descanso');

  // 3) Mapeo de fechas de competición al número de semana (1..52)
  const tStart = new Date(startDate).getTime();
  const compWeeks = (competitionDates||[]).map(d => {
    const t = new Date(d).getTime();
    const w = Math.round((t - tStart)/(7*24*3600*1000)) + 1;
    return w >= 1 && w <= 52 ? w : null;
  }).filter(Boolean);

  // 4) Generar las 52 semanas con periodización adaptativa
  const weeks = Array.from({length:52}, (_,i) => {
    const weekNum = i+1;
    const mesociclo = Math.ceil(weekNum/4);
    // ¿cerca de una competición?
    const nearestComp = compWeeks.length ? compWeeks.reduce((best,cw) => Math.abs(cw-weekNum) < Math.abs(best-weekNum) ? cw : best, compWeeks[0]) : null;
    const distToComp = nearestComp!=null ? nearestComp - weekNum : null;

    let type = 'corriente', etapa = 'General', periodo = 'Preparatorio', targetLoad = 15, competition = false;
    if(distToComp === 0){
      type = 'competicion';     etapa = 'Competiciones';         periodo = 'Competitivo'; targetLoad = 12; competition = true;
    } else if(distToComp != null && distToComp > 0 && distToComp <= 2){
      type = 'aproximacion';    etapa = 'Estabilización';        periodo = 'Competitivo'; targetLoad = 17;
    } else if(distToComp != null && distToComp < 0 && distToComp >= -1){
      type = 'restablecimiento';etapa = 'Recuperación post-comp'; periodo = 'Transitorio'; targetLoad = 8;
    } else {
      // Planificación por fase general según mesociclo y patrón del nivel
      const microPattern = lvl.pattern;
      type = microPattern[(weekNum-1) % 4];
      if(mesociclo <= 3){        etapa = 'Preparación General';    periodo = 'Preparatorio'; }
      else if(mesociclo <= 6){   etapa = 'Preparación Específica'; periodo = 'Preparatorio'; }
      else if(mesociclo <= 9){   etapa = 'Precompetitiva';         periodo = 'Competitivo'; }
      else if(mesociclo <= 11){  etapa = 'Competitiva';            periodo = 'Competitivo'; }
      else {                     etapa = 'Transición';             periodo = 'Transitorio'; }
      targetLoad = type==='choque'?21 : type==='aproximacion'?17 : type==='gradual'?10 : type==='restablecimiento'?8 : 15;
    }
    // Escalado por nivel del atleta
    targetLoad = Math.round(targetLoad * (type==='restablecimiento' ? lvl.restMult : lvl.volMult));
    return {weekNum, type, targetLoad, mesociclo, etapa, periodo, competition, notes: competition ? `Competición: ${competitionType||'—'}` : ''};
  });

  // 5) Mesociclos (12) con microciclos (4) y sesiones diarias. Volumen/intensidad escalados.
  const newMesociclos = Array.from({length:12}, (_,mi) => ({
    num: mi+1, name: monthNames[mi],
    microcycles: Array.from({length:4}, (_,wi) => {
      const w = weeks[mi*4 + wi] || {type:'corriente'};
      const volBase = w.type==='choque' ? 100 : w.type==='competicion' ? 60 : w.type==='restablecimiento' ? 50 : w.type==='aproximacion' ? 85 : w.type==='gradual' ? 60 : 80;
      const intBase = w.type==='choque' ? 85 : w.type==='competicion' ? 95 : w.type==='restablecimiento' ? 55 : w.type==='aproximacion' ? 80 : w.type==='gradual' ? 60 : 70;
      return {
        weekNum: wi+1,
        sessions: Array.from({length:7}, (_,di) => ({
          num: di+1, day: dayNames[di],
          type: weeklySes[di],
          volume: weeklySes[di]==='Descanso' ? 0 : Math.round(volBase * lvl.volMult),
          intensity: weeklySes[di]==='Descanso' ? 0 : Math.round(intBase * lvl.intMult)
        })),
        observations: w.competition ? `Semana de competición (${competitionType||'—'})` : ''
      };
    })
  }));

  const newEvaluations = Array.from({length:12}, (_,i) => ({
    num:i+1, date:'', peso:0, grasa:0, masaMuscular:0, biceps:0, pecho:0, cintura:0, cadera:0, muslo:0, gemelo:0, observations:''
  }));
  const newDetailedSessions = {};
  newMesociclos.forEach(m => {
    m.microcycles.forEach((mc, wi) => {
      newDetailedSessions[`${m.num}-${wi+1}`] = Array.from({length:7}, (_,si) => ({
        num: si+1,
        exercises: Array.from({length:7}, () => ({name:'',kg:'',s1:'',s2:'',s3:'',s4:'',rir:'',descanso:''})),
        observations:'', volume:''
      }));
    });
  });

  // 6) Objetivos del plan: del atleta + refuerzos por categoría deportiva
  const planObjectives = [
    ...(goals && goals.length ? goals : cat.defaultGoals).slice(0,3),
    ...(competitionDates && competitionDates.length ? [`${competitionDates.length} competición(es) planificada(s)`] : [])
  ].slice(0,4);
  while(planObjectives.length < 3) planObjectives.push('');

  return {
    id: uid(), athleteId: athId, coachId,
    name: `Macrociclo ${name}`,
    title: `Macrociclo de ${sport||'entrenamiento'} — ${sportCategory}/${level}`,
    sport,
    sportCategory, level, goals,
    competitionDates, competitionType,
    macroType: cat.planTemplate,
    startDate, endDate,
    schedule: {
      lunes: weeklySes[0], martes: weeklySes[1], miercoles: weeklySes[2],
      jueves: weeklySes[3], viernes: weeklySes[4], sabado: weeklySes[5], domingo: weeklySes[6]
    },
    objectives: planObjectives,
    observations: `Plantilla ${cat.planTemplate} · ${sesPerWeek} sesiones/sem · volumen ×${lvl.volMult} · intensidad ×${lvl.intMult}`,
    weeks, mesociclos: newMesociclos, evaluations: newEvaluations, progress: [], detailedSessions: newDetailedSessions
  };
}

  const name = ath.name;
  // Remove user account
  DB.users = DB.users.filter(u=>u.id!==ath.userId);

  DB.athletes = DB.athletes.filter(a=>a.id!==athId);
  // Remove plans
  DB.plans = DB.plans.filter(p=>p.athleteId!==athId);
  // Remove sessions
  DB.sessions = DB.sessions.filter(s=>s.athleteId!==athId);
  // Remove wellness

let sesRPEVal = 0;
const sesWellData = {fatigue:0,mood:0,sleep:0,stress:0,motivation:0};
function selRPE(el, val){
  sesRPEVal = val;
  el.parentElement.querySelectorAll('.rpe-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}
function setSesStar(key, val, el){
  sesWellData[key] = val;
  const container = el.closest('.stars');
  container.querySelectorAll('.star').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.val)<=val);
  });
}
function saveWellnessFromSession(athleteId, date){
  const keys = ['fatigue','mood','sleep','stress','motivation'];
  const filled = keys.filter(k=>sesWellData[k]>0);
  if(filled.length===0) return; // No wellness data entered
  if(filled.length<5){toast('Completa las 5 valoraciones de wellness o déjalas todas vacías','warn');return false;}
  // Check if wellness already exists for this athlete+date
  const existing = DB.wellness.find(w=>w.athleteId===athleteId && w.date===date);
  if(existing){
    // Update existing
    keys.forEach(k=>existing[k]=sesWellData[k]);
    existing.score = +(keys.reduce((s,k)=>s+sesWellData[k],0)/5).toFixed(1);
  } else {
    const score = +(keys.reduce((s,k)=>s+sesWellData[k],0)/5).toFixed(1);
    DB.wellness.push({id:uid(), athleteId, date, ...sesWellData, score});
  }
  // Reset
  keys.forEach(k=>sesWellData[k]=0);
  return true;
}

function addSession(){
  const athleteId = parseInt(document.getElementById('sesAthlete').value);
  const date = document.getElementById('sesDate').value;
  const type = document.getElementById('sesType').value;
  const microType = document.getElementById('sesMicro').value;

  const intensity = parseInt(document.getElementById('sesInt').value)||0;
  const extLoad = parseFloat(document.getElementById('sesLoad').value)||0;
  const notes = document.getElementById('sesNotes').value;
  if(!athleteId||!date){toast('Selecciona atleta y fecha','error');return;}

  // Save wellness if filled
  const wellResult = saveWellnessFromSession(athleteId, date);
  if(wellResult===false) return; // Partial wellness, show warning

  DB.sessions.push({id:uid(), athleteId, date, type, microType, volume, intensity, extLoad, rpe:sesRPEVal, notes});
  save();
  closeModal();
  sesRPEVal=0;
  toast('Sesión registrada correctamente'+(wellResult===true?' (con wellness)':''));
  navigate(S.view, S.params);
}

// ===== FULL A4 REPORT WITH CHARTS =====
function generateFullReport(aid){
  const ath = getAthleteById(aid);
  if(!ath){toast('Atleta no encontrado','error');return;}
  toast('Generando informe completo...','ok');

  // Gather all data
  const st = getStatus(aid);
  const ratio = getRatio(aid);
  const well = getRecentWellness(aid)||0;
  const cmjChg = getCMJChange(aid);
  const recentCMJ = getRecentCMJ(aid)||0;
  const plan = DB.plans.find(p=>p.athleteId===aid);
  const sessions7 = getAthleteSessions7d(aid);
  const sessions30 = DB.sessions.filter(s=>s.athleteId===aid && s.date>=daysAgo(30));
  const cmjData = DB.cmj.filter(c=>c.athleteId===aid && c.date>=daysAgo(60)).sort((a,b)=>a.date.localeCompare(b.date));
  const wellData = DB.wellness.filter(w=>w.athleteId===aid && w.date>=daysAgo(60)).sort((a,b)=>a.date.localeCompare(b.date));

  // Create offscreen container for charts
  const offscreen = document.createElement('div');
  offscreen.style.cssText='position:fixed;left:-9999px;top:0;width:700px';
  document.body.appendChild(offscreen);

  function makeOffChart(w,h,cfg){
    const wrap = document.createElement('div');
    wrap.style.cssText=`width:${w}px;height:${h}px`;
    const cvs = document.createElement('canvas');
    cvs.width=w; cvs.height=h;
    wrap.appendChild(cvs);
    offscreen.appendChild(wrap);
    cfg.options = cfg.options||{};
    cfg.options.responsive=false;
    cfg.options.animation=false;
    cfg.options.plugins = cfg.options.plugins||{};
    cfg.options.plugins.legend = cfg.options.plugins.legend||{display:true,labels:{color:'#555',font:{size:10,family:'Inter'}}};
    if(cfg.type!=='doughnut'&&cfg.type!=='pie'&&cfg.type!=='scatter'){
      cfg.options.scales = cfg.options.scales||{};
      cfg.options.scales.x=cfg.options.scales.x||{ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}};
      cfg.options.scales.y=cfg.options.scales.y||{ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}};
    }
    const chart = new Chart(cvs, cfg);
    const img = cvs.toDataURL('image/png');
    chart.destroy();
    return img;
  }

  // 1. CMJ Trend
  const rptCmjVals = cmjData.map(c=>c.value);
  const rptCmjMin = Math.min(...rptCmjVals, ath.cmjBase);
  const rptCmjMax = Math.max(...rptCmjVals, ath.cmjBase);
  const rptCmjPad = (rptCmjMax - rptCmjMin) * 0.25 || 2;
  const imgCMJ = cmjData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:cmjData.map(c=>fmtShort(c.date)),datasets:[
      {label:'CMJ (cm)',data:rptCmjVals,borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.12)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#5B4F8A',borderWidth:2},
      {label:'Baseline ('+ath.cmjBase+' cm)',data:cmjData.map(()=>ath.cmjBase),borderColor:'rgba(160,64,64,.7)',borderDash:[6,4],pointRadius:0,borderWidth:2}
    ]},
    options:{scales:{y:{suggestedMin: rptCmjMin - rptCmjPad, suggestedMax: rptCmjMax + rptCmjPad}}}
  }) : null;

  // 2. Wellness Trend
  const imgWell = wellData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:wellData.map(w=>fmtShort(w.date)),datasets:[
      {label:'Wellness',data:wellData.map(w=>w.score),borderColor:'#4A7A5A',backgroundColor:'rgba(74,122,90,.12)',fill:true,tension:.3,pointRadius:2,borderWidth:2},
      {label:'Umbral',data:wellData.map(()=>3.5),borderColor:'rgba(158,128,53,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1}
    ]},
    options:{scales:{y:{min:1,max:5}}}
  }) : null;

  // 3. Wellness Components
  const imgWellComp = wellData.length>=2 ? makeOffChart(680,220,{
    type:'line',
    data:{labels:wellData.map(w=>fmtShort(w.date)),datasets:[
      {label:'Fatiga',data:wellData.map(w=>w.fatigue),borderColor:'#A04040',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Ánimo',data:wellData.map(w=>w.mood),borderColor:'#5B4F8A',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Sueño',data:wellData.map(w=>w.sleep),borderColor:'#7B6EAA',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Estrés',data:wellData.map(w=>w.stress),borderColor:'#9E8035',tension:.3,pointRadius:0,borderWidth:2},
      {label:'Motivación',data:wellData.map(w=>w.motivation),borderColor:'#4A7A5A',tension:.3,pointRadius:0,borderWidth:2}
    ]},
    options:{scales:{y:{min:1,max:5}}}
  }) : null;

  // 4. Weekly Load (8 weeks)
  const wkLabels=[], wkLoads=[];
  for(let w=7;w>=0;w--){
    wkLabels.push(''+(8-w));
    const from=daysAgo((w+1)*7), to=daysAgo(w*7);
    wkLoads.push(+DB.sessions.filter(s=>s.athleteId===aid&&s.date>from&&s.date<=to).reduce((sum,s)=>sum+s.extLoad,0).toFixed(1));
  }
  const hasLoadData = wkLoads.some(v=>v>0);
  const imgLoad = hasLoadData ? makeOffChart(680,200,{
    type:'bar',
    data:{labels:wkLabels,datasets:[{label:'Carga Semanal',data:wkLoads,backgroundColor:'rgba(91,79,138,.6)',borderRadius:4}]},
    options:{scales:{x:{title:{display:true,text:'Semanas',color:'#555',font:{size:10,family:'Inter'}}}},plugins:{legend:{display:false}}}
  }) : null;

  // 5. Ratio A/C over weeks
  const ratioArr=[];
  for(let w=3;w>=0;w--){
    const wAcute=DB.sessions.filter(s=>s.athleteId===aid&&s.date>daysAgo((w+1)*7)&&s.date<=daysAgo(w*7)).reduce((sum,s)=>sum+s.extLoad,0);
    let wChronic=0;
    for(let cw=0;cw<4;cw++) wChronic+=DB.sessions.filter(s=>s.athleteId===aid&&s.date>daysAgo((w+cw+1)*7)&&s.date<=daysAgo((w+cw)*7)).reduce((sum,s)=>sum+s.extLoad,0);
    wChronic/=4;
    ratioArr.push(wChronic?+(wAcute/wChronic).toFixed(2):0);
  }
  const hasRatioData = ratioArr.some(v=>v>0);
  const imgRatio = hasRatioData ? makeOffChart(680,200,{
    type:'line',
    data:{labels:['1','2','3','4'],datasets:[
      {label:'Ratio A/C',data:ratioArr.map(v=>v||null),borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.12)',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:'#5B4F8A',borderWidth:2,spanGaps:true},
      {label:'Zona ideal inf.',data:[0.8,0.8,0.8,0.8],borderColor:'rgba(74,122,90,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1},
      {label:'Zona ideal sup.',data:[1.3,1.3,1.3,1.3],borderColor:'rgba(158,128,53,.5)',borderDash:[5,5],pointRadius:0,borderWidth:1}
    ]},
    options:{scales:{x:{title:{display:true,text:'Semanas',color:'#555',font:{size:10,family:'Inter'}}},y:{min:0,max:2}}}
  }) : null;

  // 6. Correlation (Wellness vs CMJ)
  let imgCorr = null;
  const corrData=[];
  cmjData.forEach(c=>{ const w=wellData.find(w=>w.date===c.date); if(w) corrData.push({x:w.score,y:c.value}); });
  if(corrData.length>=3){
    const n=corrData.length,sx=corrData.reduce((s,p)=>s+p.x,0),sy=corrData.reduce((s,p)=>s+p.y,0);
    const sxy=corrData.reduce((s,p)=>s+p.x*p.y,0),sx2=corrData.reduce((s,p)=>s+p.x*p.x,0);
    const slope=(n*sxy-sx*sy)/(n*sx2-sx*sx),intercept=(sy-slope*sx)/n;
    const r=((n*sxy-sx*sy)/Math.sqrt((n*sx2-sx*sx)*(n*corrData.reduce((s,p)=>s+p.y*p.y,0)-sy*sy))).toFixed(2);
    imgCorr = makeOffChart(340,220,{
      type:'scatter',
      data:{datasets:[
        {label:'r='+r,data:corrData,backgroundColor:'#5B4F8A',pointRadius:5},
        {label:'Tendencia',data:[{x:1,y:slope+intercept},{x:5,y:slope*5+intercept}],type:'line',borderColor:'rgba(158,128,53,.6)',borderDash:[5,3],pointRadius:0,borderWidth:2}
      ]},
      options:{scales:{
        x:{title:{display:true,text:'Wellness',color:'#777',font:{size:10}},min:1,max:5,ticks:{stepSize:1,color:'#777'}},
        y:{title:{display:true,text:'CMJ (cm)',color:'#777',font:{size:10}},ticks:{color:'#777'}}
      }}
    });
  }

  // 7. Session type distribution
  const sesTypes={};
  sessions30.forEach(s=>{ const t=getSessionTypeName(s.type); sesTypes[t]=(sesTypes[t]||0)+1; });
  const imgSesTypes = sessions30.length>=1 ? makeOffChart(340,220,{

    data:{labels:Object.keys(sesTypes),datasets:[{data:Object.values(sesTypes),backgroundColor:['#5B4F8A','#4A7A5A','#9E8035','#A04040','#7B6EAA','#8B7340']}]},
    options:{plugins:{legend:{position:'right'}}}
  }) : null;

  // 8. Body composition chart (evaluations — kg left axis, % right axis)
  const evals = plan && plan.evaluations ? plan.evaluations.filter(e=>e.peso>0) : [];
  let imgBodyComp = null, imgAntro = null;
  if(evals.length>=2){
    const evalLabels = evals.map(e=>e.date?fmtShort(e.date):'Eval '+e.num);
    imgBodyComp = makeOffChart(680,200,{

        {label:'Masa Muscular (kg)',data:evals.map(e=>e.masaMuscular),borderColor:'#4A7A5A',tension:.3,pointRadius:5,pointBackgroundColor:'#4A7A5A',borderWidth:2,yAxisID:'y'},
        {label:'Grasa (%)',data:evals.map(e=>e.grasa),borderColor:'#A04040',tension:.3,pointRadius:5,pointBackgroundColor:'#A04040',borderWidth:2,borderDash:[4,4],yAxisID:'y1'}

      options:{scales:{

    ];
    const antroBase = evals[0];
    imgAntro = makeOffChart(680,220,{
      type:'line',
      data:{labels:evalLabels,datasets:antroFields.map(f=>({

          const base = antroBase[f.key];

    });
  }

  // 9. Progress lifts chart — dynamic exercises (CMJ chart removed)
  if(plan) ensureProgressSchema(plan);
  const progExNames = plan && Array.isArray(plan.progressExercises) ? plan.progressExercises : [];

  let imgLifts = null, imgTotal = null;

    });
    // Total kg per month (sum of all exercises)
    imgTotal = makeOffChart(680,180,{
      type:'bar',
      data:{labels:pLabels,datasets:[
        {label:'Total (suma de ejercicios)',data:progData.map(p=>p.exercises.reduce((s,v)=>s+(+v||0),0)),backgroundColor:'rgba(91,79,138,.55)',borderRadius:6}
      ]},
      options:{plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'kg totales',color:'#777',font:{size:9}},ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}},x:{ticks:{color:'#777',font:{size:9}},grid:{color:'rgba(0,0,0,.08)'}}}}
    });
  }

  // 10. Macrociclo — Distribución de carga por semana (plan.weeks)
  let imgMacro = null;
  if(plan && plan.weeks && plan.weeks.length>=2){
    const microColors = {gradual:'#2D7A5C',corriente:'#5B4F8A',choque:'#A04040',restablecimiento:'#4A7A5A',competicion:'#9E8035',aproximacion:'#C47820',control:'#7B6EAA'};
    const mLabels = plan.weeks.map(w=>'S'+w.weekNum);
    const mData = plan.weeks.map(w=>w.targetLoad||0);
    const mColors = plan.weeks.map(w=>microColors[w.type]||'#5B4F8A');
    imgMacro = makeOffChart(680,220,{
      type:'bar',
      data:{labels:mLabels,datasets:[{label:'Carga planificada',data:mData,backgroundColor:mColors,borderRadius:4}]},
      options:{scales:{x:{title:{display:true,text:'Semanas del macrociclo',color:'#555',font:{size:10,family:'Inter'}}},y:{title:{display:true,text:'Carga (0-25)',color:'#777',font:{size:9}},min:0,max:25}},plugins:{legend:{display:false}}}
    });
  }

  // Cleanup offscreen
  document.body.removeChild(offscreen);

  // Build evaluation table HTML
  let evalTableHTML = '';
  if(evals.length){
    const anyObs = evals.some(ev=>ev.observations && ev.observations.trim());
    evalTableHTML = '<div class="section-title">Evaluaciones Mensuales</div>'+
      '<table><thead><tr><th>Eval.</th><th>Fecha</th><th>Peso (kg)</th><th>Grasa (%)</th><th>M. Musc. (kg)</th><th>Bíceps</th><th>Pecho</th><th>Cintura</th><th>Cadera</th><th>Muslo</th><th>Gemelo</th></tr></thead><tbody>'+
      evals.map((ev,i)=>{
        const prev = i>0?evals[i-1]:null;
        const delta = (v,pv,inv)=>{ if(!prev||!pv) return ''; const d=v-pv; if(Math.abs(d)<0.05) return ''; const col=inv?(d<0?'#4A7A5A':'#A04040'):(d>0?'#4A7A5A':'#A04040'); return ' <span style="font-size:8px;color:'+col+'">'+(d>0?'+':'')+d.toFixed(1)+'</span>'; };
        return '<tr>'+
          '<td style="font-weight:600">'+ev.num+'</td>'+
          '<td>'+(ev.date?fmtShort(ev.date):'—')+'</td>'+
          '<td>'+ev.peso+delta(ev.peso,prev?.peso,false)+'</td>'+
          '<td>'+ev.grasa+delta(ev.grasa,prev?.grasa,true)+'</td>'+
          '<td>'+ev.masaMuscular+delta(ev.masaMuscular,prev?.masaMuscular,false)+'</td>'+
          '<td>'+ev.biceps+'</td><td>'+ev.pecho+'</td><td>'+ev.cintura+'</td>'+
          '<td>'+ev.cadera+'</td><td>'+ev.muslo+'</td><td>'+ev.gemelo+'</td>'+
        '</tr>';
      }).join('')+
      '</tbody></table>';
    // Per-evaluation observations if any
    if(anyObs){
      evalTableHTML += '<div style="margin-top:10px"><div style="font-family:DM Mono,monospace;font-size:8px;color:#8B7340;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">Observaciones por evaluación</div>'+
        evals.filter(ev=>ev.observations && ev.observations.trim()).map(ev=>
          '<div style="font-size:10px;color:#555;padding:5px 8px;background:#F8F6F0;border-left:2px solid #9E8035;margin-bottom:4px;border-radius:2px"><strong style="color:#5B4F8A">'+ev.num+'.ª Eval. ('+(ev.date?fmtShort(ev.date):'—')+'):</strong> '+ev.observations+'</div>'
        ).join('')+'</div>';
    }
  }

  // Build semáforo colors
  const semCol = st==='verde'?'#3A8A4A':st==='amarillo'?'#C8A030':'#C04040';
  const semBg = st==='verde'?'rgba(74,122,90,.15)':st==='amarillo'?'rgba(158,128,53,.15)':'rgba(160,64,64,.15)';

  // Today's workout
  let workoutHTML = '';
  if(plan && plan.detailedSessions){

    const mNum = Math.min(Math.ceil(currentWeek/4),plan.mesociclos?plan.mesociclos.length:1);
    const wNum = ((currentWeek-1)%4)+1;

    const dayNames=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
    if(ds && ds[dayI]){

      if(exs.length){
        workoutHTML = '<div style="margin-top:24px"><div style="font-family:Inter;font-size:10px;font-weight:600;color:#8B7340;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #E0DDD6">Entrenamiento Planificado — '+dayNames[dayI]+'</div>'+
          '<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="background:#F0EDE8">'+
          '<th style="padding:6px 8px;text-align:left;font-weight:600;border-bottom:1px solid #ddd">Ejercicio</th>'+
          '<th style="padding:6px 8px;text-align:center;font-weight:600;border-bottom:1px solid #ddd">Kg</th>'+

          '<th style="padding:6px 8px;text-align:center;font-weight:600;border-bottom:1px solid #ddd">Desc.</th>'+
          '</tr></thead><tbody>'+
          exs.map((ex,i)=>'<tr style="background:'+(i%2?'#FAFAF7':'#fff')+'">'+
            '<td style="padding:5px 8px;font-weight:600">'+ex.name+'</td>'+

          '</tr>').join('')+
          '</tbody></table>'+
          (ds[dayI].observations?'<div style="font-size:10px;color:#666;margin-top:6px;padding:6px;background:#F0EDE8;border-radius:3px">'+ds[dayI].observations+'</div>':'')+
        '</div>';
      }
    }
  }

  // Session history (last 10)
  const recentSes = DB.sessions.filter(s=>s.athleteId===aid).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let sesHistHTML = '';
  if(recentSes.length){
    sesHistHTML = '<div style="margin-top:20px"><div style="font-family:Inter;font-size:10px;font-weight:600;color:#8B7340;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #E0DDD6">Historial de Sesiones Recientes</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr style="background:#F0EDE8">'+
      '<th style="padding:5px 6px;text-align:left;border-bottom:1px solid #ddd">Fecha</th>'+

      recentSes.map((s,i)=>'<tr style="background:'+(i%2?'#FAFAF7':'#fff')+'">'+

        '<td style="padding:4px 6px;text-align:center;font-weight:700">'+s.extLoad.toFixed(1)+'</td>'+
        '<td style="padding:4px 6px;text-align:center;font-weight:700;color:'+(s.rpe<=5?'#4A7A5A':s.rpe<=7?'#9E8035':'#A04040')+'">'+s.rpe+'/10</td>'+
      '</tr>').join('')+
      '</tbody></table></div>';
  }

  // Gaugepos for ratio bar
  const gaugePos = Math.min(100,Math.max(0,(ratio/2)*100));

  // Interpretation
  const interp = getStatusInterpretation(aid);

  // Build continuous A4 HTML (no forced page breaks)
  const fullHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe — ${ath.name}</title>

// ===== TOAST =====
function toast(msg, type='ok'){
  const box = document.getElementById('toasts');
  const icons = {ok:'<i class="fas fa-check-circle" style="color:var(--ok)"></i>', error:'<i class="fas fa-times-circle" style="color:var(--danger)"></i>', warn:'<i class="fas fa-exclamation-circle" style="color:var(--warn)"></i>'};
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  el.innerHTML = `${icons[type]||icons.ok}<span>${msg}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },3000);
}

// ===== CMJ BIOMECHANICAL HELPERS =====
// (Aplicación del PDF: PTS reales, CoM segmental Zatsiorsky, Butterworth 4º zero-phase,
//  detección por velocidad, corrección de tilt por acelerómetro, doble método + QC)

// --- Butterworth 2º orden biquad paso-bajo (diseño RBJ). Se cascadean 2 para 4º orden. ---
function cmjMakeBiquadLP(fc, fs){
  const w0 = 2*Math.PI*fc/fs;
  const cosw = Math.cos(w0), sinw = Math.sin(w0);
  const Q = Math.SQRT1_2; // Butterworth Q = 1/sqrt(2)
  const alpha = sinw/(2*Q);
  const b0 = (1-cosw)/2, b1 = 1-cosw, b2 = (1-cosw)/2;
  const a0 = 1+alpha, a1 = -2*cosw, a2 = 1-alpha;
  return { b:[b0/a0,b1/a0,b2/a0], a:[a1/a0,a2/a0] };
}
// Aplica un biquad IIR a una señal (causal)
function cmjApplyBiquad(sig, coef){
  const out = new Array(sig.length);
  let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<sig.length;i++){
    const x = sig[i];
    const y = coef.b[0]*x + coef.b[1]*x1 + coef.b[2]*x2 - coef.a[0]*y1 - coef.a[1]*y2;
    x2=x1; x1=x; y2=y1; y1=y; out[i]=y;
  }
  return out;
}
// Butterworth 4º orden forward-backward (zero-phase, estándar biomecánica Winter)
function cmjButter4FwdBwd(sig, fc, fs){
  if(!sig || sig.length < 10) return sig ? [...sig] : [];
  const c1 = cmjMakeBiquadLP(fc, fs);
  const c2 = cmjMakeBiquadLP(fc, fs);
  // forward: 2 biquads en cascada = 4º orden
  let s = cmjApplyBiquad(sig, c1);
  s = cmjApplyBiquad(s, c2);
  // reverse-filter para fase cero
  s.reverse();
  s = cmjApplyBiquad(s, c1);
  s = cmjApplyBiquad(s, c2);
  s.reverse();
  return s;
}
// --- Centro de masa segmental (Zatsiorsky-Seluyanov / Winter) a partir de landmarks MediaPipe ---
// Devuelve {x,y} en el mismo sistema normalizado que los landmarks
function cmjComputeCoM(lm){
  if(!lm || !lm[11] || !lm[12] || !lm[23] || !lm[24]) return null;
  const shMid = { x:(lm[11].x+lm[12].x)/2, y:(lm[11].y+lm[12].y)/2 };
  const hpMid = { x:(lm[23].x+lm[24].x)/2, y:(lm[23].y+lm[24].y)/2 };
  // Top de cabeza: nariz (0) proyectada arriba ~60% de distancia hombro→nariz
  const nose = lm[0] || shMid;
  const headTop = { x:nose.x, y:nose.y - 0.6*Math.abs(shMid.y - nose.y) };
  // Segmentos: [masa%, proxPoint, distPoint, fracCoMdesdeProx]
  const segs = [
    [0.081, headTop, shMid, 0.50],       // cabeza+cuello
    [0.497, shMid, hpMid, 0.45],         // tronco
    [0.100, lm[23], lm[25], 0.433],      // muslo izq
    [0.100, lm[24], lm[26], 0.433],      // muslo der
    [0.046, lm[25], lm[27], 0.433],      // pierna izq
    [0.046, lm[26], lm[28], 0.433],      // pierna der
    [0.014, lm[27], lm[31], 0.440],      // pie izq (tobillo→punta)
    [0.014, lm[28], lm[32], 0.440],      // pie der
    [0.028, lm[11], lm[13], 0.436],      // brazo sup izq
    [0.028, lm[12], lm[14], 0.436],      // brazo sup der
    [0.022, lm[13], lm[15], 0.430],      // antebrazo+mano izq (1.6 + 0.6 ~)
    [0.022, lm[14], lm[16], 0.430]       // antebrazo+mano der
  ];
  let x=0,y=0,m=0;
  for(const [wt, p, d, f] of segs){
    if(!p || !d) continue;
    x += (p.x + (d.x-p.x)*f) * wt;
    y += (p.y + (d.y-p.y)*f) * wt;
    m += wt;
  }
  if(m < 0.5) return null;
  return { x:x/m, y:y/m };
}
// Ángulo de la rodilla en grados (hip-knee-ankle, vértice en rodilla)
function cmjKneeAngle(hip, knee, ank){
  if(!hip || !knee || !ank) return null;
  const v1x = hip.x-knee.x, v1y = hip.y-knee.y;
  const v2x = ank.x-knee.x, v2y = ank.y-knee.y;
  const dot = v1x*v2x + v1y*v2y;
  const n1 = Math.hypot(v1x,v1y), n2 = Math.hypot(v2x,v2y);
  if(n1 < 1e-6 || n2 < 1e-6) return null;
  const cosA = Math.max(-1, Math.min(1, dot/(n1*n2)));
  return Math.acos(cosA) * 180/Math.PI;
}
// Derivada central sobre señal con tiempos variables
function cmjCentralDiff(sig, ts){
  const n = sig.length;
  const v = new Array(n);
  v[0] = (sig[1]-sig[0])/Math.max(1e-6, (ts[1]-ts[0]));
  v[n-1] = (sig[n-1]-sig[n-2])/Math.max(1e-6, (ts[n-1]-ts[n-2]));
  for(let i=1;i<n-1;i++){
    v[i] = (sig[i+1]-sig[i-1])/Math.max(1e-6, (ts[i+1]-ts[i-1]));
  }
  return v;
}
// ---- Análisis post-salto sobre la trayectoria completa ----
// Devuelve {hFlightCm, hComCm, hCm, method, phases, quality[], flightMs, depthCm, contaminated, asymPct}
function cmjAnalyzeTrajectory(traj, groundY, mPerNormY){
  if(!traj || traj.length < 10) return null;
  // Señales base: convertir Y normalizado (crece hacia abajo) a altura (crece hacia arriba) en metros
  const ts = traj.map(f => f.t/1000);              // s
  const fs = 1 / Math.max(1e-3, (ts[ts.length-1]-ts[0])/(ts.length-1));
  const mY = mPerNormY && isFinite(mPerNormY) && mPerNormY > 0 ? mPerNormY : null;
  const heightSig = traj.map(f => -(f.yCom) * (mY||1));  // invierte eje; si no hay escala, unidades normalizadas
  const heelSig   = traj.map(f => -(f.yHeelAvg) * (mY||1));
  // Filtro Butterworth 4º zero-phase cutoff 12 Hz (estándar biomecánica)
  const fc = Math.min(12, fs*0.4);
  const hCoM = cmjButter4FwdBwd(heightSig, fc, fs);
  const hHeel = cmjButter4FwdBwd(heelSig, fc, fs);
  // Velocidades por diferencia central
  const vCoM = cmjCentralDiff(hCoM, ts);
  // Detección de fases por velocidad
  // 1) reposo: |v|<0.05 al principio
  // 2) despesaje: primer índice con v<-0.08 m/s (o <-0.08*mY si unidades normalizadas)
  const vThr = mY ? 0.08 : 0.08*(mY||0.005); // 8 cm/s
  let iUnw = -1, iMin = -1, iTake = -1, iApex = -1, iLand = -1;
  // Saltar primeros ~300 ms (ringing del Butterworth zero-phase en los bordes)
  const guardStart = Math.max(5, Math.round(fs*0.3));
  for(let i=guardStart;i<vCoM.length-1;i++){ if(vCoM[i] < -vThr){ iUnw = i; break; } }
  if(iUnw < 0) iUnw = guardStart;
  // 3) mínimo: primer cambio de signo neg→pos tras iUnw
  for(let i=iUnw+1;i<vCoM.length-1;i++){ if(vCoM[i-1]<0 && vCoM[i]>=0){ iMin = i; break; } }
  if(iMin < 0) iMin = iUnw+1;
  // 4) despegue: los talones superan umbral sobre suelo (groundY es en Y normalizado, crece hacia abajo)
  //    = -yHeelAvg > -groundY + thr
  const takeThr = 0.02; // 2% de la altura del frame
  for(let i=iMin+1;i<traj.length-2;i++){
    if(traj[i].yHeelAvg < groundY - takeThr){ iTake = i; break; }
  }
  if(iTake < 0){
    // fallback: pico de velocidad positiva
    let maxV = -Infinity, idx = iMin+1;
    for(let i=iMin+1;i<vCoM.length-2;i++){ if(vCoM[i]>maxV){ maxV=vCoM[i]; idx=i; } }
    iTake = idx;
  }
  // 5) apex: v cruza de pos a neg tras iTake
  for(let i=iTake+1;i<vCoM.length-1;i++){ if(vCoM[i-1]>0 && vCoM[i]<=0){ iApex = i; break; } }
  if(iApex < 0) iApex = Math.floor((iTake + traj.length-1)/2);
  // 6) aterrizaje: primer índice tras iApex con talón de vuelta al suelo
  for(let i=iApex+1;i<traj.length;i++){
    if(traj[i].yHeelAvg >= groundY - 0.006){ iLand = i; break; }
  }
  if(iLand < 0) iLand = traj.length-1;
  // Tiempo de vuelo (PTS reales)
  const flightMs = (ts[iLand] - ts[iTake]) * 1000;
  const g = 9.81;
  const tSec = flightMs/1000;
  const hFlightCm = (g*tSec*tSec/8) * 100;
  // Altura CoM: desplazamiento máx en vuelo respecto al valor en despegue
  let hComCm = null;
  if(mY){
    const comTake = hCoM[iTake];
    let comMax = comTake;
    for(let i=iTake;i<=iApex+2 && i<hCoM.length;i++){ if(hCoM[i] > comMax) comMax = hCoM[i]; }
    hComCm = (comMax - comTake) * 100;
  }
  // Profundidad del contramovimiento
  let depthCm = null;
  if(mY){
    const comStart = hCoM[Math.max(0,iUnw-3)] || hCoM[0];
    const comBottom = hCoM[iMin] || 0;
    depthCm = (comStart - comBottom) * 100;
  }
  // Control de calidad
  const quality = [];
  let contaminated = false;
  // A) flexión de rodilla en vuelo (comparar ángulo medio vuelo vs ángulo en despegue)
  const kneesTake = traj[iTake] && (traj[iTake].kneeAngleL + traj[iTake].kneeAngleR)/2;
  let kneesFlight = 0, nkf = 0;
  for(let i=iTake+1;i<iLand;i++){
    const k = traj[i].kneeAngleL + traj[i].kneeAngleR;
    if(k > 0){ kneesFlight += k/2; nkf++; }
  }
  kneesFlight = nkf ? kneesFlight/nkf : 0;
  const kneeDropDeg = (kneesTake||170) - kneesFlight;
  if(kneesTake && kneesFlight && kneeDropDeg > 18){
    contaminated = true;
    quality.push({ lvl:'err', txt:`Piernas recogidas en vuelo (−${kneeDropDeg.toFixed(0)}°)` });
  }
  // B) asimetría entre tobillos en el apex
  let asymSum = 0, nas = 0;
  for(let i=iTake;i<=iLand && i<traj.length;i++){
    if(traj[i].ankleDiff != null){ asymSum += Math.abs(traj[i].ankleDiff); nas++; }
  }
  const asymAvg = nas ? asymSum/nas : 0;
  const asymPct = asymAvg * 100; // fracción del frame
  if(asymPct > 3){
    quality.push({ lvl:'warn', txt:`Aterrizaje asimétrico (${asymPct.toFixed(1)}%)` });
  }
  // C) tiempo de vuelo fuera de rango razonable
  if(flightMs < 150 || flightMs > 1000){
    quality.push({ lvl:'err', txt:`Vuelo fuera de rango (${flightMs.toFixed(0)} ms)` });
  }
  // D) FPS insuficiente
  if(fs < 45){
    quality.push({ lvl:'warn', txt:`FPS bajos (${fs.toFixed(0)} Hz — ideal ≥60)` });
  }
  if(!quality.length) quality.push({ lvl:'ok', txt:'Salto limpio' });
  // Selección de método final
  let hCm, method;
  if(contaminated && hComCm != null){
    hCm = hComCm; method = 'CoM';
  } else if(hComCm != null && Math.abs(hComCm - hFlightCm) < 8){
    // ambos métodos coinciden: promedio ponderado (flight más fiable si no contaminado)
    hCm = hFlightCm * 0.6 + hComCm * 0.4; method = 'Vuelo+CoM';
  } else {
    hCm = hFlightCm; method = 'Vuelo';
  }
  return {
    hCm: +hCm.toFixed(1),
    hFlightCm: +hFlightCm.toFixed(1),
    hComCm: hComCm != null ? +hComCm.toFixed(1) : null,
    method,
    flightMs: +flightMs.toFixed(0),
    depthCm: depthCm != null ? +depthCm.toFixed(1) : null,
    fps: +fs.toFixed(0),
    contaminated,
    asymPct: +asymPct.toFixed(1),
    quality,
    phases: { iUnw, iMin, iTake, iApex, iLand }
  };
}

async function initCMJCamera(){
  const video = document.getElementById('cmjVideo');
  const canvas = document.getElementById('cmjCanvas');
  if(!video || !canvas) return;

  try {
    // Pedimos el mayor FPS posible (PDF: ≥120 Hz ideal, 60 Hz aceptable, 30 Hz insuficiente)
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: {ideal:1280}, height: {ideal:720}, frameRate: {ideal:120, min:30}, zoom: 1.0, resizeMode: 'none' },
      audio: false
    });
    video.srcObject = stream;
    cmjCamState.stream = stream;
    const track = stream.getVideoTracks()[0];
    if(track){
      const caps = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
      if(caps.zoom){
        try { await track.applyConstraints({advanced:[{zoom: caps.zoom.min || 1}]}); } catch(e){}
      }
      // Intentamos tiempo de exposición corto para minimizar motion blur (PDF: ideal ≤2 ms)
      if(caps.exposureMode && (caps.exposureMode||[]).includes('manual') && caps.exposureTime){
        try {
          const minExp = caps.exposureTime.min || 1;
          await track.applyConstraints({advanced:[{exposureMode:'manual', exposureTime: Math.max(minExp, caps.exposureTime.min*2 || 1)}]});
        } catch(e){}
      }
      if(caps.focusMode && (caps.focusMode||[]).includes('manual')){
        try { await track.applyConstraints({advanced:[{focusMode:'manual'}]}); } catch(e){}
      } else if(caps.focusMode && (caps.focusMode||[]).includes('continuous')){
        try { await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); } catch(e){}
      }
      if(caps.whiteBalanceMode && (caps.whiteBalanceMode||[]).includes('manual')){
        try { await track.applyConstraints({advanced:[{whiteBalanceMode:'manual'}]}); } catch(e){}
      }
    }
    await video.play();

    canvas.width = video.videoWidth || 360;
    canvas.height = video.videoHeight || 480;

    // Corrección de tilt: acelerómetro → ángulo del móvil respecto a vertical
    try {
      if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
        try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
      }
      cmjCamState.tiltHandler = (ev) => {
        // beta: inclinación frontal-trasera en grados (-180..180). 90° = móvil vertical.
        if(typeof ev.beta !== 'number') return;
        const fromVert = Math.abs(90 - Math.abs(ev.beta));
        // Ignoramos picos > 45° para no sobrecorregir
        if(fromVert < 45 && cmjCamState) cmjCamState.tiltDeg = fromVert;
      };
      window.addEventListener('deviceorientation', cmjCamState.tiltHandler);
    } catch(e){}

    // Init MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,   // suavizado interno (combinado con Butterworth externo post-análisis)
      enableSegmentation: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    pose.onResults(onCMJPoseResults);
    cmjCamState.pose = pose;

    updateCMJStatus('Buscando posición...', '');
    cmjCamState.phase = 'calibrating';
    cmjCamState.calibFrames = 0;
    cmjCamState.calibSamples = [];
    cmjCamState.calibComSamples = [];
    cmjCamState.calibBodyHeightSamples = [];

    // Usamos requestVideoFrameCallback (PTS reales) si está disponible
    cmjCamState.usingRVFC = typeof video.requestVideoFrameCallback === 'function';
    sendCMJFrame();
  } catch(e) {
    console.error('CMJ Camera error:', e);
    updateCMJStatus('Error: no se pudo acceder a la cámara', '');
    toast('No se pudo acceder a la cámara. Verifica los permisos.', 'error');
  }
}

async function sendCMJFrame(){
  if(!cmjCamState || !cmjCamState.pose) return;
  const video = document.getElementById('cmjVideo');
  if(!video || video.paused || video.ended) return;

  const step = async (now, metadata) => {
    if(!cmjCamState || !cmjCamState.pose) return;
    // Timestamp del frame en ms. Preferimos mediaTime (PTS real) del frame del video.
    cmjCamState.currentFrameTs = (metadata && typeof metadata.mediaTime === 'number')
      ? metadata.mediaTime * 1000
      : performance.now();
    try { await cmjCamState.pose.send({image: video}); } catch(e) { /* ignore */ }
    if(!cmjCamState) return;
    if(cmjCamState.usingRVFC) video.requestVideoFrameCallback(step);
    else cmjCamState.animFrame = requestAnimationFrame(() => step(performance.now(), null));
  };

  if(cmjCamState.usingRVFC) video.requestVideoFrameCallback(step);
  else cmjCamState.animFrame = requestAnimationFrame(() => step(performance.now(), null));
}

function onCMJPoseResults(results){
  if(!cmjCamState) return;
  const canvas = document.getElementById('cmjCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  if(!results.poseLandmarks) {
    updateCMJStatus('No se detecta persona. Sitúate de perfil completo.', '');
    return;
  }

  const lm = results.poseLandmarks;
  drawCMJSkeleton(ctx, lm, w, h);

  // Landmarks críticos (PDF: talones=29,30 despegue/aterrizaje; caderas=23,24, tobillos=27,28, rodillas=25,26)
  const lheel = lm[29], rheel = lm[30];
  const lank = lm[27], rank = lm[28];
  if(!lheel || !rheel || lheel.visibility < 0.4 || rheel.visibility < 0.4){
    updateCMJStatus('Asegúrate de que tus pies sean visibles', '');
    return;
  }

  // --- Cálculo de variables crudas ---
  const heelY = (lheel.y + rheel.y) / 2;
  const ankleDiff = (lank && rank) ? (lank.y - rank.y) : 0; // positivo = izq más bajo que der (asimetría)
  const com = cmjComputeCoM(lm);
  if(!com){ updateCMJStatus('Pose incompleta — muéstrate de perfil', ''); return; }
  const yCom = com.y;

  // Suavizado ligero sobre CoM sólo para UI y detección en tiempo real (el filtrado Butterworth real se aplica post-salto)
  if(cmjCamState.smoothedYCom === null) cmjCamState.smoothedYCom = yCom;
  else cmjCamState.smoothedYCom = 0.6*yCom + 0.4*cmjCamState.smoothedYCom;
  const syCom = cmjCamState.smoothedYCom;

  // Dibuja CoM
  ctx.beginPath();
  ctx.arc(com.x*w, com.y*h, 7, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(251,191,36,.95)';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const t = cmjCamState.currentFrameTs;
  const phase = cmjCamState.phase;

  // === CALIBRACIÓN ===
  if(phase === 'calibrating'){
    cmjCamState.calibSamples.push(heelY);
    cmjCamState.calibComSamples.push(yCom);
    // Altura corporal en coords normalizadas: top de cabeza (nariz proyectada) a talón más bajo
    const nose = lm[0];
    if(nose){
      const headTop = nose.y - 0.6*Math.abs((lm[11] && lm[12] ? (lm[11].y+lm[12].y)/2 : nose.y+0.1) - nose.y);
      const lowest = Math.max(heelY, lm[31]?lm[31].y:heelY, lm[32]?lm[32].y:heelY);
      cmjCamState.calibBodyHeightSamples.push(lowest - headTop);
    }
    cmjCamState.calibFrames++;
    const progress = Math.min(100, Math.round(cmjCamState.calibFrames / 60 * 100));
    updateCMJStatus(`Calibrando — mantente quieto de perfil (${progress}%)`, '');
    drawCMJGround(ctx, heelY, w, h, 'rgba(255,255,255,.3)');
    setCMJPhaseIndicator('silent');

    if(cmjCamState.calibFrames >= 60){
      // Mediana como groundY y bodyHeightNorm (robustas a outliers)
      const med = arr => { const s=[...arr].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; };
      cmjCamState.groundY = med(cmjCamState.calibSamples);
      cmjCamState.bodyHeightNorm = cmjCamState.calibBodyHeightSamples.length ? med(cmjCamState.calibBodyHeightSamples) : null;
      // Escala m/unidad: altura corporal conocida en m / altura en unidades normalizadas, corregida por tilt
      const hCm = cmjCamState.athHeightCm || 0;
      if(hCm > 100 && cmjCamState.bodyHeightNorm && cmjCamState.bodyHeightNorm > 0.2){
        const cosT = Math.cos((cmjCamState.tiltDeg||0) * Math.PI/180);
        cmjCamState.mPerNormY = (hCm/100) / (cmjCamState.bodyHeightNorm * Math.max(0.5, cosT));
      } else {
        cmjCamState.mPerNormY = null; // no hay escala → sólo método tiempo de vuelo
      }
      cmjCamState.airborneThreshold = cmjCamState.groundY - 0.02;
      cmjCamState.phase = 'ready';
      cmjCamState.traj = [];
      cmjCamState.smoothedYCom = null;
      updateCMJTelemetry();
      updateCMJStatus(`¡Listo para saltar! (Salto ${cmjCamState.currentJump + 1}/3)`, 'ready');
    }
    return;
  }

  // === CAPTURA DE TRAYECTORIA (cualquier fase activa) ===
  if(phase === 'ready' || phase === 'unweighting' || phase === 'airborne'){
    // Corrección por tilt en Y (PDF §Inclinación): Y_corr = Y / cos(θ)
    const cosT = Math.cos((cmjCamState.tiltDeg||0) * Math.PI/180);
    const yComCorr = (yCom - (cmjCamState.groundY||0.9)) / Math.max(0.5, cosT) + (cmjCamState.groundY||0.9);
    const yHeelCorr = (heelY - (cmjCamState.groundY||0.9)) / Math.max(0.5, cosT) + (cmjCamState.groundY||0.9);
    cmjCamState.traj.push({
      t,
      yCom: yComCorr,
      yHeelAvg: yHeelCorr,
      ankleDiff,
      kneeAngleL: cmjKneeAngle(lm[23], lm[25], lm[27]) || 0,
      kneeAngleR: cmjKneeAngle(lm[24], lm[26], lm[28]) || 0
    });
    // Limita buffer por si no se detecta aterrizaje (20 s máximo)
    if(cmjCamState.traj.length > 1800) cmjCamState.traj.shift();
  }

  // === MÁQUINA DE FASES TIEMPO REAL ===
  if(phase === 'ready'){
    drawCMJGround(ctx, cmjCamState.groundY, w, h, 'rgba(74,222,128,.4)');
    // Detección de inicio de contramovimiento: CoM desciende (yCom aumenta) respecto a groundY de referencia basal
    const yComBase = cmjCamState.calibComSamples.length ? cmjCamState.calibComSamples[cmjCamState.calibComSamples.length-1] : syCom;
    if(syCom > yComBase + 0.015){
      cmjCamState.phase = 'unweighting';
      setCMJPhaseIndicator('ecc');
      updateCMJStatus('Bajando — contramovimiento', '');
    } else if(heelY < cmjCamState.airborneThreshold){
      // Salto directo sin contramovimiento detectado (atleta muy rápido)
      cmjCamState.phase = 'airborne';
      cmjCamState.takeoffTime = t;
      setCMJPhaseIndicator('fly');
      updateCMJStatus('¡Saltando!', 'jumping');
    }
  }
  else if(phase === 'unweighting'){
    drawCMJGround(ctx, cmjCamState.groundY, w, h, 'rgba(251,191,36,.4)');
    if(heelY < cmjCamState.airborneThreshold){
      cmjCamState.phase = 'airborne';
      cmjCamState.takeoffTime = t;
      setCMJPhaseIndicator('fly');
      updateCMJStatus('¡Saltando!', 'jumping');
    }
  }
  else if(phase === 'airborne'){
    drawCMJGround(ctx, cmjCamState.groundY, w, h, 'rgba(251,191,36,.5)');
    // Aterrizaje detectado cuando talón vuelve cerca del groundY tras un mínimo en aire
    if(heelY >= cmjCamState.groundY - 0.006 && (t - cmjCamState.takeoffTime) > 150){
      cmjCamState.landingTime = t;
      setCMJPhaseIndicator('land');

      // --- ANÁLISIS POST-SALTO ---
      const analysis = cmjAnalyzeTrajectory(cmjCamState.traj, cmjCamState.groundY, cmjCamState.mPerNormY);
      if(analysis && analysis.hCm >= 3 && analysis.hCm <= 100 && analysis.flightMs >= 150 && analysis.flightMs <= 1000){
        cmjCamState.jumps[cmjCamState.currentJump] = analysis;
        const jumpEl = document.getElementById(`cmjJump${cmjCamState.currentJump + 1}`);
        if(jumpEl){
          jumpEl.classList.remove('active');
          jumpEl.classList.add('done');
          jumpEl.querySelector('.jval').textContent = analysis.hCm.toFixed(1) + ' cm';
        }
        const allDone = cmjCamState.jumps.every(j => j !== null);
        if(allDone){
          cmjCamState.phase = 'done';
          recalcCMJAvg();
        } else {
          let nextIdx = -1;
          for(let i = cmjCamState.currentJump + 1; i < 3; i++){
            if(cmjCamState.jumps[i] === null){ nextIdx = i; break; }
          }
          if(nextIdx === -1){
            for(let i = 0; i < 3; i++){
              if(cmjCamState.jumps[i] === null){ nextIdx = i; break; }
            }
          }
          if(nextIdx >= 0){
            cmjCamState.currentJump = nextIdx;
            cmjCamState.phase = 'recalibrating';
            cmjCamState.calibFrames = 0;
            cmjCamState.calibSamples = [];
            cmjCamState.calibComSamples = [];
            cmjCamState.calibBodyHeightSamples = [];
            cmjCamState.smoothedYCom = null;
            cmjCamState.traj = [];
            const qTxt = (analysis.quality[0]||{txt:''}).txt;
            updateCMJStatus(`Salto ${cmjCamState.currentJump}: ${analysis.hCm.toFixed(1)} cm (${analysis.method}) — ${qTxt}`, 'result');
            const nextJumpEl = document.getElementById(`cmjJump${nextIdx + 1}`);
            if(nextJumpEl) nextJumpEl.classList.add('active');
            setTimeout(() => {
              if(cmjCamState && cmjCamState.phase === 'recalibrating'){
                cmjCamState.phase = 'calibrating';
                setCMJPhaseIndicator('silent');
              }
            }, 1000);
          } else {
            cmjCamState.phase = 'done';
            recalcCMJAvg();
          }
        }
      } else {
        // Salto inválido
        cmjCamState.phase = 'recalibrating';
        cmjCamState.calibFrames = 0;
        cmjCamState.calibSamples = [];
        cmjCamState.calibComSamples = [];
        cmjCamState.calibBodyHeightSamples = [];
        cmjCamState.smoothedYCom = null;
        cmjCamState.traj = [];
        const reason = analysis ? `(vuelo ${analysis.flightMs} ms, h ${analysis.hCm} cm)` : '';
        updateCMJStatus(`Salto no válido ${reason} — vuelve a posición`, '');
        setTimeout(() => {
          if(cmjCamState && cmjCamState.phase === 'recalibrating'){
            cmjCamState.phase = 'calibrating';
            setCMJPhaseIndicator('silent');
          }
        }, 1500);
      }
    }
  }
  else if(phase === 'recalibrating'){
    drawCMJGround(ctx, cmjCamState.groundY, w, h, 'rgba(255,255,255,.2)');
  }
  else if(phase === 'done'){
    drawCMJGround(ctx, cmjCamState.groundY, w, h, 'rgba(139,115,64,.4)');
  }
}

// Actualiza la barra visual de fases
function setCMJPhaseIndicator(ph){
  const order = ['silent','ecc','con','fly','land'];
  const idx = order.indexOf(ph);
  if(idx < 0) return;
  document.querySelectorAll('.cmj-phase-dot').forEach(el => {
    const pi = order.indexOf(el.dataset.ph);
    el.classList.remove('on','done');
    if(pi === idx) el.classList.add('on');
    else if(pi < idx) el.classList.add('done');
  });
}

// Actualiza la fila de telemetría (FPS real, tilt, escala)
function updateCMJTelemetry(){
  if(!cmjCamState) return;
  const traj = cmjCamState.traj;
  let fps = '—';
  if(traj && traj.length >= 8){
    const dt = (traj[traj.length-1].t - traj[0].t) / (traj.length-1);
    if(dt > 0) fps = (1000/dt).toFixed(0);
  }
  const elF = document.getElementById('cmjTelFps');
  if(elF) elF.innerHTML = `FPS <b>${fps}</b>`;
  const elT = document.getElementById('cmjTelTilt');
  if(elT) elT.innerHTML = `Tilt <b>${(cmjCamState.tiltDeg||0).toFixed(0)}°</b>`;
  const elS = document.getElementById('cmjTelScale');
  if(elS){
    if(cmjCamState.mPerNormY) elS.innerHTML = `Escala <b>${(cmjCamState.mPerNormY*100).toFixed(0)} cm/u</b>`;
    else elS.innerHTML = `Escala <b>vuelo</b>`;
  }
}

function drawCMJSkeleton(ctx, landmarks, w, h){
  const connections = [
    [11,13],[13,15],[12,14],[14,16], // arms
    [11,12],[11,23],[12,24],[23,24], // torso
    [23,25],[25,27],[27,29],[27,31], // left leg
    [24,26],[26,28],[28,30],[28,32]  // right leg
  ];
  ctx.strokeStyle = 'rgba(139,115,64,.7)';
  ctx.lineWidth = 2;
  connections.forEach(([a,b]) => {
    const la = landmarks[a], lb = landmarks[b];
    if(la && lb && la.visibility > 0.3 && lb.visibility > 0.3){
      ctx.beginPath();
      ctx.moveTo(la.x * w, la.y * h);
      ctx.lineTo(lb.x * w, lb.y * h);
      ctx.stroke();
    }
  });
  // Draw heel points highlighted
  [29,30].forEach(idx => {
    const lm = landmarks[idx];
    if(lm && lm.visibility > 0.3){
      ctx.beginPath();
      ctx.arc(lm.x * w, lm.y * h, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(251,191,36,.9)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  });
}

function drawCMJGround(ctx, groundY, w, h, color){
  const y = groundY * h;
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(w, y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function updateCMJStatus(text, cls){
  const el = document.getElementById('cmjStatusText');
  if(el){
    el.textContent = text;
    el.className = 'status-text' + (cls ? ' ' + cls : '');
  }
}

function saveCMJCameraResult(){
  if(!cmjCamState || cmjCamState.jumps.some(j => j === null)) return;
  const hs = cmjCamState.jumps.map(j => j.hCm);
  const avg = +(hs.reduce((s,v) => s + v, 0) / 3).toFixed(1);
  const athId = cmjCamState.athleteId;
  const jumpsSummary = hs.map(h => h.toFixed(1)+'cm').join(', ');
  const methods = cmjCamState.jumps.map(j => j.method);
  const contaminatedAny = cmjCamState.jumps.some(j => j.contaminated);
  const anyQuality = cmjCamState.jumps.flatMap(j => j.quality || []);

  // Guardamos record con detalles biomecánicos
  DB.cmj.push({
    id: uid(), athleteId: athId, date: TODAY, value: avg,
    jumps: cmjCamState.jumps.map(j => ({
      hCm: j.hCm, hFlightCm: j.hFlightCm, hComCm: j.hComCm,
      method: j.method, flightMs: j.flightMs, depthCm: j.depthCm,
      fps: j.fps, contaminated: j.contaminated, asymPct: j.asymPct
    })),
    method: methods[0] || 'Vuelo',
    contaminated: contaminatedAny
  });
  save();

  const checkinInput = document.getElementById('checkinCMJ');
  if(checkinInput) checkinInput.value = avg;

  closeCMJCamera();
  const warn = contaminatedAny ? ' ⚠ algún salto con piernas recogidas (corregido vía CoM)' : '';
  toast(`CMJ: ${avg} cm (${jumpsSummary})${warn}`);

  if(typeof render === 'function') render();
}

function repeatCMJJump(jumpNum){
  if(!cmjCamState || cmjCamState.phase !== 'done') return;
  const idx = jumpNum - 1;

  cmjCamState.jumps[idx] = null;
  cmjCamState.currentJump = idx;
  cmjCamState.phase = 'calibrating';
  cmjCamState.calibFrames = 0;
  cmjCamState.calibSamples = [];
  cmjCamState.calibComSamples = [];
  cmjCamState.calibBodyHeightSamples = [];
  cmjCamState.smoothedYCom = null;
  cmjCamState.traj = [];
  cmjCamState.takeoffTime = null;
  cmjCamState.landingTime = null;

  const el = document.getElementById(`cmjJump${jumpNum}`);
  if(el){
    el.classList.remove('done');
    el.classList.add('active');
    el.querySelector('.jval').textContent = '—';
  }

  document.getElementById('cmjAvgBox')?.classList.add('hidden');
  document.getElementById('cmjActions')?.classList.add('hidden');
  setCMJPhaseIndicator('silent');
  updateCMJStatus(`Repitiendo salto ${jumpNum} — Calibrando...`, '');
}

function recalcCMJAvg(){
  if(!cmjCamState || cmjCamState.jumps.some(j => j === null)) return;
  const hs = cmjCamState.jumps.map(j => j.hCm);
  const avg = +(hs.reduce((s,v) => s + v, 0) / 3).toFixed(1);
  const avgFlight = +(cmjCamState.jumps.reduce((s,j) => s + (j.hFlightCm||0), 0) / 3).toFixed(1);
  const withCoM = cmjCamState.jumps.filter(j => j.hComCm != null);
  const avgCoM = withCoM.length ? +(withCoM.reduce((s,j) => s + j.hComCm, 0) / withCoM.length).toFixed(1) : null;
  const avgFps = Math.round(cmjCamState.jumps.reduce((s,j) => s + (j.fps||0), 0) / 3);
  const avgFlightMs = Math.round(cmjCamState.jumps.reduce((s,j) => s + (j.flightMs||0), 0) / 3);

  document.getElementById('cmjAvgVal').textContent = avg;

  // Fila de métodos
  const mrow = document.getElementById('cmjMethodsRow');
  if(mrow){
    const parts = [
      `<div class="mx primary"><div class="ml">Reportado</div><div class="mv">${avg} cm</div></div>`,
      `<div class="mx"><div class="ml">Tiempo vuelo</div><div class="mv">${avgFlight} cm</div></div>`
    ];
    if(avgCoM != null) parts.push(`<div class="mx"><div class="ml">CoM segmental</div><div class="mv">${avgCoM} cm</div></div>`);
    parts.push(`<div class="mx"><div class="ml">t vuelo / FPS</div><div class="mv">${avgFlightMs} ms · ${avgFps}</div></div>`);
    mrow.innerHTML = parts.join('');
  }

  // Fila de calidad (agrega por salto)
  const qrow = document.getElementById('cmjQualityRow');
  if(qrow){
    const badges = cmjCamState.jumps.map((j,i) => {
      const q = (j.quality && j.quality[0]) || {lvl:'ok', txt:'OK'};
      const icon = q.lvl==='err' ? 'fa-exclamation-triangle' : q.lvl==='warn' ? 'fa-exclamation-circle' : 'fa-check-circle';
      return `<div class="cmj-quality-badge ${q.lvl}"><i class="fas ${icon}"></i> S${i+1}: ${q.txt}</div>`;
    }).join('');
    qrow.innerHTML = badges;
  }

  document.getElementById('cmjAvgBox').classList.remove('hidden');
  document.getElementById('cmjActions').classList.remove('hidden');
  updateCMJStatus(`Completado — Media: ${avg} cm`, 'result');
  updateCMJTelemetry();
}

function restartCMJCamera(){
  if(!cmjCamState) return;
  cmjCamState.jumps = [null, null, null];
  cmjCamState.currentJump = 0;
  cmjCamState.phase = 'calibrating';
  cmjCamState.groundY = null;
  cmjCamState.bodyHeightNorm = null;
  cmjCamState.mPerNormY = null;
  cmjCamState.calibFrames = 0;
  cmjCamState.calibSamples = [];
  cmjCamState.calibComSamples = [];
  cmjCamState.calibBodyHeightSamples = [];
  cmjCamState.smoothedYCom = null;
  cmjCamState.traj = [];
  cmjCamState.takeoffTime = null;
  cmjCamState.landingTime = null;

  [1,2,3].forEach(n => {
    const el = document.getElementById(`cmjJump${n}`);
    if(el){
      el.classList.remove('done','active');
      if(n === 1) el.classList.add('active');
      el.querySelector('.jval').textContent = '—';
    }
  });
  document.getElementById('cmjAvgBox')?.classList.add('hidden');
  document.getElementById('cmjActions')?.classList.add('hidden');
  setCMJPhaseIndicator('silent');
  updateCMJStatus('Calibrando — mantente quieto de perfil', '');
}

function closeCMJCamera(){
  if(cmjCamState){
    if(cmjCamState.animFrame) cancelAnimationFrame(cmjCamState.animFrame);
    if(cmjCamState.tiltHandler){
      try { window.removeEventListener('deviceorientation', cmjCamState.tiltHandler); } catch(e){}
    }
    if(cmjCamState.stream){
      cmjCamState.stream.getTracks().forEach(t => t.stop());
    }
    if(cmjCamState.pose){
      try { cmjCamState.pose.close(); } catch(e){}
    }
    cmjCamState = null;
  }
  const overlay = document.getElementById('cmjCamOverlay');
  if(overlay) overlay.remove();
}

// ===== INITIALIZATION =====
function repairPlans(){
  // Ensure all plans have detailedSessions for every meso-micro
  DB.plans.forEach(plan => {
    if(!plan.detailedSessions) plan.detailedSessions = {};
    if(plan.mesociclos && plan.mesociclos.length){
      plan.mesociclos.forEach(m => {
        if(m.microcycles){
          m.microcycles.forEach((mc,wi) => {
            const key = `${m.num}-${wi+1}`;
            if(!plan.detailedSessions[key]){
              plan.detailedSessions[key] = Array.from({length:7},(_,si)=>({
                num:si+1,
                exercises: Array.from({length:7},()=>({name:'',kg:'',s1:'',s2:'',s3:'',s4:'',rir:'',descanso:''})),
                observations:'', volume:''
              }));
            }
          });
        }
      });
    }
  });
  save();
}

function init(){
  load();
  repairPlans();
  const savedUser = localStorage.getItem('fm_user');
  if(savedUser){
    try{ S.user = JSON.parse(savedUser); showApp(); }
    catch(e){ document.getElementById('loginPage').classList.remove('hidden'); }
  } else {
    document.getElementById('loginPage').classList.remove('hidden');
  }
  // Enter key on login
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// Reset data (for testing)
function resetData(){ localStorage.removeItem('fm_db'); localStorage.removeItem('fm_user'); location.reload(); }

init();
</script>
