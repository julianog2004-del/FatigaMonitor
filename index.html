        <!DOCTYPE html>
                                                          <html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FatigaMonitor Pro — Monitorización del Entrenamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@400;500;600;700&display=swap&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- MediaPipe Pose for CMJ measurement -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
  <!-- SheetJS for Excel export -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <!-- Firebase (multi-device sync + auth) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, addDoc, query, where, getDocs, onSnapshot, writeBatch, serverTimestamp, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCOTmGsowogGT2H8K8fqOadMuXMlLU2OaY",
      authDomain: "fatigamonitor.firebaseapp.com",
      projectId: "fatigamonitor",
      storageBucket: "fatigamonitor.firebasestorage.app",
      messagingSenderId: "446007079305",
      appId: "1:446007079305:web:58d14de67d25807af63158"
    };
    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getFirestore(fbApp);
    try { await enableIndexedDbPersistence(db); } catch(e){ console.warn('Firestore offline persistence no disponible:', e?.code); }
    const googleProvider = new GoogleAuthProvider();
    window.FB = {
      app: fbApp, auth, db, ready: true, googleProvider,
      onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, updateProfile,
      doc, getDoc, setDoc, updateDoc, deleteDoc, collection, addDoc, query, where, getDocs, onSnapshot, writeBatch, serverTimestamp
    };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
  <style>
    :root{--bg:#F5F0E8;--bg2:#EDE7DC;--card:#FDFBF7;--card2:#F8F4ED;--border:#D6CCBA;--primary:#8B7340;--primary-d:#6B5730;--primary-l:#A6894E;--accent:#5B4F8A;--accent-alt:#7B6EAA;--text:#2C2418;--muted:#8A7E6B;--ok:#4A7A5A;--warn:#9E8035;--danger:#A04040;--side-w:250px;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--mono:'DM Mono','Fira Code',monospace;--sans:'Inter',system-ui,sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text)}
    /* Grain texture overlay */
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:200px 200px}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}::-webkit-scrollbar-thumb:hover{background:var(--primary)}
    a{color:var(--primary);text-decoration:none;transition:color .2s}a:hover{color:var(--primary-l)}
    /* LOGIN */
    #loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse at 20% 80%,rgba(139,115,64,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(91,79,138,.05) 0%,transparent 50%)}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:56px 48px;width:400px;box-shadow:0 8px 32px rgba(44,36,24,.08)}
    .login-logo{text-align:center;margin-bottom:40px}
    .login-logo .icon{font-size:36px;color:var(--primary);display:block;margin-bottom:16px}
    .login-logo h1{font-family:var(--serif);font-size:28px;font-weight:300;letter-spacing:2px;color:var(--text)}.login-logo p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:1px;text-transform:uppercase}
    .form-group{margin-bottom:18px}.form-group label{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:14px;font-family:var(--sans);transition:border-color .3s}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:4px;border:none;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.5px;text-transform:uppercase;transition:all .25s;text-decoration:none}
    .btn-primary{background:var(--primary);color:#FDFBF7}.btn-primary:hover{background:var(--primary-l);transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
    .btn-success{background:var(--ok);color:#FDFBF7}
    .btn-danger{background:var(--danger);color:#FDFBF7}
    .btn-warning{background:var(--warn);color:#FDFBF7}
    .btn-sm{padding:6px 12px;font-size:10px}.btn-lg{padding:14px 32px;font-size:13px}.btn-full{width:100%;justify-content:center}
    .btn-ghost{background:transparent;color:var(--muted);padding:6px 10px}.btn-ghost:hover{color:var(--primary)}
    .alert{padding:12px 16px;border-radius:3px;font-family:var(--mono);font-size:12px;margin-bottom:16px;border-left:2px solid}
    .alert-error{background:rgba(160,64,64,.06);border-left-color:var(--danger);color:var(--danger)}
    .alert-success{background:rgba(74,122,90,.06);border-left-color:var(--ok);color:var(--ok)}
    .demo-accounts{margin-top:32px;padding-top:32px;border-top:1px solid var(--border)}.demo-accounts>p{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}
    .demo-btns{display:flex;flex-direction:column;gap:6px}
    .demo-btn{background:transparent;border:1px solid var(--border);border-radius:3px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .25s;text-align:left;font-family:inherit;color:var(--text)}.demo-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
    .demo-btn .ri{width:36px;height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px}
    .role-coach .ri{background:rgba(139,115,64,.1);color:var(--primary)}.role-athlete .ri{background:rgba(91,79,138,.1);color:var(--accent)}
    .demo-btn .nm{font-size:13px;font-weight:500}.demo-btn .cr{font-family:var(--mono);font-size:10px;color:var(--muted)}
    /* APP LAYOUT */
    #app{display:flex;height:100vh}
    #sidebar{width:var(--side-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .3s ease,margin .3s ease}
    #sidebar.collapsed{width:0;border-right:none;overflow:hidden}
    #sidebar.collapsed .sb-header,#sidebar.collapsed .nav-section,#sidebar.collapsed .sb-footer{opacity:0;pointer-events:none}
    .sb-toggle{position:fixed;top:12px;left:var(--side-w);z-index:100;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--primary);transition:left .3s ease;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .sb-toggle:hover{background:rgba(139,115,64,.08)}
    .sb-toggle.at-left{left:8px}
    .sb-header{padding:28px 20px;border-bottom:1px solid var(--border)}
    .sb-logo{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .sb-logo .lo-icon{width:36px;height:36px;background:transparent;border:1px solid rgba(139,115,64,.3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary)}
    .sb-logo .lo-text{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:1px}.sb-logo .lo-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px}
    .nav-section{flex:1;padding:16px 12px;overflow-y:auto}
    .nav-label{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:0 10px;margin-bottom:6px;margin-top:20px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;color:var(--muted);cursor:pointer;transition:all .2s;margin-bottom:1px;font-size:13px;font-weight:400;border:none;background:none;width:100%;text-align:left;font-family:var(--sans)}
    .nav-item:hover{color:var(--text);background:rgba(139,115,64,.04)}
    .nav-item.active{color:var(--primary);background:rgba(139,115,64,.06);border-left:2px solid var(--primary)}
    .nav-item .ic{width:18px;text-align:center;font-size:13px}
    .nav-badge{margin-left:auto;background:var(--danger);color:#FDFBF7;font-family:var(--mono);font-size:9px;font-weight:400;padding:2px 6px;border-radius:2px;min-width:16px;text-align:center}
    .sb-footer{padding:16px 12px;border-top:1px solid var(--border)}
    .user-info{display:flex;align-items:center;gap:10px;padding:8px}
    .avatar{width:34px;height:34px;border-radius:3px;background:rgba(139,115,64,.12);border:1px solid rgba(139,115,64,.2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:400;font-size:12px;flex-shrink:0;color:var(--primary)}
    .u-name{font-size:13px;font-weight:500}.u-role{font-family:var(--mono);font-size:10px;color:var(--muted)}
    .logout-btn{margin-top:8px;width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:3px;border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:11px;transition:all .2s}.logout-btn:hover{color:var(--danger)}
    /* MAIN CONTENT */
    #content{flex:1;overflow-y:auto;background:var(--bg)}
    .pg-header{padding:36px 40px 0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .pg-title{font-family:var(--serif);font-size:28px;font-weight:300;letter-spacing:1px}.pg-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px}
    .pg-body{padding:32px 40px 48px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;box-shadow:0 2px 8px rgba(44,36,24,.04)}
    .card-title{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:20px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    /* STAT CARDS */
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s;box-shadow:0 2px 8px rgba(44,36,24,.04)}
    .stat-card:hover{transform:translateY(-2px);border-color:rgba(139,115,64,.2)}
    .stat-card::before{content:'';position:absolute;top:0;left:0;width:1px;height:100%}
    .stat-card.c-pri::before{background:var(--primary)}
    .stat-card.c-ok::before{background:var(--ok)}
    .stat-card.c-warn::before{background:var(--warn)}
    .stat-card.c-danger::before{background:var(--danger)}
    .st-icon{width:36px;height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:14px}
    .st-icon.pri{background:rgba(139,115,64,.08);color:var(--primary)}
    .st-icon.ok{background:rgba(74,122,90,.08);color:var(--ok)}
    .st-icon.warn{background:rgba(139,115,64,.08);color:var(--warn)}
    .st-icon.danger{background:rgba(160,64,64,.08);color:var(--danger)}
    .st-val{font-family:'DM Sans',var(--sans);font-size:28px;font-weight:700;margin-bottom:4px;color:var(--primary);letter-spacing:-.5px}.st-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px}.st-change{font-family:var(--mono);font-size:10px;margin-top:8px}.st-change.up{color:var(--ok)}.st-change.down{color:var(--danger)}
    /* SEMAFORO */
    .sem{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:2px;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
    .sem.verde{background:rgba(74,122,90,.18);color:#2E6B3E;border:1px solid rgba(74,122,90,.45);font-weight:500}
    .sem.amarillo{background:rgba(158,128,53,.18);color:#7A6220;border:1px solid rgba(158,128,53,.45);font-weight:500}
    .sem.rojo{background:rgba(160,64,64,.18);color:#8B2020;border:1px solid rgba(160,64,64,.45);font-weight:500}
    .sem .dot{width:7px;height:7px;border-radius:50%}
    .sem.verde .dot{background:#2E6B3E}.sem.amarillo .dot{background:#9E8035}
    .sem.rojo .dot{background:#A04040;animation:pulse-r 2s ease-in-out infinite}
    @keyframes pulse-r{0%,100%{opacity:1}50%{opacity:.3}}
    /* BIG SEMAFORO */
    .big-sem{text-align:center;padding:24px}
    .sem-lights{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg);border-radius:4px;padding:16px 12px;width:56px;margin:0 auto 16px;border:1px solid var(--border)}
    .sem-light{width:34px;height:34px;border-radius:50%;opacity:.35;transition:all .4s;border:2px solid rgba(0,0,0,.12)}
    .sem-light.on{opacity:1;box-shadow:0 0 24px currentColor,0 0 8px currentColor;border-color:rgba(0,0,0,.18)}
    .l-red{background:#E03838;color:#E03838}.l-yellow{background:#E0A800;color:#E0A800}.l-green{background:#1E8C3A;color:#1E8C3A}
    .sem-status{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:4px;letter-spacing:1px}.sem-detail{font-family:var(--mono);font-size:11px;color:var(--muted)}
    /* ATHLETE CARDS */
    .ath-card{background:var(--card);border:1px solid rgba(139,115,64,.1);border-radius:4px;padding:24px;cursor:pointer;transition:all .25s}
    .ath-card:hover{transform:translateY(-2px);border-color:rgba(139,115,64,.25)}
    .ath-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .ath-info{display:flex;align-items:center;gap:12px}
    .ath-avatar{width:42px;height:42px;border-radius:3px;background:rgba(139,115,64,.1);border:1px solid rgba(139,115,64,.2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:400;font-size:13px;color:var(--primary);flex-shrink:0;overflow:hidden}
    img.ath-avatar-img{object-fit:cover;border:1px solid rgba(139,115,64,.2)}
    .ath-name{font-size:14px;font-weight:500}.ath-sport{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px}
    .ath-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:14px}
    .metric{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:10px;text-align:center}
    .metric-val{font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;letter-spacing:-.3px}.metric-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
    /* TABLE */
    .tbl-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
    td{padding:14px;font-size:13px;border-bottom:1px solid rgba(214,204,186,.5)}
    tr:last-child td{border-bottom:none}tr:hover td{background:rgba(139,115,64,.02)}
    /* TABS */
    .tabs{display:flex;gap:0;background:transparent;border-bottom:1px solid var(--border);padding:0;margin-bottom:24px}
    .tab{padding:10px 20px;border-radius:0;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:none;letter-spacing:.5px;border-bottom:2px solid transparent}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    /* PROGRESS BAR */
    .pbar{height:3px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:8px}
    .pbar-fill{height:100%;border-radius:1px;transition:width .6s ease}
    /* RATIO GAUGE */
    .ratio-gauge{position:relative;height:10px;background:var(--border);border-radius:2px;overflow:visible;margin:20px 0}
    .ratio-zones{display:flex;height:100%;border-radius:2px;overflow:hidden}
    .z-low{flex:8;background:rgba(192,64,64,.55)}.z-ok{flex:5;background:rgba(46,139,64,.5)}.z-warn{flex:2;background:rgba(180,140,30,.5)}.z-hi{flex:5;background:rgba(192,64,64,.55)}
    .ratio-marker{position:absolute;top:-6px;width:4px;height:22px;background:var(--text);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 4px rgba(0,0,0,.3)}
    /* MODAL */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px)}
    .modal{background:var(--card);border:1px solid rgba(139,115,64,.15);border-radius:4px;padding:32px;width:520px;max-width:90vw;max-height:85vh;overflow-y:auto}
    .modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .modal-title{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:1px}
    .modal-close{width:28px;height:28px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:inherit;transition:all .2s}.modal-close:hover{border-color:var(--primary);color:var(--primary)}
    /* CHART */
    .chart-box{position:relative;height:220px}
    /* WELLNESS STARS */
    .stars{display:flex;gap:6px}.star{font-size:24px;cursor:pointer;color:var(--border);transition:color .2s}.star.on{color:var(--primary)}
    /* RPE SCALE */
    .rpe-row{display:flex;gap:3px}
    .rpe-btn{flex:1;padding:10px 4px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:400;transition:all .2s;text-align:center}
    .rpe-btn:hover,.rpe-btn.sel{background:var(--primary);color:#FDFBF7;border-color:var(--primary)}
    /* BADGES */
    .badge{display:inline-flex;padding:2px 8px;border-radius:2px;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.3px}
    .badge-pri{background:rgba(139,115,64,.1);color:var(--primary)}
    .badge-ok{background:rgba(74,122,90,.1);color:var(--ok)}
    .badge-warn{background:rgba(139,115,64,.1);color:var(--warn)}
    .badge-danger{background:rgba(160,64,64,.1);color:var(--danger)}
    .badge-gray{background:rgba(107,104,120,.1);color:var(--muted)}
    /* TOAST */
    .toast-box{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--card);border:1px solid rgba(139,115,64,.15);border-radius:3px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;animation:slideIn .3s ease;max-width:360px}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    .toast.t-ok{border-left:2px solid var(--ok)}.toast.t-err{border-left:2px solid var(--danger)}.toast.t-warn{border-left:2px solid var(--warn)}
    /* REPORT */
    .report-box{background:#FAFAF7;color:#1a1a1a;padding:56px;border-radius:4px;font-family:var(--sans)}
    .rpt-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:36px;padding-bottom:28px;border-bottom:1px solid #E0DDD6}
    .rpt-logo{font-family:var(--serif);font-size:22px;font-weight:400;color:#1a1a1a;letter-spacing:2px}.rpt-logo span{color:var(--primary-d)}
    .rpt-meta{text-align:right;font-family:var(--mono);font-size:11px;color:#888}
    .rpt-title{font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:4px;color:#1a1a1a;letter-spacing:1px}
    .rpt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
    .rpt-stat{background:#F0EDE8;border-radius:3px;padding:18px;text-align:center}
    .rpt-stat-val{font-family:'DM Sans',var(--sans);font-size:26px;font-weight:700;color:#1a1a1a;letter-spacing:-.3px}.rpt-stat-lbl{font-family:var(--mono);font-size:10px;color:#888;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
    .rpt-section{margin-bottom:28px}.rpt-section-title{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--primary-d);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #E0DDD6}
    .rpt-bar{height:4px;background:#E0DDD6;border-radius:1px;overflow:hidden;margin-top:4px}.rpt-bar-fill{height:100%;border-radius:1px}
    /* MACRO PLANNING */
    .macro-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:3px;cursor:pointer;transition:background .2s;font-size:12px}
    .macro-row:hover{background:rgba(139,115,64,.04)}
    .macro-bar{flex:1;height:20px;border-radius:2px;position:relative;overflow:hidden;background:var(--bg2)}
    .macro-fill{height:100%;border-radius:2px;display:flex;align-items:center;padding-left:8px;font-family:var(--mono);font-size:10px;font-weight:400;color:#fff;transition:width .3s}
    .micro-tag{font-family:var(--mono);font-size:9px;font-weight:400;padding:2px 6px;border-radius:2px;white-space:nowrap;letter-spacing:.3px}
    .micro-tag.gradual{background:rgba(45,122,92,.15);color:#2D7A5C}
    .micro-tag.corriente{background:rgba(91,79,138,.12);color:var(--accent)}
    .micro-tag.choque{background:rgba(160,64,64,.12);color:var(--danger)}
    .micro-tag.restablecimiento{background:rgba(74,122,90,.12);color:var(--ok)}
    .micro-tag.competicion{background:rgba(139,115,64,.12);color:var(--primary)}
    .micro-tag.aproximacion{background:rgba(196,120,32,.15);color:#C47820}
    .micro-tag.control{background:rgba(91,79,138,.12);color:var(--accent-alt)}
    /* INFO BOX */
    .info-box{background:rgba(139,115,64,.04);border:1px solid rgba(139,115,64,.12);border-radius:3px;padding:14px 18px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:20px;line-height:1.6}
    .info-box i{margin-right:8px;color:var(--primary)}
    /* EMPTY STATE */
    .empty{text-align:center;padding:56px 24px;color:var(--muted)}
    .empty i{font-size:32px;margin-bottom:16px;display:block;opacity:.2;color:var(--primary)}
    .empty p{font-family:var(--mono);font-size:12px}
    /* DIVIDER */
    hr.divider{border:none;border-top:1px solid var(--border);margin:24px 0}
    /* CHECKIN CMJ */
    .cmj-big{font-family:var(--serif);font-size:48px;font-weight:300;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--primary);padding:16px;width:200px;display:block;margin:0 auto}.cmj-big:focus{outline:none;border-color:var(--primary)}
    /* CMJ CAMERA — fullscreen vertical */
    .cmj-cam-ov{position:fixed;inset:0;background:#000;z-index:2000}
    .cmj-cam-wrap{position:absolute;inset:0;overflow:hidden}
    .cmj-cam-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
    .cmj-cam-wrap canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;object-fit:contain}
    .cmj-cam-hdr{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20;background:linear-gradient(rgba(0,0,0,.6),transparent)}
    .cmj-cam-hdr h2{font-family:var(--serif);font-size:16px;color:#fff;font-weight:400;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
    .cmj-cam-close{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;backdrop-filter:blur(4px)}.cmj-cam-close:hover{background:rgba(255,255,255,.2)}
    .cmj-cam-status{position:absolute;bottom:0;left:0;right:0;padding:10px 12px;z-index:15;text-align:center}
    .cmj-cam-status .status-text{font-family:var(--mono);font-size:14px;color:#fff;letter-spacing:.5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
    .cmj-cam-status .status-text.ready{color:#4ADE80}.cmj-cam-status .status-text.jumping{color:#FBBF24}.cmj-cam-status .status-text.result{color:var(--primary-l)}
    .cmj-cam-bottom{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);padding-top:40px}
    .cmj-cam-jumps{display:flex;gap:8px;justify-content:center;width:100%}
    .cmj-cam-jump{flex:1;max-width:110px;padding:8px 6px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);text-align:center;cursor:default;position:relative;backdrop-filter:blur(6px)}
    .cmj-cam-jump.active{border-color:var(--primary);background:rgba(139,115,64,.25)}
    .cmj-cam-jump.done{border-color:var(--ok);background:rgba(74,122,90,.2)}
    .cmj-cam-jump .jnum{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px}
    .cmj-cam-jump .jval{font-family:'DM Sans',var(--sans);font-size:18px;font-weight:700;color:#fff;margin-top:2px}
    .cmj-cam-jump.done .jval{color:var(--ok)}
    .cmj-cam-jump .jrepeat{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#fff;border:none;cursor:pointer;font-size:9px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}.cmj-cam-jump .jrepeat:hover{background:var(--primary)}
    .cmj-cam-jump.done .jrepeat{display:flex}
    .cmj-cam-avg{padding:10px 20px;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid rgba(139,115,64,.4);text-align:center;width:100%;max-width:340px;backdrop-filter:blur(6px)}
    .cmj-cam-avg .avg-label{font-family:var(--mono);font-size:10px;color:var(--primary-l);text-transform:uppercase;letter-spacing:1.5px}
    .cmj-cam-avg .avg-val{font-family:var(--serif);font-size:36px;color:#fff;font-weight:300;margin-top:2px}
    .cmj-cam-avg .avg-unit{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5)}
    .cmj-cam-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .cmj-phase-bar{display:flex;gap:3px;margin-bottom:6px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.8px;justify-content:center;flex-wrap:wrap}
    .cmj-phase-dot{padding:3px 7px;border-radius:3px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);color:rgba(255,255,255,.4);transition:all .15s}
    .cmj-phase-dot.on{background:rgba(139,115,64,.35);border-color:var(--primary);color:#fff}
    .cmj-phase-dot.done{background:rgba(74,122,90,.25);border-color:var(--ok);color:#9be0ac}
    .cmj-telem{display:flex;gap:8px;justify-content:center;font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.7);margin-bottom:4px;flex-wrap:wrap}
    .cmj-telem .tel{padding:2px 6px;border-radius:3px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
    .cmj-telem .tel b{color:#fff;font-family:'DM Sans',var(--sans);font-size:11px}
    .cmj-quality-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
    .cmj-quality-badge{padding:3px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
    .cmj-quality-badge.ok{background:rgba(74,122,90,.3);border:1px solid var(--ok);color:#9be0ac}
    .cmj-quality-badge.warn{background:rgba(158,128,53,.3);border:1px solid var(--warn);color:#fbbf24}
    .cmj-quality-badge.err{background:rgba(160,64,64,.3);border:1px solid var(--danger);color:#ff8b8b}
    .cmj-methods{display:flex;gap:10px;justify-content:center;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.85);margin-top:4px;flex-wrap:wrap}
    .cmj-methods .mx{padding:4px 8px;border-radius:3px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);text-align:center}
    .cmj-methods .mx .ml{font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.8px}
    .cmj-methods .mx .mv{color:#fff;font-family:'DM Sans',var(--sans);font-size:13px;font-weight:600}
    .cmj-methods .mx.primary{background:rgba(139,115,64,.25);border-color:var(--primary)}
    .cmj-methods .mx.primary .mv{color:var(--primary-l);font-size:15px}
    /* UTILS */
    .hidden{display:none!important}.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
    .mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}.mb-32{margin-bottom:32px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
    .floating-orb{background:radial-gradient(circle at 30% 30%,rgba(139,115,64,.25),rgba(91,79,138,.12));border-radius:50%;border:1px solid rgba(139,115,64,.2);flex-shrink:0}
    .text-center{text-align:center}
    /* PRINT */
    @media print{#app,#loginPage,#modalBox,#toasts{display:none!important}#printArea{display:block!important}}
    /* RESPONSIVE */
    /* MACROCICLO BAR CHART */
    .macro-chart-wrap{overflow-x:auto;padding-bottom:12px}
    .macro-chart-canvas{width:100%;height:320px;min-width:900px}
    .macro-rows{min-width:900px;display:flex;flex-direction:column;gap:0}
    .macro-meta-row{display:flex;gap:2px;border-bottom:1px solid rgba(214,204,186,.5);min-height:28px}
    .macro-meta-row .lbl{width:28px;position:absolute;left:0;font-size:10px;color:var(--muted);font-weight:600;display:flex;align-items:center}
    .macro-meta-cell{flex:1;min-width:18px;display:flex;align-items:center;justify-content:center;font-size:11px;padding:3px 1px}
    .comp-dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
    /* MESOCICLO GRID */
    .meso-tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--border)}
    .meso-tab{padding:8px 14px;border-radius:0;font-family:var(--mono);font-size:10px;font-weight:400;cursor:pointer;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);transition:all .2s;letter-spacing:.3px}
    .meso-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .meso-tab:hover{color:var(--text)}
    .meso-week{margin-bottom:20px}
    .meso-week-title{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
    .meso-sessions{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .meso-session{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:10px 8px;font-size:11px;min-height:80px;transition:border-color .2s}
    .meso-session:hover{border-color:rgba(139,115,64,.2)}
    .meso-session .day-hdr{font-family:var(--mono);font-weight:400;margin-bottom:6px;color:var(--text);font-size:11px;letter-spacing:.3px}
    .meso-session .field{margin-bottom:4px}.meso-session .field-lbl{font-family:var(--mono);color:var(--muted);font-size:9px;letter-spacing:.3px;text-transform:uppercase}.meso-session .field-val{color:var(--text);font-weight:400}
    .meso-session input,.meso-session select{width:100%;padding:4px 6px;background:var(--card);border:1px solid var(--border);border-radius:2px;color:var(--text);font-size:11px;font-family:var(--sans)}
    .meso-session input:focus,.meso-session select:focus{outline:none;border-color:var(--primary)}
    /* SESIONES DETAIL */
    .ses-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:14px;transition:border-color .2s}
    .ses-card:hover{border-color:rgba(139,115,64,.15)}
    .ses-card-title{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.3px}
    .ses-card-title span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
    .ses-exercises{width:100%;font-size:12px;border-collapse:collapse}
    .ses-exercises th{font-family:var(--mono);font-size:9px;padding:8px;background:rgba(139,115,64,.04);color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:400;border-bottom:1px solid var(--border)}
    .ses-exercises td{padding:8px;border-bottom:1px solid rgba(214,204,186,.5)}
    .ses-exercises tr:last-child td{border-bottom:none}
    .ses-exercises input{width:100%;padding:5px 6px;background:var(--bg);border:1px solid var(--border);border-radius:2px;color:var(--text);font-size:11px;font-family:var(--mono);text-align:center;transition:border-color .2s}
    .ses-exercises input:focus{outline:none;border-color:var(--primary);background:rgba(139,115,64,.03)}
    /* Botón de eliminar ejercicio (columna extra al final de cada fila) */
    .ses-exercises .btn-row-del{background:transparent;border:1px solid transparent;color:var(--muted);width:22px;height:22px;border-radius:2px;cursor:pointer;padding:0;font-size:10px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
    .ses-exercises .btn-row-del:hover{background:rgba(160,64,64,.1);color:var(--danger);border-color:rgba(160,64,64,.35)}
    .ses-exercises .td-del{width:30px;padding:4px !important;text-align:center}
    /* Tabla espejo (sesión real del atleta) */
    .ses-mirror{margin-top:14px;background:rgba(91,79,138,.04);border:1px solid rgba(91,79,138,.18);border-left:3px solid var(--accent);border-radius:3px;padding:12px 14px 10px}
    .ses-mirror-header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
    .ses-mirror-header .adh-badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px;background:rgba(91,79,138,.1);color:var(--accent);letter-spacing:.3px;font-weight:400;text-transform:none}
    .ses-mirror-header .adh-badge.ok{background:rgba(74,122,90,.1);color:var(--ok)}
    .ses-mirror-header .adh-badge.warn{background:rgba(158,128,53,.1);color:var(--warn)}
    .ses-mirror-header .adh-badge.danger{background:rgba(160,64,64,.1);color:var(--danger)}
    .ses-mirror table input{background:var(--card);border-color:rgba(91,79,138,.25)}
    .ses-mirror table input:focus{border-color:var(--accent);background:rgba(91,79,138,.04)}
    .ses-mirror .ex-name{font-family:var(--mono);font-size:11px;color:var(--muted);padding:6px 8px;font-style:italic}
    .ses-mirror .dev-cell{text-align:center;font-family:var(--mono);font-size:10px;padding:4px 2px;width:38px}
    .ses-mirror .dev-up{color:var(--ok)}
    .ses-mirror .dev-down{color:var(--danger)}
    .ses-mirror .dev-eq{color:var(--muted)}
    /* Botón "añadir ejercicio" */
    .ses-add-ex{margin-top:8px;display:flex;justify-content:flex-end;gap:6px}
    .ses-add-ex button{font-family:var(--mono);font-size:10px;padding:5px 12px;background:var(--bg);border:1px dashed var(--border);border-radius:3px;color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.3px}
    .ses-add-ex button:hover{border-color:var(--primary);color:var(--primary);border-style:solid;background:rgba(139,115,64,.04)}
    /* Vol — indicador AUTO / botón recalcular */
    .vol-wrap{display:inline-flex;align-items:center;gap:4px}
    .vol-auto-badge{font-family:var(--mono);font-size:9px;color:var(--ok);background:rgba(74,122,90,.12);padding:1px 5px;border-radius:2px;letter-spacing:.5px}
    .vol-reset-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:10px;border-radius:2px;transition:all .15s}
    .vol-reset-btn:hover{color:var(--primary);background:rgba(139,115,64,.08)}
    .vol-input-manual{color:var(--primary) !important;border-color:var(--primary) !important}
    /* Dropdown genérico (usado por el botón Exportar) */
    .dd-wrap{position:relative;display:inline-block}
    .dd-menu{position:absolute;top:calc(100% + 4px);right:0;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:1500;padding:6px;display:none;flex-direction:column;gap:2px}
    .dd-menu.open{display:flex}
    .dd-item{width:100%;text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:none;border-radius:3px;cursor:pointer;color:var(--text);font-family:var(--sans);display:flex;align-items:center;gap:10px;transition:background .15s}
    .dd-item:hover{background:rgba(139,115,64,.08);color:var(--primary)}
    .dd-item i{font-size:15px;width:20px;text-align:center}
    .dd-item .dd-sub{display:block;font-size:10px;color:var(--muted);margin-top:1px;font-weight:400}
    .dd-item .dd-label{font-weight:600;font-size:12px;line-height:1.2}
    /* MICRONUTRIENTES — gauges radiales */
    .nut-gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .nut-gauge{padding:10px 8px;border-radius:4px;text-align:center;transition:transform .15s, box-shadow .15s;cursor:help}
    .nut-gauge:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.06)}
    .nut-gauge-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--text);margin-bottom:4px}
    .nut-gauge-label i{margin-right:3px;font-size:10px}
    .nut-gauge-vals{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;line-height:1.3}
    .nut-gauge-intake{color:var(--text);font-weight:700}
    .nut-gauge-sep{color:var(--muted);margin:0 2px}
    .nut-gauge-drv{color:var(--muted)}
    .nut-gauge-unit{display:block;font-size:8px;color:var(--muted);opacity:.8}
    .nut-gauge-zone{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.3px;margin-top:3px;text-transform:uppercase}
    /* EVALUACION TABLE */
    .eval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    .eval-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:20px}
    .eval-card-title{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--text);margin-bottom:14px;text-align:center;letter-spacing:.3px}
    .eval-field{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(214,204,186,.5);font-size:12px}
    .eval-field:last-child{border-bottom:none}
    .eval-field .ef-label{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.3px}.eval-field .ef-value{font-family:'DM Sans',var(--sans);font-weight:700;font-size:15px;color:var(--text);letter-spacing:-.3px}
    .eval-field input{width:80px;padding:5px 6px;background:var(--bg);border:1px solid var(--border);border-radius:2px;color:var(--text);font-size:11px;font-family:var(--mono);text-align:right;transition:border-color .2s}
    .eval-field input:focus{outline:none;border-color:var(--primary);background:rgba(139,115,64,.03)}
    /* PROGRESO */
    .prog-table td,.prog-table th{text-align:center;font-family:var(--mono);font-size:11px}
    .prog-table th{color:var(--muted);font-weight:400;letter-spacing:.5px;text-transform:uppercase;font-size:9px}

<script>
/* ================================================================
   FATIGA MONITOR PRO — Complete Application
   Based on TFG: "Monitorización de la fatiga" — Julián Orejas González
   Universidad de Granada 2025-2026
   ================================================================ */

// ===== UID & DATE UTILS =====
let _uid = Date.now();
const uid = () => (++_uid).toString(36);
const TODAY = new Date().toISOString().split('T')[0];
const toDate = s => new Date(s + 'T12:00:00');
const fmtDate = d => { const dt = typeof d === 'string' ? toDate(d) : d; return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtShort = d => { const dt = typeof d === 'string' ? toDate(d) : d; return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); };
const daysAgo = n => { const d = toDate(TODAY); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; };
const diffDays = (a,b) => Math.round((toDate(a)-toDate(b))/(86400000));
const isoWeek = d => { const dt = toDate(d); const day = dt.getDay()||7; dt.setDate(dt.getDate()+4-day); const y = new Date(dt.getFullYear(),0,1); return Math.ceil(((dt-y)/86400000+1)/7); };

// ===== STATE =====
let S = { user: null, view: '', params: {}, charts: {} };
let DB = { users:[], athletes:[], sessions:[], wellness:[], cmj:[], reports:[], plans:[], nutritionReports:[], weeklyMenus:[] };
let CLIPBOARD = { type: null, data: null }; // For copy/paste sessions

// ===== PERFIL DEPORTIVO — TEORÍA DEL ENTRENAMIENTO =====
// Categorías con énfasis (0..1) en cualidades físicas y plantilla de periodización recomendada
const SPORT_CATEGORIES = {
  'Fuerza': {
    sports: ['Powerlifting','Halterofilia','Strongman','Entrenamiento de Fuerza','Culturismo'],
    emphasis: {fmax:1.0, potencia:0.85, hipertrofia:0.75, resAerobica:0.25, resAnaerobica:0.5, tecnica:0.7},
    defaultGoals: ['Fuerza máxima','Hipertrofia','Potencia'],
    planTemplate: 'bloques',
    peakTaperDays: 10
  },
  'Resistencia': {
    sports: ['Running','Maratón','Trail','Ciclismo','Natación','Triatlón','Remo','Esquí de fondo'],
    emphasis: {fmax:0.3, potencia:0.4, hipertrofia:0.2, resAerobica:1.0, resAnaerobica:0.7, tecnica:0.5},
    defaultGoals: ['Resistencia aeróbica','Umbral anaeróbico'],
    planTemplate: 'atr',
    peakTaperDays: 21
  },
  'Equipo': {
    sports: ['Fútbol','Baloncesto','Rugby','Balonmano','Voleibol','Hockey','Béisbol','Fútbol sala'],
    emphasis: {fmax:0.6, potencia:0.9, hipertrofia:0.5, resAerobica:0.7, resAnaerobica:0.9, tecnica:0.9},
    defaultGoals: ['Potencia','Resistencia anaeróbica','Técnica'],
    planTemplate: 'tradicional',
    peakTaperDays: 7
  },
  'Combate': {
    sports: ['Boxeo','MMA','Judo','Karate','Taekwondo','Lucha','Jiu-Jitsu','Kickboxing'],
    emphasis: {fmax:0.7, potencia:0.9, hipertrofia:0.55, resAerobica:0.6, resAnaerobica:1.0, tecnica:1.0},
    defaultGoals: ['Potencia','Resistencia anaeróbica','Técnica'],
    planTemplate: 'tradicional',
    peakTaperDays: 10
  },
  'Velocidad': {
    sports: ['Atletismo velocidad','Sprint','Vallas','Saltos','Lanzamientos'],
    emphasis: {fmax:0.95, potencia:1.0, hipertrofia:0.6, resAerobica:0.2, resAnaerobica:0.8, tecnica:1.0},
    defaultGoals: ['Potencia','Fuerza máxima','Técnica'],
    planTemplate: 'bloques',
    peakTaperDays: 14
  },
  'Técnico': {
    sports: ['Gimnasia','Patinaje artístico','Escalada','Equitación','Natación sincronizada','Surf','Skate'],
    emphasis: {fmax:0.5, potencia:0.75, hipertrofia:0.35, resAerobica:0.45, resAnaerobica:0.55, tecnica:1.0},
    defaultGoals: ['Técnica','Fuerza explosivo-repetitiva'],
    planTemplate: 'bloques',
    peakTaperDays: 10
  },
  'Funcional': {
    sports: ['CrossFit','HIIT','Calistenia','Hyrox','Functional Fitness'],
    emphasis: {fmax:0.75, potencia:0.85, hipertrofia:0.65, resAerobica:0.75, resAnaerobica:0.85, tecnica:0.65},
    defaultGoals: ['Potencia','Resistencia anaeróbica','Hipertrofia'],
    planTemplate: 'tradicional',
    peakTaperDays: 10
  },
  'Otro': {
    sports: [],
    emphasis: {fmax:0.6, potencia:0.6, hipertrofia:0.5, resAerobica:0.6, resAnaerobica:0.5, tecnica:0.6},
    defaultGoals: ['Rendimiento general','Salud'],
    planTemplate: 'tradicional',
    peakTaperDays: 10
  }
};
// Nivel del atleta → multiplicadores y patrón de microciclos por defecto
const ATHLETE_LEVELS = {
  'Iniciante':  {volMult:0.70, intMult:0.80, restMult:1.25, pattern:['gradual','corriente','corriente','restablecimiento'],  description:'0–1 años entrenando'},
  'Intermedio': {volMult:1.00, intMult:1.00, restMult:1.00, pattern:['corriente','choque','corriente','restablecimiento'],   description:'1–3 años consistentes'},
  'Avanzado':   {volMult:1.15, intMult:1.10, restMult:0.90, pattern:['corriente','choque','choque','restablecimiento'],      description:'3–6 años con progresión'},
  'Elite':      {volMult:1.25, intMult:1.20, restMult:0.80, pattern:['choque','choque','aproximacion','restablecimiento'],   description:'Competidor con años de base'}
};
const ATHLETE_GOALS = [
  'Fuerza máxima','Hipertrofia','Potencia','Velocidad',
  'Resistencia aeróbica','Resistencia anaeróbica','Umbral anaeróbico',
  'Rendimiento competitivo','Técnica','Prevención de lesiones','Rehabilitación','Salud general'
];
const COMPETITION_TYPES = [
  'Campeonato nacional','Campeonato internacional','Liga regular',
  'Torneo puntual','Copa eliminatoria','Exhibición','Marca personal','Competición benéfica'
];
// Helper: categoría inferida del deporte libre-texto
function getSportCategory(sport){
  if(!sport) return 'Otro';
  const s = sport.toLowerCase().trim();
  for(const [cat, def] of Object.entries(SPORT_CATEGORIES)){
    if(def.sports.some(x => x.toLowerCase() === s)) return cat;
  }
  // fallback por palabras clave
  if(/running|marat|trail|ciclismo|natac|triatl|remo|esqu/.test(s)) return 'Resistencia';
  if(/boxeo|mma|judo|karate|taekwondo|lucha|jiu|kickbox/.test(s)) return 'Combate';
  if(/f[úu]tbol|baloncesto|rugby|balonmano|voleibol|hockey|b[ée]isbol/.test(s)) return 'Equipo';
  if(/gimnasia|patinaje|escalada|equitac|surf|skate/.test(s)) return 'Técnico';
  if(/crossfit|hiit|calistenia|hyrox|funcional/.test(s)) return 'Funcional';
  if(/powerlift|haltero|strongman|fuerza|culturismo/.test(s)) return 'Fuerza';
  if(/sprint|velocidad|salto|lanzamiento|valla/.test(s)) return 'Velocidad';
  return 'Otro';
}

// ===== PERSISTENCE =====
const DB_VERSION = 7; // Bump this when data model changes — v7: campos de perfil deportivo del atleta
// Debounced cloud sync — agrupa escrituras en bursts para no exceder la cuota Firestore (20K/día).
let _cloudSyncTimer = null;
function _scheduleCloudSync(){
  if(!window.FB?.ready || !window._fbUid) return;
  // Si el usuario actual es un atleta, NO escribe a su /userdata (sus datos
  // los controla el coach). Su sync se hace en _scheduleAthleteSync().
  if(S.user?.type === 'athlete'){ _scheduleAthleteSync(); return; }
  clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer = setTimeout(async()=>{
    try{
      const FB = window.FB;
      // 1. Snapshot global del coach
      await FB.setDoc(FB.doc(FB.db, 'userdata', window._fbUid), { db: DB, version: DB_VERSION, updatedAt: FB.serverTimestamp() });
      // 2. Publicar plan per-atleta para los que tienen googleUid
      const batch = FB.writeBatch(FB.db);
      (DB.athletes||[]).forEach(ath=>{
        if(!ath.googleUid) return;
        const plan = (DB.plans||[]).find(p=>p.athleteId===ath.id);
        const linkRef = FB.doc(FB.db, 'athleteLinks', ath.googleUid);
        batch.set(linkRef, { coachUid: window._fbUid, athleteInternalId: ath.id, athleteName: ath.name, updatedAt: FB.serverTimestamp() }, {merge:true});
        const planRef = FB.doc(FB.db, 'athletePlans', ath.googleUid);
        batch.set(planRef, {
          coachUid: window._fbUid,
          athleteInternalId: ath.id,
          profile: {name: ath.name, sport: ath.sport||'', age: ath.age||null, weight: ath.weight||null, height: ath.height||null, level: ath.level||'', cmjBase: ath.cmjBase||null, photo: ath.photo||null},
          plan: plan || null,
          updatedAt: FB.serverTimestamp()
        }, {merge:true});
      });
      await batch.commit();
    }catch(e){ console.warn('[cloud sync] failed:', e?.code||e?.message); }
  }, 1500);
}
// Sync para atletas — solo publica sus ediciones del espejo (real.*).
let _athleteSyncTimer = null;
function _scheduleAthleteSync(){
  if(!window.FB?.ready || !window._fbUid || S.user?.type !== 'athlete') return;
  clearTimeout(_athleteSyncTimer);
  _athleteSyncTimer = setTimeout(async()=>{
    try{
      const FB = window.FB;
      // Escribimos solo el realByKey — objeto plano con las ediciones del atleta.
      const plan = DB.plans?.[0];
      if(!plan) return;
      const realByKey = {};
      Object.entries(plan.detailedSessions||{}).forEach(([mesoMicro, sessions])=>{
        sessions.forEach((ses, si)=>{
          (ses.exercises||[]).forEach((ex, ei)=>{
            if(ex.real && Object.keys(ex.real).length){
              realByKey[`${mesoMicro}_${si}_${ei}`] = ex.real;
            }
          });
        });
      });
      await FB.setDoc(FB.doc(FB.db, 'athletePlans', window._fbUid), { realByKey, realUpdatedAt: FB.serverTimestamp() }, {merge:true});
    }catch(e){ console.warn('[athlete sync] failed:', e?.code||e?.message); }
  }, 1500);
}
function save(){
  localStorage.setItem('fm_db', JSON.stringify(DB));
  localStorage.setItem('fm_db_version', DB_VERSION);
  _scheduleCloudSync();
}
function load(){
  const ver = parseInt(localStorage.getItem('fm_db_version'))||0;
  if(ver < DB_VERSION){ seed(); return; }
  const raw = localStorage.getItem('fm_db');
  if(raw){ try{ DB = JSON.parse(raw); if(!DB.nutritionReports) DB.nutritionReports=[]; if(!DB.weeklyMenus) DB.weeklyMenus=[]; }catch(e){ seed(); } }
  else seed();
}

// ===== SEED SAMPLE DATA =====
function seed(){
  DB.users = [
    {id:1, name:'Julián Orejas', email:'coach1@fatiga.es', pass:'coach123', type:'coach'},
    {id:2, name:'El Toro',       email:'coach2@fatiga.es', pass:'coach123', type:'coach'},
    {id:3, name:'Tercero',       email:'coach3@fatiga.es', pass:'coach123', type:'coach'},
    {id:4, name:'Carlos Martínez', email:'carlos@fatiga.es', pass:'atleta123', type:'athlete', athleteId:1},
    {id:5, name:'Ana García',      email:'ana@fatiga.es',    pass:'atleta123', type:'athlete', athleteId:2},
    {id:6, name:'Diego López',     email:'diego@fatiga.es',  pass:'atleta123', type:'athlete', athleteId:3}
  ];
  // Fechas de competición ancladas al año actual para que los picks caigan en meses reales
  const _thisYear = new Date().getFullYear();
  const _compDate = (m, d) => `${_thisYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  DB.athletes = [

  const profiles = [

  DB.sessions=[]; DB.wellness=[]; DB.cmj=[]; DB.reports=[]; DB.plans=[];

  profiles.forEach(p => {

  const dayLabels = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const sesTypes = ['Hipertrofia','Fuerza Máx.','Potencia','Aeróbica','Técnica','Descanso','Descanso'];

  DB.plans = DB.athletes.map(a => {
    // Build 52 weeks
    const weeks = Array.from({length:52},(_, i)=>{
      let type = 'corriente';
      if((i+1)%4===0) type='restablecimiento';
      if(i%8===6) type='choque';

    // Build 12 evaluations with sample body data

    // Build progress tracking — nuevo formato con exercises[] dinámico
    const planStart = daysAgo(60);
    const planEnd = daysAgo(60 - 365);
    const progressExercises = ['Press Banca','Sentadilla','Peso Muerto'];
    const progress = [
      {date:daysAgo(60), month:'1°', exercises:[100,150,180]},
      {date:daysAgo(12), month:'2°', exercises:[105,155,185]},
    ].map(p=>({...p, total:p.exercises.reduce((s,v)=>s+v,0)}));

    return {
      id:uid(), athleteId:a.id, coachId:a.coachId,
      name:`Macrociclo ${a.name}`,
      title:`Macrociclo de ${a.sport} — Etapa de especialización`,
      startDate:planStart, endDate:planEnd,
      sport:a.sport,
      schedule:{lunes:'Fuerza',martes:'Potencia',miercoles:'Aeróbica',jueves:'Hipertrofia',viernes:'Técnica',sabado:'',domingo:''},
      observations:'',
      objectives:[
        'Incrementar fuerza máxima en los levantamientos principales un 10%',
        'Mantener composición corporal dentro de la categoría',
        'Prevenir sobreentrenamiento mediante monitorización CMJ + Wellness'
      ],
      weeks, mesociclos, evaluations, progress, progressExercises

  });

  // Create sample reports (one per coach, each about their own athlete)
  DB.reports.push({
    id:uid(), athleteId:3, coachId:DB.athletes.find(a=>a.id===3).coachId, type:'weekly',
    title:'Informe Semanal — Alerta de Sobreentrenamiento',

  });
  DB.reports.push({
    id:uid(), athleteId:1, coachId:DB.athletes.find(a=>a.id===1).coachId, type:'weekly',
    title:'Informe Semanal — Microciclo de Choque',

// ===== CALCULATIONS =====
function getAthleteById(id){ return DB.athletes.find(a=>a.id===id); }

function athAvatar(a, sz, rad, clickable){
  sz = sz||42; rad = rad||3;
  const s = `width:${sz}px;height:${sz}px;border-radius:${rad}px`;
  if(a.photoUrl){
    const click = clickable ? ` onclick="event.stopPropagation();triggerPhotoUpload(${a.id})" style="${s};cursor:pointer" title="Cambiar foto"` : ` style="${s}"`;
    return `<img src="${a.photoUrl}" class="ath-avatar ath-avatar-img"${click}>`;
  }
  const fs = Math.round(sz*0.38);
  const click = clickable ? ` onclick="event.stopPropagation();triggerPhotoUpload(${a.id})" style="${s};font-size:${fs}px;cursor:pointer" title="Subir foto"` : ` style="${s};font-size:${fs}px"`;
  return `<div class="ath-avatar"${click}>${a.photo}</div>`;
}

function triggerPhotoUpload(athId){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 500*1024){toast('Imagen demasiado grande (máx 500KB)','error');return;}
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 150;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width - min)/2, sy = (img.height - min)/2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        const ath = getAthleteById(athId);
        if(ath){ ath.photoUrl = dataUrl; save(); navigate(S.view, S.params); toast('Foto actualizada','ok'); }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function getSessionsInRange(aid, daysBack){
  const from = daysAgo(daysBack);
  return DB.sessions.filter(s=>s.athleteId===aid && s.date>=from && s.date<=TODAY);
}

function getWeeklyLoad(aid, daysBack){
  return getSessionsInRange(aid, daysBack).reduce((sum,s)=>sum+s.extLoad, 0);
}

function getAcuteLoad(aid){ return +getWeeklyLoad(aid,7).toFixed(1); }

function getChronicLoad(aid){
  let total = 0;
  for(let w=0;w<4;w++) total += getWeeklyLoad(aid, (w+1)*7) - getWeeklyLoad(aid, w*7);
  // Wait, let me recalculate properly
  // Chronic = average weekly load over last 28 days
  const totalLoad = getWeeklyLoad(aid, 28);
  return +(totalLoad/4).toFixed(1);
}

function getRatio(aid){
  const acute = getAcuteLoad(aid);
  const chronic = getChronicLoad(aid);
  if(chronic===0) return acute>0 ? 2 : 1;
  return +(acute/chronic).toFixed(2);
}

function getRecentWellness(aid, days=7){
  const from = daysAgo(days);
  const entries = DB.wellness.filter(w=>w.athleteId===aid && w.date>=from && w.date<=TODAY);
  if(!entries.length) return null;
  return +(entries.reduce((s,e)=>s+e.score,0)/entries.length).toFixed(1);
}

function getRecentCMJ(aid, n=5){
  const entries = DB.cmj.filter(c=>c.athleteId===aid).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(!entries.length) return null;
  return +(entries.reduce((s,e)=>s+e.value,0)/entries.length).toFixed(1);
}

function getCMJChange(aid){
  const ath = getAthleteById(aid);
  const recent = getRecentCMJ(aid);
  if(!recent || !ath) return 0;
  return +(((recent - ath.cmjBase)/ath.cmjBase)*100).toFixed(1);
}

function getCMJ30DayAvg(aid){
  const from = daysAgo(30);
  const entries = DB.cmj.filter(c=>c.athleteId===aid && c.date>=from && c.date<=TODAY);
  if(!entries.length) return null;
  return +(entries.reduce((s,e)=>s+e.value,0)/entries.length).toFixed(1);
}

function getCMJ30DayTrend(aid){
  const ath = getAthleteById(aid);
  const avg = getCMJ30DayAvg(aid);
  if(!avg || !ath) return {avg:0, change:0, count:0, status:'neutral'};
  const change = +(((avg - ath.cmjBase)/ath.cmjBase)*100).toFixed(1);
  const from = daysAgo(30);
  const count = DB.cmj.filter(c=>c.athleteId===aid && c.date>=from && c.date<=TODAY).length;
  const status = change >= -3 ? 'ok' : change >= -8 ? 'warn' : 'danger';
  return {avg, change, count, status};
}

function getStatus(aid){
  const cmjChg = getCMJChange(aid);
  const well = getRecentWellness(aid);
  // Semáforo basado en CMJ % cambio desde baseline (MDC - Claudino et al. 2017, Sección 3.3 TFG)
  // Zona roja: caída >10% CMJ = fatiga neuromuscular significativa
  if(cmjChg < -10) return 'rojo';
  // Zona amarilla: caída 5%-10% CMJ = fatiga moderada
  if(cmjChg < -5) return 'amarillo';
  // Concurrencia wellness (Sección 3.2.3 TFG): deterioro en ambas = fatiga sistémica
  if(well!==null && well<2.5 && cmjChg < -3) return 'rojo';
  if(well!==null && well<3.0 && cmjChg < -5) return 'rojo';
  // Wellness bajo con CMJ estable = fatiga central (NFOR risk)
  if(well!==null && well<2.5) return 'amarillo';
  return 'verde';
}

function statusLabel(s){ return s==='verde'?'Óptimo':s==='amarillo'?'Precaución':'Alerta'; }

function statusMsg(s){
  return s==='verde'
    ?'Sistema neuromuscular recuperado. Entrenar según lo planificado.'
    :s==='amarillo'
    ?'Fatiga moderada (CMJ −5% a −10%). Reducir volumen, mantener intensidad.'
    :'Fatiga neuromuscular significativa (CMJ >−10%). Descarga o recuperación activa.';
}

// Interpretación detallada del semáforo basada en concurrencia CMJ-Wellness (TFG Sección 3.2.3)
function getStatusInterpretation(aid){
  const cmjChg = getCMJChange(aid);
  const well = getRecentWellness(aid);
  const ratio = getRatio(aid);
  const st = getStatus(aid);
  let interpretation = '';
  let recommendation = '';

  // Escenarios de concurrencia (Saw et al. 2016; TFG p.25)
  if(well!==null && well<3.0 && cmjChg >= -5){
    // Wellness bajo + CMJ mantenido = fatiga central
    interpretation = 'Bienestar bajo con rendimiento mantenido: Fatiga principalmente central o mental. Riesgo de overreaching no funcional (NFOR) si no se gestiona el componente psicológico.';
    recommendation = 'Reducir estrés psicológico, mejorar calidad de sueño, considerar descarga preventiva.';
  } else if(well!==null && well>=3.5 && cmjChg < -5){
    // Wellness alto + CMJ disminuido = fatiga periférica
    interpretation = 'Bienestar alto con rendimiento disminuido: Fatiga periférica o daño estructural mecánico no percibido. El CMJ actúa como señal de alarma antes de que aparezca la sensación de cansancio.';
    recommendation = 'Reducir volumen (−1 o 2 series por ejercicio). Mantener intensidad. Monitorizar CMJ los próximos días.';
  } else if(well!==null && well<3.0 && cmjChg < -5){
    // Deterioro en ambas = fatiga sistémica
    interpretation = 'Deterioro en ambas variables: Estado de fatiga sistémica confirmado. Riesgo elevado de Síndrome de Sobreentrenamiento (OTS) si no se actúa.';
    recommendation = 'Reducción inmediata de la carga. Sesión de recuperación activa o descanso total. Reducir intensidad mín. 50%.';
  } else if(st==='verde' && cmjChg > 5){
    // CMJ sube >5% por encima del baseline = supercompensación
    interpretation = 'CMJ por encima de la línea base (+5%): Momento óptimo para testear cargas máximas (1RM), iniciar bloques de alta intensidad o competir.';
    recommendation = 'Aprovechar la supercompensación. Aumentar intensidad o volumen si el RPE lo permite.';
  } else if(st==='verde'){
    interpretation = 'Variación del CMJ <5%: Sistema neuromuscular recuperado. El bienestar subjetivo es adecuado.';
    recommendation = 'Entrenar según lo planificado. Si el RPE es bajo, se puede aumentar intensidad o volumen.';
  } else if(st==='amarillo'){
    interpretation = 'Caída del CMJ entre 5% y 10%: Fatiga neuromuscular moderada detectada.';
    recommendation = 'Reducir volumen quitando 1-2 series por ejercicio, pero mantener la intensidad.';
  } else {
    interpretation = 'Caída del CMJ >10%: Fatiga neuromuscular significativa. Posible acumulación de metabolitos (fosfato inorgánico, amoniaco, H+) que comprometen la contracción muscular.';
    recommendation = 'Cambiar la sesión por recuperación activa. Reducir intensidad mín. 50% o descanso total.';
  }

  // Ratio aguda/crónica (Gabbett)
  let ratioNote = '';
  if(ratio > 1.5) ratioNote = 'Ratio A/C >1.5: Riesgo de lesión elevado. Considerar reducción adicional.';
  else if(ratio > 1.3) ratioNote = 'Ratio A/C >1.3: Zona de riesgo moderado. Monitorizar carga.';
  else if(ratio < 0.8) ratioNote = 'Ratio A/C <0.8: Carga insuficiente. El atleta podría estar desentrenándose.';

  return {interpretation, recommendation, ratioNote};
}

async function signInWithGoogle(){
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if(!window.FB?.ready){
    errEl.textContent = 'Firebase aún no está listo, intenta de nuevo en un momento.';
    errEl.classList.remove('hidden');
    return;
  }
  try{
    const FB = window.FB;
    const result = await FB.signInWithPopup(FB.auth, FB.googleProvider);
    // onAuthStateChanged handler hará el resto (carga perfil, muestra app).
    toast('Bienvenido, '+(result.user.displayName||result.user.email),'ok');
  }catch(e){
    console.error('[google sign-in]', e);
    errEl.textContent = 'No se pudo iniciar sesión: '+(e?.message||'error desconocido');
    errEl.classList.remove('hidden');
  }
}

// Se ejecuta cuando Firebase notifica cambio de sesión.
// Crea/carga el documento de usuario y sincroniza datos con la nube.
async function onFirebaseAuthChanged(fbUser){
  if(!fbUser){ window._fbUid = null; return; }
  window._fbUid = fbUser.uid;
  const FB = window.FB;
  try{
    // PASO 1 — ¿Es un atleta vinculado por algún coach?
    const linkRef = FB.doc(FB.db, 'athleteLinks', fbUser.uid);
    const linkSnap = await FB.getDoc(linkRef);
    if(linkSnap.exists()){
      await _loadAthleteSession(fbUser, linkSnap.data());
      return;
    }

    // PASO 2 — Modo coach: carga o crea perfil
    const userRef = FB.doc(FB.db, 'users', fbUser.uid);
    const userSnap = await FB.getDoc(userRef);
    let profile;
    if(userSnap.exists()){
      profile = userSnap.data();
    } else {
      profile = {
        uid: fbUser.uid, email: fbUser.email, name: fbUser.displayName || fbUser.email,
        photoURL: fbUser.photoURL || null, type: 'coach', createdAt: FB.serverTimestamp()
      };
      await FB.setDoc(userRef, profile);
    }
    S.user = { id: fbUser.uid, uid: fbUser.uid, email: profile.email, name: profile.name, type: profile.type, photoURL: profile.photoURL };
    localStorage.setItem('fm_user', JSON.stringify(S.user));

    // Sync global del coach (cloud → local o viceversa)
    const dataRef = FB.doc(FB.db, 'userdata', fbUser.uid);
    const dataSnap = await FB.getDoc(dataRef);
    if(dataSnap.exists()){
      const cloud = dataSnap.data();
      if(cloud.db && cloud.version >= DB_VERSION){
        DB = cloud.db;
        if(!DB.nutritionReports) DB.nutritionReports = [];
        if(!DB.weeklyMenus) DB.weeklyMenus = [];
        localStorage.setItem('fm_db', JSON.stringify(DB));
        localStorage.setItem('fm_db_version', DB_VERSION);
        toast('Datos sincronizados desde la nube','ok');
      }
    } else if(DB && Object.keys(DB).length){
      await FB.setDoc(dataRef, { db: DB, version: DB_VERSION, updatedAt: FB.serverTimestamp() });
      toast('Tus datos locales se han subido a la nube','ok');
    }

    // Suscripción a actualizaciones del espejo enviadas por sus atletas
    _subscribeAthleteMirrors();

    if(document.getElementById('loginPage') && !document.getElementById('loginPage').classList.contains('hidden')){
      showApp();
    }
  }catch(e){
    console.error('[auth changed]', e);
    toast('Error al cargar tu perfil: '+(e?.message||''),'error');
  }
}

// Carga una sesión en modo atleta — reemplaza DB con un slice mínimo para
// que las vistas `athlete-*` funcionen sin cambios.
async function _loadAthleteSession(fbUser, link){
  const FB = window.FB;
  const planRef = FB.doc(FB.db, 'athletePlans', fbUser.uid);
  const planSnap = await FB.getDoc(planRef);
  if(!planSnap.exists()){
    toast('Tu entrenador aún no ha publicado tu plan','warn');
    return;
  }
  const data = planSnap.data();
  const prof = data.profile || {};
  const athleteId = 1;
  const userId = 1;

  // DB local mínima — solo el propio atleta
  DB = {
    users: [{id:userId, name: prof.name || fbUser.displayName || fbUser.email, email: fbUser.email, type:'athlete'}],
    athletes: [{
      id: athleteId, userId, coachId: null, name: prof.name || fbUser.displayName || fbUser.email,
      sport: prof.sport||'', age: prof.age||null, weight: prof.weight||null, height: prof.height||null,
      level: prof.level||'', cmjBase: prof.cmjBase||null, photo: prof.photo||null,
      googleUid: fbUser.uid, coachUid: link.coachUid
    }],
    plans: data.plan ? [{...data.plan, athleteId}] : [],
    sessions: [], cmj: [], wellness: [], reports: [], nutritionReports: [], weeklyMenus: []
  };
  // Fusionar realByKey (ediciones previas del atleta) dentro de los ejercicios del plan
  if(data.realByKey && DB.plans[0]?.detailedSessions){
    Object.entries(data.realByKey).forEach(([k, real])=>{
      const [mesoMicro, siStr, eiStr] = k.split('_');
      const sess = DB.plans[0].detailedSessions[mesoMicro];
      const ex = sess?.[+siStr]?.exercises?.[+eiStr];
      if(ex) ex.real = real;
    });
  }
  localStorage.setItem('fm_db', JSON.stringify(DB));

  S.user = { id: userId, uid: fbUser.uid, email: fbUser.email, name: prof.name || fbUser.displayName, type: 'athlete', photoURL: fbUser.photoURL||null };
  localStorage.setItem('fm_user', JSON.stringify(S.user));

  // Suscripción a cambios del plan en vivo
  FB.onSnapshot(planRef, snap=>{
    if(!snap.exists()) return;
    const d = snap.data();
    if(d.plan){ DB.plans[0] = {...d.plan, athleteId}; }
    if(d.realByKey && DB.plans[0]?.detailedSessions){
      Object.entries(d.realByKey).forEach(([k, real])=>{
        const [mesoMicro, siStr, eiStr] = k.split('_');
        const sess = DB.plans[0].detailedSessions[mesoMicro];
        const ex = sess?.[+siStr]?.exercises?.[+eiStr];
        if(ex) ex.real = real;
      });
    }
    localStorage.setItem('fm_db', JSON.stringify(DB));
    if(S.view && S.view.startsWith('athlete-')) navigate(S.view, S.params);
  });

  if(document.getElementById('loginPage') && !document.getElementById('loginPage').classList.contains('hidden')){
    showApp();
  }
  toast('Plan cargado desde tu entrenador','ok');
}

// Para el coach — listen on /athletePlans docs where coachUid === mine
// para capturar las ediciones reales que haga el atleta desde su móvil.
let _mirrorUnsubs = [];
function _subscribeAthleteMirrors(){
  _mirrorUnsubs.forEach(u=>{ try{u();}catch(e){} });
  _mirrorUnsubs = [];
  const FB = window.FB;
  (DB.athletes||[]).forEach(ath=>{
    if(!ath.googleUid) return;
    const ref = FB.doc(FB.db, 'athletePlans', ath.googleUid);
    const unsub = FB.onSnapshot(ref, snap=>{
      if(!snap.exists()) return;
      const d = snap.data();
      if(!d.realByKey) return;
      const plan = DB.plans.find(p=>p.athleteId===ath.id);
      if(!plan?.detailedSessions) return;
      let changed = false;
      Object.entries(d.realByKey).forEach(([k, real])=>{
        const [mesoMicro, siStr, eiStr] = k.split('_');
        const ex = plan.detailedSessions[mesoMicro]?.[+siStr]?.exercises?.[+eiStr];
        if(ex){
          const before = JSON.stringify(ex.real||{});
          ex.real = {...(ex.real||{}), ...real};
          if(JSON.stringify(ex.real) !== before) changed = true;
        }
      });
      if(changed){
        localStorage.setItem('fm_db', JSON.stringify(DB));
        if(S.view === 'coach-sesiones-detail' || S.view === 'coach-athlete-detail'){
          navigate(S.view, S.params);
        }
      }
    });
    _mirrorUnsubs.push(unsub);
  });
}

// ===== NAVIGATION =====
function navigate(view, params={}){
  S.view = view;
  S.params = params;
  // Destroy charts
  Object.values(S.charts).forEach(c=>{ try{c.destroy();}catch(e){} });
  S.charts = {};
  // Update sidebar active
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.v===view));
  // Render
  const c = document.getElementById('content');
  const views = {
    'coach-dashboard': viewCoachDash,
    'coach-athletes': viewCoachAthletes,
    'coach-athlete-detail': ()=>viewAthleteDetail(params.id),
    'coach-macrociclo': viewMacrociclo,
    'coach-mesociclo': viewMesociclo,
    'coach-sesiones-detail': viewSesionesDetail,
    'coach-evaluacion': viewEvaluacion,
    'coach-progreso': viewProgreso,
    'coach-sessions': viewSessions,
    'coach-reports': viewCoachReports,
    'coach-apre': viewAPRE,
    'coach-nutricion': viewNutricion,
    'athlete-dashboard': viewAthDash,
    'athlete-checkin': viewCheckin,
    'athlete-plan': viewAthPlan,
    'athlete-workouts': viewAthWorkouts,
    'athlete-progress': viewAthProgress,
    'athlete-reports': viewAthReports,
    'athlete-apre': viewAPRE,
    'athlete-nutricion': viewNutricion
  };
  if(views[view]){
    // Error boundary: si una vista falla por datos corruptos / caché desincronizada,
    // mostramos un mensaje amigable con opción de resetear en vez de romper toda la app.
    try{
      c.innerHTML = views[view]();
    }catch(err){
      console.error('[FatigaMonitor] Error renderizando vista', view, err);
      c.innerHTML = `
        <div class="pg-header"><div><div class="pg-title">Ups — vista no disponible</div><div class="pg-sub">Se ha detectado un problema cargando "${view}"</div></div></div>
        <div class="pg-body">
          <div class="card" style="background:rgba(160,64,64,.05);border-color:rgba(160,64,64,.3)">
            <div style="font-family:var(--mono);font-size:10px;color:var(--danger);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:600"><i class="fas fa-exclamation-triangle"></i> Error de renderizado</div>
            <div style="font-size:13px;line-height:1.6;color:var(--text);margin-bottom:16px">
              Esto suele pasar tras actualizar la app si quedan datos antiguos guardados en el navegador.
              Prueba a refrescar con <strong>Ctrl+Shift+R</strong> (o <strong>Cmd+Shift+R</strong> en Mac) para recargar sin caché.
              Si el problema continúa, puedes resetear los datos locales (<strong>no se perderán los datos en la nube</strong>):
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-ghost btn-sm" onclick="location.reload(true)"><i class="fas fa-redo"></i> Recargar sin caché</button>
              <button class="btn btn-ghost btn-sm" onclick="if(confirm('¿Seguro que quieres borrar los datos locales? Se recargará la app.')){localStorage.clear();sessionStorage.clear();location.reload();}" style="color:var(--danger);border-color:var(--danger)"><i class="fas fa-trash"></i> Resetear datos locales</button>
              <button class="btn btn-ghost btn-sm" onclick="navigate('coach-dashboard')"><i class="fas fa-home"></i> Volver al dashboard</button>
            </div>
            <details style="margin-top:14px;font-size:10px;color:var(--muted)"><summary style="cursor:pointer">Detalles técnicos</summary><pre style="font-family:var(--mono);font-size:10px;margin-top:6px;padding:8px;background:var(--bg);border-radius:3px;overflow:auto;max-height:160px">${(err&&err.stack?err.stack:err&&err.message?err.message:String(err)).replace(/</g,'&lt;')}</pre></details>
          </div>
        </div>`;
      return;
    }
    try{ afterRender(view, params); }
    catch(err){ console.error('[FatigaMonitor] Error en afterRender', view, err); }
  }
}

// ===== POST-RENDER: Initialize charts and events =====

}

// ===== CHART HELPER =====
function mkChart(canvasId, cfg){
  const el = document.getElementById(canvasId);
  if(!el) return;
  cfg.options = cfg.options || {};
  cfg.options.responsive = true;
  cfg.options.maintainAspectRatio = false;
  cfg.options.plugins = cfg.options.plugins || {};
  cfg.options.plugins.legend = cfg.options.plugins.legend || {display:true, labels:{color:'#8A7E6B',font:{size:11,family:'DM Mono'}}};
  cfg.options.scales = cfg.options.scales || {};
  if(cfg.type!=='doughnut' && cfg.type!=='pie'){
    cfg.options.scales.x = cfg.options.scales.x || {ticks:{color:'#8A7E6B',font:{size:10,family:'DM Mono'}},grid:{color:'rgba(214,204,186,.4)'}};
    cfg.options.scales.y = cfg.options.scales.y || {ticks:{color:'#8A7E6B',font:{size:10,family:'DM Mono'}},grid:{color:'rgba(214,204,186,.4)'}};
  }
  S.charts[canvasId] = new Chart(el, cfg);
}

function setupCoachDashCharts(){

  mkChart('chartDashSessions',{
