            ${i===dayIdx?'<div style="width:20px;height:2px;background:var(--primary);margin:6px auto 0;border-radius:1px"></div>':''}
          </div>`).join('')}
        </div>
      </div>`:''}

      <div class="card mb-24" style="border-left:4px solid var(--primary)">
        <div class="card-title"><i class="fas fa-dumbbell" style="margin-right:6px"></i>Sesión Planificada — ${dayLabelsFull[dayIdx]} <span style="font-weight:400;font-size:12px;color:var(--muted);margin-left:8px">${plan&&plan.mesociclos&&plan.mesociclos[autoMeso-1]?plan.mesociclos[autoMeso-1].name:'Mes '+autoMeso} · Semana ${autoMicro}</span></div>
        ${(()=>{
          const ds = plan&&plan.detailedSessions&&plan.detailedSessions[`${autoMeso}-${autoMicro}`];
          const todaySesCard = ds ? ds[dayIdx] : null;
          const cardExs = todaySesCard ? todaySesCard.exercises.filter(e=>e.name) : [];
          if(cardExs.length){
            return '<div class="tbl-wrap"><table><thead><tr><th>Ejercicio</th><th>Kg</th><th>Serie 1</th><th>Serie 2</th><th>Serie 3</th><th>Serie 4</th><th>RIR</th><th>Descanso</th></tr></thead><tbody>'+
              cardExs.map(ex=>'<tr><td style="font-weight:600">'+ex.name+'</td><td style="font-family:DM Sans;font-weight:700;color:var(--primary)">'+(ex.kg?ex.kg+' kg':'—')+'</td><td>'+(ex.s1||'—')+'</td><td>'+(ex.s2||'—')+'</td><td>'+(ex.s3||'—')+'</td><td>'+(ex.s4||'—')+'</td><td style="font-weight:700;color:var(--accent)">'+(ex.rir||'—')+'</td><td>'+(ex.descanso?ex.descanso+" min":"—")+'</td></tr>').join('')+
              '</tbody></table></div>'+
              (todaySesCard.observations?'<div style="font-size:12px;color:var(--muted);margin-top:10px;padding:8px;background:var(--bg);border-radius:4px"><i class="fas fa-comment" style="margin-right:4px;color:var(--primary)"></i>'+todaySesCard.observations+'</div>':'');
          } else {
            const scheduleToday = plan&&plan.schedule ? plan.schedule[days[dayIdx]]||'Descanso' : 'Descanso';
            return '<div style="text-align:center;padding:24px;color:var(--muted)"><i class="fas fa-clipboard-list" style="font-size:24px;margin-bottom:10px;display:block"></i><div style="font-weight:600;color:var(--text);margin-bottom:4px;font-size:16px">'+scheduleToday+'</div><div style="font-size:13px">Tu entrenador aún no ha añadido los ejercicios detallados para esta sesión</div></div>';
          }
        })()}
      </div>

      <div class="grid-2 mb-24">
        <div class="card">
          <div class="card-title">Sesiones Registradas Hoy</div>
          ${today.length?today.map(s=>'<div style="padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;margin-bottom:6px"><div class="flex justify-between items-center"><span class="badge badge-pri">'+getSessionTypeName(s.type)+'</span><span style="font-family:DM Sans;font-weight:700;color:var(--primary)">'+s.extLoad.toFixed(1)+' carga</span></div><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px">Vol: '+s.volume+' · Int: '+s.intensity+'% · RPE: '+s.rpe+'/10</div></div>').join(''):'<div style="text-align:center;padding:24px;color:var(--muted)"><i class="fas fa-running" style="font-size:24px;margin-bottom:8px;display:block"></i>No hay sesión registrada hoy</div>'}
        </div>
        <div class="card">
          <div class="card-title">Resumen Semanal</div>
          <div class="grid-2" style="gap:12px">
            <div class="metric"><div class="metric-val">${week.length}</div><div class="metric-lbl">Sesiones</div></div>
            <div class="metric"><div class="metric-val">${week.reduce((s,x)=>s+x.extLoad,0).toFixed(1)}</div><div class="metric-lbl">Carga Total</div></div>
            <div class="metric"><div class="metric-val">${week.length?(week.reduce((s,x)=>s+x.rpe,0)/week.length).toFixed(1):'—'}</div><div class="metric-lbl">RPE Medio</div></div>
            <div class="metric"><div class="metric-val">${week.length?Math.round(week.reduce((s,x)=>s+x.intensity,0)/week.length):'—'}%</div><div class="metric-lbl">Int. Media</div></div>
          </div>
        </div>
      </div>

      ${athMesoNav}

      ${weekDetailHTML?`<div class="mb-24"><div style="font-family:var(--serif);font-size:20px;margin-bottom:16px;color:var(--text)">Sesiones Detalladas — Semana ${currentMicro}, ${plan.mesociclos&&plan.mesociclos[currentMeso-1]?plan.mesociclos[currentMeso-1].name:'Mes '+currentMeso}</div>${weekDetailHTML}</div>`:''}

      <div class="card">
        <div class="card-title">Historial de Sesiones</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Volumen</th><th>Intensidad</th><th>Carga</th><th>RPE</th></tr></thead>
          <tbody>
          ${sessions.slice(0,20).map(s=>`<tr>
            <td>${fmtShort(s.date)}</td>
            <td><span class="badge badge-pri">${getSessionTypeName(s.type)}</span></td>
            <td>${s.volume}</td><td>${s.intensity}%</td>
            <td style="font-weight:700">${s.extLoad.toFixed(1)}</td>
            <td><span style="font-weight:700;color:${s.rpe<=5?'var(--ok)':s.rpe<=7?'var(--warn)':'var(--danger)'}">${s.rpe}/10</span></td>
          </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
    </div>`;
}

function saveAthSession(athId){
  const date = document.getElementById('athSesDate').value;
  const type = document.getElementById('athSesType').value;
  const volume = parseInt(document.getElementById('athSesVol').value)||0;
  const intensity = parseInt(document.getElementById('athSesInt').value)||0;
  const rpe = sesRPEVal || 5;
  const notes = document.getElementById('athSesNotes').value;
  if(!date||!volume){toast('Indica fecha y volumen','error');return;}

  // Save wellness if filled
  const wellResult = saveWellnessFromSession(athId, date);
  if(wellResult===false) return;

  const extLoad = parseFloat(((volume*intensity/100*rpe/10)/10).toFixed(1));
  DB.sessions.push({
    id:uid(), athleteId:athId, coachId: DB.athletes.find(a=>a.id===athId)?.coachId||1,
    date, type, microType:'corriente', volume, intensity, rpe, extLoad,
    notes, logged:true
  });
  save(); closeModal(); sesRPEVal=0; toast('Entrenamiento registrado'+(wellResult===true?' (con wellness)':''));
  navigate('athlete-workouts');
}

function setupProgressCharts(){
  const ath = DB.athletes.find(a=>a.userId===S.user.id);
  if(!ath) return;
  // CMJ (all data)
  const cmjAll = DB.cmj.filter(c=>c.athleteId===ath.id).sort((a,b)=>a.date.localeCompare(b.date));
  const cmjValsP = cmjAll.map(c=>c.value);
  const cmjMinP = Math.min(...cmjValsP, ath.cmjBase);
  const cmjMaxP = Math.max(...cmjValsP, ath.cmjBase);
  const cmjPadP = (cmjMaxP - cmjMinP) * 0.25 || 2;
  mkChart('chartProgCMJ',{
    type:'line',
    data:{
      labels:cmjAll.map(c=>fmtShort(c.date)),
      datasets:[
        {label:'CMJ (cm)',data:cmjValsP,borderColor:'#5B4F8A',backgroundColor:'rgba(91,79,138,.1)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#5B4F8A'},
        {label:'Baseline ('+ath.cmjBase+' cm)',data:cmjAll.map(()=>ath.cmjBase),borderColor:'rgba(160,64,64,.7)',borderDash:[6,4],pointRadius:0,borderWidth:2}
      ]
    },
    options:{scales:{y:{suggestedMin: cmjMinP - cmjPadP, suggestedMax: cmjMaxP + cmjPadP}}}
  });
  // Wellness (all data)
  const wellAll = DB.wellness.filter(w=>w.athleteId===ath.id).sort((a,b)=>a.date.localeCompare(b.date));
  mkChart('chartProgWell',{
    type:'line',
    data:{
      labels:wellAll.map(w=>fmtShort(w.date)),
      datasets:[
        {label:'Fatiga',data:wellAll.map(w=>w.fatigue),borderColor:'#A04040',tension:.3,pointRadius:0},
        {label:'Ánimo',data:wellAll.map(w=>w.mood),borderColor:'#5B4F8A',tension:.3,pointRadius:0},
        {label:'Sueño',data:wellAll.map(w=>w.sleep),borderColor:'#7B6EAA',tension:.3,pointRadius:0},
        {label:'Estrés',data:wellAll.map(w=>w.stress),borderColor:'#9E8035',tension:.3,pointRadius:0},
        {label:'Motivación',data:wellAll.map(w=>w.motivation),borderColor:'#4A7A5A',tension:.3,pointRadius:0}
      ]
    },
    options:{scales:{y:{min:1,max:5}}}
  });
  // Weekly load
  const weekLabels=[], weekLoads=[];
  for(let w=7;w>=0;w--){
    weekLabels.push(''+(8-w));
    const from=daysAgo((w+1)*7), to=daysAgo(w*7);
    weekLoads.push(+DB.sessions.filter(s=>s.athleteId===ath.id && s.date>from && s.date<=to).reduce((sum,s)=>sum+s.extLoad,0).toFixed(1));
  }
  mkChart('chartProgLoad',{type:'bar',data:{labels:weekLabels,datasets:[{label:'Carga Semanal',data:weekLoads,backgroundColor:'rgba(91,79,138,.65)',borderRadius:6}]},options:{scales:{x:{title:{display:true,text:'Semanas',color:'#8A7E6B',font:{size:11,family:'DM Mono'}}}},plugins:{legend:{display:false}}}});
  // Ratio over weeks
  const ratioData=[];
  for(let w=3;w>=0;w--){
    const wAcute = DB.sessions.filter(s=>s.athleteId===ath.id && s.date>daysAgo((w+1)*7) && s.date<=daysAgo(w*7)).reduce((sum,s)=>sum+s.extLoad,0);
    let wChronic = 0;
    for(let cw=0;cw<4;cw++){
      wChronic += DB.sessions.filter(s=>s.athleteId===ath.id && s.date>daysAgo((w+cw+1)*7) && s.date<=daysAgo((w+cw)*7)).reduce((sum,s)=>sum+s.extLoad,0);
    }
    wChronic /= 4;
    ratioData.push(wChronic?+(wAcute/wChronic).toFixed(2):1);
  }
  mkChart('chartProgRatio',{
    type:'line',
    data:{
      labels:['1','2','3','4'],
      datasets:[

// ===== CIENCIA DEL ENTRENAMIENTO — CONSTANTES Y HELPERS =====
// Basado en "Planificación Deportiva Científica y Automatizada" (fisiología +
// periodización + integración algorítmica). Cada categoría define el modelo
// óptimo de periodización, la duración/volumen del taper antes de un pico
// competitivo y la frecuencia de semanas de descarga.
// NOTA: se llama SPORT_PERIODIZATION_MAP (no SPORT_CATEGORIES) para no
// colisionar con el SPORT_CATEGORIES (capitalizado) usado por nutrición y
// el perfil deportivo del atleta (línea ~424).
const SPORT_PERIODIZATION_MAP = {
  ciclico: {
    label:'Cíclico (resistencia)',
    examples:'Maratón, triatlón, natación, ciclismo, atletismo fondo',
    defaultPeriodization:'atr',        // Bloques/ATR según PDF
    altPeriodization:'tradicional',    // Tradicional-secuenciada para principiantes
    taperWeeks:2, taperVolReduction:50, // Reducción exponencial 41-60%
    peaksPerYear:2, deloadEveryWeeks:4
  },
  combate: {
    label:'Combate',
    examples:'Boxeo, MMA, judo, karate, taekwondo, lucha',
    defaultPeriodization:'atr',
    altPeriodization:'bloques',

    peaksPerYear:3, deloadEveryWeeks:4
  },
  fuerza: {
    label:'Fuerza',
    examples:'Powerlifting, halterofilia, strongman',
    defaultPeriodization:'bloques',
    altPeriodization:'tradicional',
    taperWeeks:2, taperVolReduction:50, // Strength taper 30-70%
    peaksPerYear:2, deloadEveryWeeks:4
  },
  equipo: {
    label:'Equipo / Liga',
    examples:'Fútbol, baloncesto, balonmano, rugby, voleibol, hockey',
    defaultPeriodization:'larga-tradicional',

    taperWeeks:1, taperVolReduction:30,

  },
  potencia_tecnica: {
    label:'Potencia técnica',
    examples:'Gimnasia, lanzadores, saltadores, velocistas',
    defaultPeriodization:'bloques',
    altPeriodization:'atr',
    taperWeeks:2, taperVolReduction:50,
    peaksPerYear:2, deloadEveryWeeks:4
  },
  funcional: {
    label:'Funcional / Mixto',
    examples:'CrossFit, HYROX, pentatlón moderno, aventura',
    defaultPeriodization:'atr',
    altPeriodization:'bloques',
    taperWeeks:1, taperVolReduction:40,
    peaksPerYear:3, deloadEveryWeeks:4
  },
  tecnico: {
    label:'Técnico de precisión',
    examples:'Tiro, arquería, hípica, vela, golf',
    defaultPeriodization:'tradicional',
    altPeriodization:'atr',

    peaksPerYear:2, deloadEveryWeeks:6
  }
};

// Perfil por nivel (Matveyev para principiantes → Bloques/ATR para élite)
const LEVEL_PROFILE = {
  principiante: {label:'Principiante',   mesoLen:4, deloadFactor:1.5, preferredModel:'tradicional', microCapLoad:18},
  intermedio:   {label:'Intermedio',     mesoLen:4, deloadFactor:1.2, preferredModel:'tradicional', microCapLoad:21},
  avanzado:     {label:'Avanzado',       mesoLen:4, deloadFactor:1.0, preferredModel:'atr',         microCapLoad:22},
  elite:        {label:'Élite',          mesoLen:3, deloadFactor:0.8, preferredModel:'bloques',     microCapLoad:25}
};

// Tipos de competición dentro de un calendario anual
// NOTA: se llama COMPETITION_PICO_TYPES (no COMPETITION_TYPES) para no
// colisionar con el COMPETITION_TYPES (array de strings) del perfil del
// atleta en la línea ~494.
const COMPETITION_PICO_TYPES = {
  pico:        {label:'Pico (objetivo principal)', taperFactor:1.0, emoji:'🏆'},
  secundaria:  {label:'Secundaria',                 taperFactor:0.6, emoji:'🥈'},
  test:        {label:'Test / preparatoria',        taperFactor:0.3, emoji:'⏱️'},
  control:     {label:'Control sin taper',          taperFactor:0,   emoji:'📊'}
};

// Normaliza valores libres del atleta a claves internas
function normalizeSportCategory(rawCategory, rawSport){
  const k = ((rawCategory||'')+' '+(rawSport||'')).toLowerCase();
  if(/fuerza|powerlift|haltero|strongman/.test(k)) return 'fuerza';
  if(/cross|funcional|hyrox|pentatl/.test(k)) return 'funcional';
  if(/futbol|fútbol|basket|balonmano|rugby|voleibol|hockey|equipo|liga/.test(k)) return 'equipo';
  if(/boxeo|mma|judo|karate|taekwondo|lucha|combate/.test(k)) return 'combate';
  if(/gimnasia|lanza|salto|velocidad|sprint/.test(k)) return 'potencia_tecnica';
  if(/maratón|triat|nataci|ciclis|fondo|resistencia|corredor/.test(k)) return 'ciclico';
  if(/tiro|arquer|hípica|vela|golf/.test(k)) return 'tecnico';
  return 'ciclico'; // fallback genérico
}
function normalizeLevel(raw){
  const k = (raw||'').toLowerCase();
  if(/elite|élite|profesional/.test(k)) return 'elite';
  if(/avanz/.test(k)) return 'avanzado';
  if(/inter/.test(k)) return 'intermedio';
  if(/princip|amateur|iniciado/.test(k)) return 'principiante';
  return 'intermedio';
}

// Elige el modelo de periodización óptimo a partir del perfil completo
function pickPeriodizationModel({category, level, nCompetitions, totalWeeks, sex}){
  const cat = SPORT_PERIODIZATION_MAP[category] || SPORT_PERIODIZATION_MAP.ciclico;
  const lvl = LEVEL_PROFILE[level] || LEVEL_PROFILE.intermedio;
  // Principiantes: siempre tradicional
  if(level==='principiante') return cat.label.includes('Equipo')?'larga-tradicional':'tradicional';
  // Equipo: larga temporada
  if(category==='equipo') return nCompetitions>=15 ? 'larga-atr' : 'larga-tradicional';
  // Élite + fuerza/potencia: bloques
  if(level==='elite' && (category==='fuerza'||category==='potencia_tecnica')) return 'bloques';
  // Múltiples picos y resistencia: ATR
  if(nCompetitions>=2 && (category==='ciclico'||category==='funcional'||category==='combate')) return 'atr';
  // Solo 1-2 picos y nivel avanzado+: depende del deporte
  if(nCompetitions<=2 && level!=='principiante'){
    if(category==='fuerza'||category==='potencia_tecnica') return 'bloques';
    if(category==='ciclico') return 'atr';
  }
  return cat.defaultPeriodization || lvl.preferredModel;
}

// Construye una secuencia de mesociclos a medida, con taper antes de cada pico
// competitivo y descargas periódicas. Los microtipos siguen la teoría clásica:
//  G  gradual         (10-12)
//  C  corriente       (14-18)
//  CH choque          (19-22)
//  A  aproximación    (15-17)
//  CP competición     (11-15, con isComp=1)
//  R  restablecimiento (4-10)
function buildAutoMesoDefs(profile){
  const { startDate, competitions=[], level='intermedio', category='ciclico',
          weeksUntilFirstComp, totalWeeks } = profile;
  const cat = SPORT_PERIODIZATION_MAP[category] || SPORT_PERIODIZATION_MAP.ciclico;
  const lvl = LEVEL_PROFILE[level] || LEVEL_PROFILE.intermedio;
  const mesoLen = lvl.mesoLen; // 3 ó 4 semanas

  // Ordenar competiciones por fecha
  const comps = (competitions||[]).slice().filter(c=>c.date).sort((a,b)=>a.date.localeCompare(b.date));

  // Helper para construir un mesociclo estándar por "rol"
  // Roles: acondicionamiento / general / especifico / preparatorio / taper / deload / competicion / transicion / acumulacion / transformacion / realizacion
  const microByRole = {
    acondicionamiento: mesoLen===4 ? [['gradual',10],['gradual',12],['corriente',14],['restablecimiento',8]] : [['gradual',10],['corriente',14],['restablecimiento',8]],
    general:        mesoLen===4 ? [['corriente',14],['choque',19],['corriente',16],['restablecimiento',8]] : [['corriente',14],['choque',19],['restablecimiento',8]],
    especifico:     mesoLen===4 ? [['corriente',15],['choque',21],['choque',19],['restablecimiento',8]] : [['choque',19],['choque',21],['restablecimiento',8]],
    acumulacion:    mesoLen===4 ? [['corriente',16],['choque',21],['choque',21],['restablecimiento',8]] : [['corriente',16],['choque',21],['restablecimiento',8]],
    transformacion: mesoLen===4 ? [['corriente',16],['choque',21],['aproximacion',17],['restablecimiento',8]] : [['choque',21],['aproximacion',17],['restablecimiento',8]],
    realizacion:    [['aproximacion',17],['competicion',13,1],['competicion',11,1]],
    preparatorio:   mesoLen===4 ? [['choque',19],['corriente',16],['aproximacion',17],['restablecimiento',8]] : [['choque',19],['aproximacion',17],['restablecimiento',8]],
    transicion:     [['restablecimiento',8],['restablecimiento',6],['restablecimiento',4]],
    deload:         [['restablecimiento',8],['restablecimiento',6]]
  };

  // Taper previo a competición pico: reduce volumen según taperVolReduction del deporte
  // Mantiene intensidad. Duración según cat.taperWeeks.
  function buildTaperMicros(taperFactor){
    const w = Math.max(1, Math.round(cat.taperWeeks * taperFactor));
    if(w<=0) return [];
    if(w===1) return [['aproximacion',15]];
    if(w===2) return [['aproximacion',17],['aproximacion',13]];
    return [['aproximacion',17],['aproximacion',15],['aproximacion',13]];
  }
  function buildCompMicro(){ return [['competicion',13,1]]; }

  const mesoDefs = [];
  const addMeso = (name, type, role, periodo, etapa, objective) => {
    mesoDefs.push({ name, type, objective, periodo, etapa, micro: microByRole[role].map(m=>[...m]) });
  };

  // === Estructura base según modelo ===
  const model = profile.modelOverride || pickPeriodizationModel({category, level, nCompetitions:comps.length, totalWeeks, sex:profile.sex});

  if(model==='bloques'){
    // Bloques: intro + bloques fuerza/técnica alternados + competición
    addMeso('Introductorio','introductorio','acondicionamiento','Preparatorio','Etapa Preparación Condicional','Acondicionamiento general / Técnica base');
    addMeso('Bloque Fuerza 1','ms-fuerza','acumulacion','Preparatorio','Bloque Fuerza','Fuerza máxima / Potencia aeróbica');
    addMeso('Bloque Técnica 1','ms-tecnica','transformacion','Preparatorio','Bloque Técnica','Fuerza explosivo-repetitiva / Técnica');
    if(comps.length>=2){
      addMeso('Bloque Fuerza 2','ms-fuerza','acumulacion','Preparatorio 2','Bloque Fuerza','Fuerza máxima / Potencia aeróbica');
      addMeso('Bloque Técnica 2','ms-tecnica','transformacion','Preparatorio 2','Bloque Técnica','Fuerza explosivo-repetitiva / Técnica');
    }
  } else if(model==='atr' || model==='larga-atr'){
    const nBlocks = Math.max(1, Math.min(4, comps.length||2));
    for(let i=0;i<nBlocks;i++){
      const tag = nBlocks>1?` ${i+1}`:'';
      addMeso('Acumulación'+tag,'acumulacion','acumulacion',`Macrociclo ATR${tag}`,'Acumulación','Fuerza máxima / Potencia aeróbica');
      addMeso('Transformación'+tag,'transformacion','transformacion',`Macrociclo ATR${tag}`,'Transformación','Fuerza repetitiva / Potencia específica');
      addMeso('Realización'+tag,'realizacion','realizacion',`Macrociclo ATR${tag}`,'Realización','Velocidad / Ritmo competición');
    }
  } else if(model==='tradicional-doble'){
    addMeso('Introductorio','introductorio','acondicionamiento','Preparatorio 1','Etapa Preparación General','Acondicionamiento general');
    addMeso('BPG 1','bpg','general','Preparatorio 1','Etapa Preparación General','Fuerza general / Resistencia general');
    addMeso('BPE 1','bpe','especifico','Preparatorio 1','Etapa Preparación Específica','Capacidad aeróbica / Fuerza resistencia');
    addMeso('Preparatorio 1','preparatorio','preparatorio','Competiciones 1','Estabilización de la Forma','Ritmo competición');
    addMeso('BPG 2','bpg','general','Preparatorio 2','Etapa Preparación General','Fuerza general / Resistencia general');
    addMeso('BPE 2','bpe','especifico','Preparatorio 2','Etapa Preparación Específica','Capacidad aeróbica / Fuerza resistencia');
    addMeso('Preparatorio 2','preparatorio','preparatorio','Competiciones 2','Estabilización de la Forma','Ritmo competición');
  } else if(model==='larga-tradicional'){
    addMeso('Introductorio','introductorio','acondicionamiento','Preparatorio','Etapa Preparación General','Acondicionamiento / Técnica base');
    addMeso('BPG','bpg','general','Preparatorio','Etapa Preparación General','Fuerza general / Resistencia general');
    addMeso('BPE','bpe','especifico','Preparatorio','Etapa Preparación Específica','Sistemas de juego / Capacidad aeróbica');
    addMeso('Preparatorio','preparatorio','preparatorio','Competiciones','Estabilización de la Forma','Sistemas de juego');
  } else { // tradicional
    addMeso('Introductorio','introductorio','acondicionamiento','Preparatorio','Etapa Preparación General','Acondicionamiento general / Técnica');
    addMeso('BPG','bpg','general','Preparatorio','Etapa Preparación General','Fuerza general / Resistencia general');
    addMeso('BPE','bpe','especifico','Preparatorio','Etapa Preparación Específica','Fuerza y resistencia específicas');
    addMeso('Preparatorio','preparatorio','preparatorio','Competiciones','Estabilización de la Forma','Ritmo competición / Rapidez ejecución');
  }

  // === Bloque de competición + taper por cada pico ===
  comps.forEach((c,idx) => {
    const ct = COMPETITION_PICO_TYPES[c.type] || COMPETITION_PICO_TYPES.pico;
    const tMicros = buildTaperMicros(ct.taperFactor);
    const cMicros = buildCompMicro();
    mesoDefs.push({
      name:`${ct.emoji} ${c.name||'Competición'} ${idx+1}`,
      type:'competicion',
      objective:`Pico competitivo · ${c.date}`,
      periodo: comps.length>1?`Competiciones ${idx+1}`:'Competiciones',
      etapa: ct.label,
      micro: [...tMicros, ...cMicros]
    });
  });

  // Si no hay competiciones, asegurar un mesociclo de competición genérico
  if(!comps.length){
    mesoDefs.push({name:'Competición',type:'competicion',objective:'Picos competitivos',periodo:'Competiciones',etapa:'Competiciones Fundamentales',micro:[['aproximacion',17],['competicion',13,1],['competicion',11,1],['restablecimiento',8]]});
  }

  // === Transición/regeneración al final ===
  mesoDefs.push({name:'Transición',type:'restablecimiento',objective:'Regeneración física y psicológica',periodo:'Transitorio',etapa:'Regeneración',micro:microByRole.transicion.map(m=>[...m])});

  // === Insertar descargas periódicas si el total es largo ===
  // (el microciclo R final de cada mesociclo ya actúa como descarga natural, así que
  // no hace falta insertar semanas extra: la teoría queda cubierta).
  return { mesoDefs, model, cat, lvl };
}

// Renderiza la lista dinámica de competiciones del wizard
function renderMacroCompList(athId){
  const list = window.__macroCompList||[];
  const el = document.getElementById('macroCompList');
  if(!el) return;
  if(!list.length){ el.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:6px">Sin competiciones — añade al menos una pico para activar el taper.</div>'; return; }
  el.innerHTML = list.map((c,i)=>`
    <div style="display:grid;grid-template-columns:1.2fr 1.3fr 1.3fr auto;gap:6px;align-items:center;margin-bottom:6px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px">
      <input type="date" value="${c.date||''}" onchange="window.__macroCompList[${i}].date=this.value;updateMacroModalOptions(${athId})" style="font-size:11px;padding:4px 6px">
      <select onchange="window.__macroCompList[${i}].type=this.value;updateMacroModalOptions(${athId})" style="font-size:11px;padding:4px 6px">
        ${Object.entries(COMPETITION_PICO_TYPES).map(([k,v])=>`<option value="${k}" ${k===c.type?'selected':''}>${v.emoji} ${v.label}</option>`).join('')}
      </select>
      <input type="text" value="${(c.name||'').replace(/"/g,'&quot;')}" placeholder="Nombre competición" onchange="window.__macroCompList[${i}].name=this.value" style="font-size:11px;padding:4px 6px">
      <button type="button" class="btn btn-ghost btn-sm" onclick="removeMacroCompetition(${i},${athId})" style="color:var(--danger);padding:2px 6px;font-size:10px" title="Eliminar"><i class="fas fa-times"></i></button>
    </div>
  `).join('');
}
function addMacroCompetition(athId){
  window.__macroCompList = window.__macroCompList||[];

function removeMacroCompetition(idx, athId){

  else if(macroType==='larga-atr'){
    mesoDefs.push({name:'Acumulación',type:'acumulacion',objective:'Fuerza máxima / Potencia aeróbica / Táctica individual — Sistemas de juego',periodo:'Macrociclo ATR',etapa:'Acumulación',micro:[['gradual',10],['corriente',16],['choque',21],['choque',21],['choque',21],['restablecimiento',8]]});
    mesoDefs.push({name:'Transformación',type:'transformacion',objective:'Sistemas de juego / Umbral anaeróbico o Potencia aeróbica / Fuerza repetitiva',periodo:'Macrociclo ATR',etapa:'Transformación',micro:[['corriente',16],['choque',21],['choque',21],['aproximacion',17]]});
    mesoDefs.push({name:'Realización',type:'realizacion',objective:'Modelo de competición / Velocidad o rapidez de ejecución / Ritmo competición',periodo:'Macrociclo ATR',etapa:'Realización',micro:[['competicion',15,1],['competicion',13,1],['competicion',11,1]]});
    mesoDefs.push({name:'Restablecimiento',type:'restablecimiento',objective:'Regeneración física y psicológica',periodo:'Transitorio',etapa:'Restablecimiento',micro:[['restablecimiento',8],['restablecimiento',6],['restablecimiento',4]]});
  }

  // Build weeks array from mesoDefs
  const weeks = [];
  mesoDefs.forEach((meso,mi)=>{
    meso.micro.forEach(([mtype,load,isComp])=>{
      weeks.push({weekNum:weeks.length+1,type:mtype,targetLoad:load,mesociclo:mi+1,mesoName:meso.name,etapa:meso.etapa,periodo:meso.periodo,competition:!!isComp,notes:''});
    });
  });

  const duration = weeks.length;
  const endDate = new Date(new Date(start).getTime()+duration*7*24*60*60*1000).toISOString().slice(0,10);
  const dayLabels=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const SES_BY_MICRO = {
    gradual:   ['Técnica','Aeróbica','Descanso','Técnica','Aeróbica','Descanso','Descanso'],
    corriente: ['Fuerza Máx.','Técnica','Potencia','Aeróbica','Técnica','Descanso','Descanso'],
    choque:    ['Fuerza Máx.','Potencia','Fuerza Máx.','Potencia','Fuerza Máx.','Técnica','Descanso'],
    aproximacion:['Fuerza Máx.','Técnica','Descanso','Potencia','Técnica','Activación','Descanso'],
    competicion:['Descanso','Acondicionamiento','Descanso','Acondicionamiento','Activación','Competición','Descanso'],
    restablecimiento:['Técnica','Aeróbica','Descanso','Técnica','Descanso','Descanso','Descanso']
  };

  DB.plans = DB.plans.filter(p=>p.athleteId!==athId);
  const mesociclos = mesoDefs.map((meso,mi)=>({
    num:mi+1, name:meso.name, type:meso.type, objective:meso.objective,
    periodo:meso.periodo, etapa:meso.etapa,
    microcycles: meso.micro.map(([mtype,load],wi)=>{
      const sTypes = SES_BY_MICRO[mtype]||SES_BY_MICRO.corriente;
      const isR = mtype==='restablecimiento'||mtype==='gradual';
      return {weekNum:wi+1, microType:mtype, targetLoad:load,
        sessions: dayLabels.map((day,di)=>({num:di+1,day,type:sTypes[di]||'Descanso',volume:sTypes[di]==='Descanso'?0:isR?50:mtype==='choque'?100:80,intensity:sTypes[di]==='Descanso'?0:isR?55:mtype==='choque'?85:70})),
        observations:''};
    })
  }));
  const evaluations = mesoDefs.map((_,i)=>({num:i+1,date:'',peso:0,grasa:0,masaMuscular:0,biceps:0,pecho:0,cintura:0,cadera:0,muslo:0,gemelo:0,observations:''}));
  const detailedSessions = {};
  mesociclos.forEach(m=>m.microcycles.forEach((_,wi)=>{
    detailedSessions[`${m.num}-${wi+1}`]=Array.from({length:7},(_,si)=>({num:si+1,exercises:Array.from({length:7},()=>({name:'',kg:'',s1:'',s2:'',s3:'',s4:'',rir:'',descanso:''})),observations:'',volume:''}));
  }));
  // Persistir personalización científica en el plan (útil para exportación,
  // auditoría y para que futuras recomendaciones usen el mismo perfil).
  const personalization = {
    category, level, sex, age,
    trainingDaysPerWeek: trainDays,
    competitions: competitionsList.map(c=>({...c})),
    autoPicked: autoPicked||null,
    generatedAt: new Date().toISOString()
  };

  // Retroalimentar el atleta con los datos de personalización (sin sobrescribir info crítica)
  const ath2 = getAthleteById(athId);
  if(ath2){
    if(level) ath2.level = (LEVEL_PROFILE[level]||{}).label || ath2.level;
    if(category && !ath2.sportCategory) ath2.sportCategory = SPORT_PERIODIZATION_MAP[category]?.label || ath2.sportCategory;
    const nonEmptyGoals = objectives.filter(Boolean);
    if(nonEmptyGoals.length) ath2.goals = nonEmptyGoals;
    const compDates = competitionsList.map(c=>c.date).filter(Boolean);
    if(compDates.length) ath2.competitionDates = compDates;
  }

  DB.plans.push({id:uid(),athleteId:athId,coachId:S.user.id,name,title:name,sport,macroType,startDate:start,endDate,
    schedule:{lunes:sport,martes:'Potencia',miercoles:'Aeróbica',jueves:sport,viernes:'Técnica',sabado:'—',domingo:'—'},
    objectives: objectives.length?objectives:[obj1,'',''],observations:'',weeks,mesociclos,evaluations,progress:[],detailedSessions,
    // Datos de personalización científica
    personalization, sportCategory:category, level, sex, age, trainingDaysPerWeek:trainDays, competitions:competitionsList});
  save(); closeModal();
  const label = autoPicked ? `AUTO→${autoPicked.toUpperCase()}` : macroType.toUpperCase();
  toast(`Macrociclo ${label} creado — ${duration} semanas, ${mesoDefs.length} mesociclos`);
  navigate('coach-macrociclo',{planAthlete:athId});
}

// ===== CREATE/EDIT MESOCICLO =====
function showCreateMesoModal(athId){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan){toast('No hay macrociclo. Créalo primero.','error');return;}
  const ath = getAthleteById(athId);
  const numExisting = plan.mesociclos?plan.mesociclos.length:0;
  const mType = plan.macroType||'tradicional';
  const tplKey = mType.includes('tradicional')||mType.includes('larga-t')?'tradicional':mType.includes('atr')||mType.includes('larga-a')?'atr':'bloques';
  const templates = MESO_TEMPLATES[tplKey]||MESO_TEMPLATES.tradicional;
  const defTpl = templates[Math.min(numExisting, templates.length-1)];
  const seqPreview = defTpl?defTpl.micro.map((m,i)=>`<span class="micro-tag ${m}" style="margin:1px;font-size:9px">${getMicroTypeCode(m)}(${defTpl.loads[i]})</span>`).join(' → '):'—';
  showModal(`
    <div class="modal-hdr"><div class="modal-title">Añadir Mesociclo — ${ath?ath.name:''}</div><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <div class="info-box mb-16"><i class="fas fa-info-circle"></i>Mesociclo <strong>${numExisting+1}</strong> · Periodización <strong>${mType.toUpperCase()}</strong>. El nuevo se añadirá al final del plan.</div>
    <div class="form-group"><label>Tipo de mesociclo</label>
      <select id="mesoType" onchange="updateMesoModalFromType(${athId})">
        ${templates.map(t=>`<option value="${t.value}">${t.label}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Nombre</label><input type="text" id="mesoName" value="${defTpl?defTpl.label.split('—')[0].trim():`Mes ${numExisting+1}`}" placeholder="Nombre del mesociclo"></div>
      <div class="form-group"><label>Nº Microciclos (semanas)</label><input type="number" id="mesoWeeks" value="${defTpl?defTpl.weeks:4}" min="1" max="8"></div>
    </div>
    <div class="form-group"><label>Secuencia de microciclos</label>
      <div id="mesoMicroSeq" style="padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:3px;font-family:var(--mono);font-size:12px;min-height:32px">${seqPreview}</div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Período</label><input type="text" id="mesoPeriodo" value="${defTpl?defTpl.periodo:'Preparatorio'}" placeholder="Período"></div>
      <div class="form-group"><label>Etapa</label><input type="text" id="mesoEtapa" value="${defTpl?defTpl.etapa:'Etapa Preparación General'}" placeholder="Etapa"></div>
    </div>
    <div class="form-group"><label>Objetivo</label><input type="text" id="mesoObj" value="${defTpl?defTpl.obj:''}" placeholder="Objetivo del mesociclo"></div>
    <button class="btn btn-primary btn-full mt-16" onclick="addMesociclo(${athId})"><i class="fas fa-plus"></i> Crear Mesociclo</button>
  `, 560);
  window._mesoTplKey = tplKey;
}
function updateMesoModalFromType(athId){
  const typeVal = document.getElementById('mesoType').value;
  const templates = MESO_TEMPLATES[window._mesoTplKey]||MESO_TEMPLATES.tradicional;
  const tpl = templates.find(t=>t.value===typeVal);
  if(!tpl) return;
  document.getElementById('mesoName').value = tpl.label.split('—')[0].trim();
  document.getElementById('mesoWeeks').value = tpl.weeks;
  document.getElementById('mesoObj').value = tpl.obj;
  document.getElementById('mesoPeriodo').value = tpl.periodo;
  document.getElementById('mesoEtapa').value = tpl.etapa;
  const seq = document.getElementById('mesoMicroSeq');
  if(seq) seq.innerHTML = tpl.micro.map((m,i)=>`<span class="micro-tag ${m}" style="margin:1px;font-size:9px">${getMicroTypeCode(m)}(${tpl.loads[i]})</span>`).join(' → ');
}

function addMesociclo(athId){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  if(!plan.mesociclos) plan.mesociclos = [];
  const mesoType = document.getElementById('mesoType').value;
  const name = document.getElementById('mesoName').value.trim()||`Mes ${plan.mesociclos.length+1}`;
  const numWeeks = Math.min(8,Math.max(1,parseInt(document.getElementById('mesoWeeks').value)||4));
  const obj = document.getElementById('mesoObj').value.trim();
  const periodo = document.getElementById('mesoPeriodo').value.trim();
  const etapa = document.getElementById('mesoEtapa').value.trim();
  const templates = MESO_TEMPLATES[window._mesoTplKey]||MESO_TEMPLATES.tradicional;
  const tpl = templates.find(t=>t.value===mesoType);

  const dayLabels=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const SES_BY_MICRO={
    gradual:['Técnica','Aeróbica','Descanso','Técnica','Aeróbica','Descanso','Descanso'],
    corriente:['Fuerza Máx.','Técnica','Potencia','Aeróbica','Técnica','Descanso','Descanso'],
    choque:['Fuerza Máx.','Potencia','Fuerza Máx.','Potencia','Fuerza Máx.','Técnica','Descanso'],
    aproximacion:['Fuerza Máx.','Técnica','Descanso','Potencia','Técnica','Activación','Descanso'],
    competicion:['Descanso','Acondicionamiento','Descanso','Acondicionamiento','Activación','Competición','Descanso'],
    restablecimiento:['Técnica','Aeróbica','Descanso','Técnica','Descanso','Descanso','Descanso']
  };

  const microcycles = Array.from({length:numWeeks},(_,wi)=>{
    const mtype = tpl?(tpl.micro[wi]||tpl.micro[tpl.micro.length-1]):'corriente';
    const load = tpl?(tpl.loads[wi]||tpl.loads[tpl.loads.length-1]):getMicroTypeLoad(mtype);
    const sTypes = SES_BY_MICRO[mtype]||SES_BY_MICRO.corriente;
    const isR = mtype==='restablecimiento'||mtype==='gradual';
    return {weekNum:wi+1, microType:mtype, targetLoad:load,
      sessions: dayLabels.map((day,di)=>({num:di+1,day,type:sTypes[di]||'Descanso',
        volume:sTypes[di]==='Descanso'?0:isR?50:mtype==='choque'?100:80,
        intensity:sTypes[di]==='Descanso'?0:isR?55:mtype==='choque'?85:70})),
      observations:''};
  });

  plan.mesociclos.push({num:plan.mesociclos.length+1,name,type:mesoType,objective:obj,periodo,etapa,microcycles});
  if(!plan.evaluations) plan.evaluations=[];
  plan.evaluations.push({num:plan.evaluations.length+1,date:'',peso:0,grasa:0,masaMuscular:0,biceps:0,pecho:0,cintura:0,cadera:0,muslo:0,gemelo:0,observations:''});
  save(); closeModal(); toast(`Mesociclo "${name}" creado — ${numWeeks} microciclos`);
  navigate('coach-mesociclo',{planAthlete:athId,mesoNum:plan.mesociclos.length});
}

// ===== DELETE MESOCICLO =====
function deleteMesociclo(athId, mesoIdx){
  if(!confirm('¿Eliminar este mesociclo completo? Esta acción no se puede deshacer.')) return;
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  plan.mesociclos.splice(mesoIdx,1);
  // Renumber
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save(); toast('Mesociclo eliminado'); navigate('coach-mesociclo',{planAthlete:athId});
}

// ===== VACIAR MACROCICLO (conserva estructura, borra datos) =====
function confirmDeleteMacrociclo(athId){
  const ath = getAthleteById(athId);
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!ath){ toast('No hay macrociclo para vaciar','error'); return; }
  const nMeso = (plan.mesociclos||[]).length;
  const nWeeks = (plan.weeks||[]).length;
  showModal(`
    <div class="modal-hdr"><div class="modal-title">Vaciar Macrociclo</div><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
    <div style="text-align:center;padding:16px 0">
      <i class="fas fa-eraser" style="font-size:40px;color:var(--warn);margin-bottom:16px"></i>
      <p style="font-size:15px;margin-bottom:8px">¿Vaciar el macrociclo de <strong>${ath.name}</strong>?</p>
      <p style="font-size:12px;color:var(--muted);line-height:1.5">Se borrarán <strong>${nWeeks} semanas</strong>, <strong>${nMeso} mesociclos</strong>, sesiones detalladas y evaluaciones. El atleta seguirá apareciendo en el selector del macrociclo para que puedas construirlo manualmente desde cero con los botones <em>Añadir Semanas</em> y <em>Mesociclo</em>.<br><span style="color:var(--warn)">Los registros de sesiones, CMJ y wellness no se verán afectados.</span><br><span style="color:var(--muted);font-size:11px">Esta acción no se puede deshacer.</span></p>
    </div>
    <div class="flex gap-8" style="justify-content:center">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" style="background:var(--warn);color:#fff" onclick="deleteMacrociclo(${athId})"><i class="fas fa-eraser"></i> Vaciar macrociclo</button>
    </div>
  `);
}
function deleteMacrociclo(athId){
  const ath = getAthleteById(athId);
  const plan = DB.plans.find(p => p.athleteId === athId);
  if(!plan){ toast('No hay macrociclo','error'); return; }

  // Reiniciar plan a estado vacío — mantener la entrada para que el atleta siga apareciendo
  // en el selector, pero sin semanas/mesociclos/evaluaciones acumuladas.
  plan.weeks = [];
  plan.mesociclos = [];
  plan.evaluations = [];
  plan.detailedSessions = {};

  // Horario semanal: vaciar
  plan.schedule = {lunes:'',martes:'',miercoles:'',jueves:'',viernes:'',sabado:'',domingo:''};

  // Objetivos y observaciones vacíos (conservar title, sport, macroType)
  plan.objectives = ['','',''];
  plan.observations = '';

  // Reiniciar fechas a hoy — al añadir semanas, el endDate se calculará de nuevo
  const today = new Date().toISOString().slice(0,10);
  plan.startDate = today;
  plan.endDate = today;

  save();
  closeModal();
  toast(`Macrociclo de ${ath?ath.name:'atleta'} vaciado — usa "Añadir Semanas" para empezar de cero`);
  navigate('coach-macrociclo',{planAthlete:athId});
}

function toggleExportDropdown(ev, athId){
  if(ev){ ev.stopPropagation(); }
  const menu = document.getElementById('exportDropdown-'+athId);
  if(!menu) return;
  // Cerrar cualquier otro menú abierto
  document.querySelectorAll('.dd-menu.open').forEach(m => { if(m!==menu) m.classList.remove('open'); });
  const wasOpen = menu.classList.contains('open');
  menu.classList.toggle('open');
  if(!wasOpen){
    // Handler para cerrar al clicar fuera
    setTimeout(()=>{
      const closer = (e)=>{
        if(!menu.contains(e.target)){
          menu.classList.remove('open');
          document.removeEventListener('click', closer);
        }
      };
      document.addEventListener('click', closer);
    }, 0);
  }
}
function closeExportDropdown(){
  document.querySelectorAll('.dd-menu.open').forEach(m => m.classList.remove('open'));
}

// Retrocompatibilidad
function showExportExcelModal(athId){ return showExportModal(athId, 'excel'); }

async function exportMacrocicloToExcel(athId){
  const ath = getAthleteById(athId);
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!ath){ toast('No se pudo exportar','error'); return; }
  if(typeof ExcelJS === 'undefined'){ toast('Librería ExcelJS no cargada','error'); return; }
  const opts = Array.from(document.querySelectorAll('.exportOpt:checked')).map(cb=>cb.value);
  if(!opts.length){ toast('Selecciona al menos una hoja','error'); return; }

  // ===== PALETA DE COLORES (ARGB) =====
  const COLORS = {
    primary:     'FF8B7340',  // marrón primary
    primaryL:    'FFEDE1C9',  // marrón suave para banda
    headerFg:    'FFFFFFFF',
    sectionBg:   'FFEDE7DC',  // beige secciones resumen
    sectionFg:   'FF5C4A2A',
    altRow:      'FFFAF7F1',  // zebra striping
    border:      'FFD9D2BF',
    // Micro types — colores fuertes para texto, tintes suaves para fondo
    microType: {
      gradual:          { dark:'FF2D7A5C', light:'FFDBEDE2' },
      corriente:        { dark:'FF5B4F8A', light:'FFE2DEEC' },
      choque:           { dark:'FFA04040', light:'FFF0D6D6' },
      restablecimiento: { dark:'FF4A7A5A', light:'FFDCEAE0' },
      competicion:      { dark:'FF9E8035', light:'FFF0E5C4' },
      aproximacion:     { dark:'FFC47820', light:'FFF4DDBE' },
      control:          { dark:'FF7B6EAA', light:'FFE1DDEC' }
    },
    periodo: {
      'Preparatorio': { dark:'FF2D7A5C', light:'FFDBEDE2' },
      'Competitivo':  { dark:'FF9E8035', light:'FFF0E5C4' },
      'Transitorio':  { dark:'FF7B6EAA', light:'FFE1DDEC' }
    },
    danger:  'FFA04040',
    success: 'FF2D7A5C'
  };

  const thinBorder = { style:'thin', color:{argb: COLORS.border} };
  const borderAll = { top:thinBorder, left:thinBorder, bottom:thinBorder, right:thinBorder };

  const wb = new ExcelJS.Workbook();
  wb.creator = 'FatigaMonitor Pro';
  wb.lastModifiedBy = 'FatigaMonitor Pro';
  wb.created = new Date();
  wb.modified = new Date();

  // === Helpers ===
  function styleHeaderRow(row){
    row.eachCell(cell => {
      cell.font = { bold:true, color:{argb:COLORS.headerFg}, size:11, name:'Calibri' };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.primary} };
      cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      cell.border = borderAll;
    });
    row.height = 22;
  }
  function styleBody(row, opts={}){
    row.eachCell(cell => {
      if(!cell.font) cell.font = { size:10, name:'Calibri' };
      cell.alignment = { vertical:'middle', horizontal: cell.col === 1 ? 'center' : 'left', wrapText:true };
      cell.border = borderAll;
    });
  }
  function zebraFill(row, idx){
    if(idx % 2 === 0){
      row.eachCell(cell => {
        if(!cell.fill || cell.fill.pattern !== 'solid' || !cell.fill.fgColor){
          cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.altRow} };
        }
      });
    }
  }

  // ======================================================================
  // HOJA 1: RESUMEN
  // ======================================================================
  if(opts.includes('resumen')){
    const ws = wb.addWorksheet('Resumen', {
      views: [{ state:'frozen', ySplit:1, showGridLines:false }],
      properties: { defaultColWidth: 20 }
    });
    ws.columns = [
      { key:'label', width:30 },
      { key:'value', width:55 }
    ];

    // Banner de título
    ws.mergeCells('A1:B1');
    const titleCell = ws.getCell('A1');
    titleCell.value = 'FATIGAMONITOR PRO — RESUMEN DEL MACROCICLO';
    titleCell.font = { bold:true, size:16, color:{argb:COLORS.headerFg}, name:'Calibri' };
    titleCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.primary} };
    titleCell.alignment = { vertical:'middle', horizontal:'center' };
    titleCell.border = borderAll;
    ws.getRow(1).height = 30;

    const coach = DB.users.find(u=>u.id===ath.coachId);
    const addRow = (label, value) => {
      const r = ws.addRow([label, value]);
      r.getCell(1).font = { bold:true, size:10, color:{argb:COLORS.sectionFg}, name:'Calibri' };
      r.getCell(1).alignment = { vertical:'middle', horizontal:'left', wrapText:true };
      r.getCell(1).border = borderAll;
      r.getCell(2).font = { size:10, name:'Calibri' };
      r.getCell(2).alignment = { vertical:'middle', horizontal:'left', wrapText:true };
      r.getCell(2).border = borderAll;
      return r;
    };
    const addSection = (title) => {
      ws.addRow([]);
      ws.mergeCells(`A${ws.rowCount+1}:B${ws.rowCount+1}`);
      const r = ws.addRow([title]);
      const c = r.getCell(1);
      c.font = { bold:true, size:12, color:{argb:COLORS.primary}, name:'Calibri' };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.sectionBg} };
      c.alignment = { vertical:'middle', horizontal:'left', indent:1 };
      c.border = borderAll;
      r.height = 22;
    };

    addRow('Generado', new Date().toLocaleString('es-ES'));
    addSection('ATLETA');
    addRow('Nombre', ath.name);
    addRow('Edad', ath.age||'—');
    addRow('Peso (kg)', ath.weight||'—');
    addRow('Altura (cm)', ath.height||'—');
    addRow('CMJ baseline (cm)', ath.cmjBase||'—');
    addRow('Deporte', ath.sport||'—');
    addRow('Categoría deportiva', ath.sportCategory||plan.sportCategory||'—');
    addRow('Nivel', ath.level||plan.level||'—');
    addRow('Objetivos', (ath.goals||plan.goals||[]).join(' · ')||'—');
    addRow('Tipo de competición', ath.competitionType||plan.competitionType||'—');
    addRow('Fechas de competición', (ath.competitionDates||plan.competitionDates||[]).join(' · ')||'—');
    addRow('Entrenador', coach?coach.name:'—');

    addSection('MACROCICLO');
    addRow('Título', plan.title||plan.name||'—');
    const typeLabels = {tradicional:'Tradicional', atr:'ATR','tradicional-doble':'Doble','bloques':'Bloques','larga-tradicional':'Larga Tradicional','larga-atr':'Larga ATR'};
    addRow('Tipo de periodización', typeLabels[plan.macroType]||plan.macroType||'—');
    addRow('Fecha inicio', plan.startDate||'—');
    addRow('Fecha fin', plan.endDate||'—');
    addRow('Número de semanas', (plan.weeks||[]).length);
    addRow('Número de mesociclos', (plan.mesociclos||[]).length);
    addRow('Observaciones del plan', plan.observations||'—');

    addSection('OBJETIVOS DEL PLAN');
    (plan.objectives||[]).filter(Boolean).forEach((o,i)=>addRow(`${i+1}.`, o));

    addSection('HORARIO SEMANAL');
    addRow('Lunes',     plan.schedule&&plan.schedule.lunes||'—');
    addRow('Martes',    plan.schedule&&plan.schedule.martes||'—');
    addRow('Miércoles', plan.schedule&&plan.schedule.miercoles||'—');
    addRow('Jueves',    plan.schedule&&plan.schedule.jueves||'—');
    addRow('Viernes',   plan.schedule&&plan.schedule.viernes||'—');
    addRow('Sábado',    plan.schedule&&plan.schedule.sabado||'—');
    addRow('Domingo',   plan.schedule&&plan.schedule.domingo||'—');
  }

  // ======================================================================
  // HOJA 2: MACROCICLO — 52 SEMANAS
  // ======================================================================
  if(opts.includes('macrociclo') && plan.weeks && plan.weeks.length){
    const ws = wb.addWorksheet('Macrociclo', {
      views: [{ state:'frozen', ySplit:1, showGridLines:false }]
    });
    const headers = ['Sem','Fecha inicio','Mesociclo','Etapa','Período','Tipo microciclo','Carga','Competición','Notas'];
    const widths = [6, 14, 11, 26, 15, 17, 9, 13, 35];
    ws.columns = headers.map((h,i)=>({ header:h, key:`c${i}`, width:widths[i] }));

    // Formato de la fila header
    styleHeaderRow(ws.getRow(1));

    const startT = new Date(plan.startDate).getTime();
    plan.weeks.forEach((w,i) => {
      const wStart = new Date(startT + i*7*24*3600*1000).toISOString().slice(0,10);
      const row = ws.addRow([
        w.weekNum, wStart, w.mesociclo||'', w.etapa||'', w.periodo||'',
        w.type||'', w.targetLoad||0, w.competition?'Sí':'', w.notes||''
      ]);
      // Estilos por celda
      const typeColors = COLORS.microType[w.type];
      const periodoColors = COLORS.periodo[w.periodo];

      row.eachCell((cell, colNum) => {
        cell.font = { size:10, name:'Calibri' };
        cell.alignment = { vertical:'middle', horizontal: (colNum<=3||colNum===7||colNum===8)?'center':'left', wrapText:true };
        cell.border = borderAll;
      });

      // Columna 1 (Sem): bold + fondo suave del tipo
      if(typeColors){
        row.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb:typeColors.light} };
        row.getCell(1).font = { bold:true, size:11, color:{argb:typeColors.dark}, name:'Calibri' };
      } else {
        row.getCell(1).font = { bold:true, size:11, name:'Calibri' };
      }

      // Columna 5 (Período): color de fondo si lo hay
      if(periodoColors){
        row.getCell(5).fill = { type:'pattern', pattern:'solid', fgColor:{argb:periodoColors.light} };
        row.getCell(5).font = { size:10, color:{argb:periodoColors.dark}, bold:true, name:'Calibri' };
      }

      // Columna 6 (Tipo microciclo): fondo intenso del tipo
      if(typeColors){
        row.getCell(6).fill = { type:'pattern', pattern:'solid', fgColor:{argb:typeColors.dark} };
        row.getCell(6).font = { bold:true, size:10, color:{argb:COLORS.headerFg}, name:'Calibri' };
        row.getCell(6).alignment = { vertical:'middle', horizontal:'center' };
      }

      // Columna 7 (Carga): formato numérico + bold
      row.getCell(7).numFmt = '0';
      row.getCell(7).font = { bold:true, size:11, name:'Calibri' };
      row.getCell(7).alignment = { vertical:'middle', horizontal:'center' };

      // Columna 8 (Competición): si Sí → verde con check
      if(w.competition){
        row.getCell(8).fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.success} };
        row.getCell(8).font = { bold:true, size:11, color:{argb:COLORS.headerFg}, name:'Calibri' };
      }
    });

    // Definir tabla real para que Excel la reconozca como tabla (filtros, estilos)
    const lastRow = ws.rowCount;
    ws.addTable({
      name: 'TablaMacrociclo',
      ref: 'A1',
      headerRow: true,
      totalsRow: false,
      style: { theme:'TableStyleLight15', showRowStripes:false },
      columns: headers.map(h => ({ name:h, filterButton:true })),
      rows: Array.from({length:lastRow-1}, (_,i)=>{
        const r = ws.getRow(i+2);
        return r.values.slice(1, headers.length+1);
      })
    });
  }

  // ======================================================================
  // HOJA 3: MESOCICLOS
  // ======================================================================
  if(opts.includes('mesociclos') && plan.mesociclos && plan.mesociclos.length){
    const ws = wb.addWorksheet('Mesociclos', {
      views: [{ state:'frozen', ySplit:1, showGridLines:false }]
    });
    const headers = ['Nº','Nombre','Microciclos','Tipos dominantes','Carga media','Sesiones/sem','Observaciones'];
    const widths = [6, 18, 13, 32, 13, 14, 40];
    ws.columns = headers.map((h,i)=>({ header:h, key:`c${i}`, width:widths[i] }));
    styleHeaderRow(ws.getRow(1));

    plan.mesociclos.forEach((m, idx) => {
      const types = [...new Set((m.microcycles||[]).map((mc,wi)=>{
        const gw = ((m.num-1)*4) + wi;
        return plan.weeks && plan.weeks[gw] ? plan.weeks[gw].type : '';
      }).filter(Boolean))];
      const loads = (m.microcycles||[]).map((_,wi)=>{
        const gw = ((m.num-1)*4)+wi;
        return plan.weeks && plan.weeks[gw] ? (plan.weeks[gw].targetLoad||0) : 0;
      });
      const avgLoad = loads.length ? +(loads.reduce((s,x)=>s+x,0)/loads.length).toFixed(1) : 0;
      const sesPerWeek = ((m.microcycles||[])[0]?.sessions||[]).filter(s=>s.type&&s.type!=='Descanso').length;
      const obs = (m.microcycles||[]).map(mc=>mc.observations).filter(Boolean).join(' | ')||'';

      const row = ws.addRow([m.num, m.name||'', (m.microcycles||[]).length, types.join(' · '), avgLoad, sesPerWeek, obs]);
      row.eachCell((cell, colNum) => {
        cell.font = { size:10, name:'Calibri' };
        cell.alignment = { vertical:'middle', horizontal: (colNum===1||colNum===3||colNum===5||colNum===6)?'center':'left', wrapText:true };
        cell.border = borderAll;
      });
      // Zebra fondo
      if(idx % 2 === 1){
        row.eachCell(cell => { cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.altRow} }; });
      }
      // Columna 1 (Nº): bold, fondo primary suave
      row.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.primaryL} };
      row.getCell(1).font = { bold:true, size:11, color:{argb:COLORS.primary}, name:'Calibri' };
      row.getCell(2).font = { bold:true, size:10, name:'Calibri' };
      row.getCell(5).numFmt = '0.0';
      row.getCell(5).font = { bold:true, size:10, name:'Calibri' };
    });
  }

  // ======================================================================
  // HOJA 4: MICROCICLOS Y SESIONES (~336 filas)
  // ======================================================================
  if(opts.includes('microciclos') && plan.mesociclos && plan.mesociclos.length){
    const ws = wb.addWorksheet('Microciclos', {
      views: [{ state:'frozen', ySplit:1, showGridLines:false }]
    });
    const headers = ['Mesociclo','Mes','Microciclo','Semana global','Sesión','Día','Tipo','Volumen','Intensidad','Observación'];
    const widths = [10, 14, 10, 13, 8, 7, 16, 10, 11, 40];
    ws.columns = headers.map((h,i)=>({ header:h, key:`c${i}`, width:widths[i] }));
    styleHeaderRow(ws.getRow(1));

    plan.mesociclos.forEach(m => {
      (m.microcycles||[]).forEach((mc, wi) => {
        const globalWeek = ((m.num-1)*4) + wi + 1;
        const weekInfo = plan.weeks && plan.weeks[globalWeek-1];
        const microType = weekInfo ? weekInfo.type : '';
        const microColors = COLORS.microType[microType];

        (mc.sessions||[]).forEach(s => {
          const isRest = s.type === 'Descanso' || !s.type;
          const row = ws.addRow([
            m.num, m.name||'', mc.weekNum||(wi+1), globalWeek,
            s.num, s.day||'', s.type||'',
            s.volume||0, s.intensity||0, mc.observations||''
          ]);
          row.eachCell((cell, colNum) => {
            cell.font = { size:10, name:'Calibri' };
            cell.alignment = { vertical:'middle', horizontal: (colNum<=6||colNum===8||colNum===9)?'center':'left', wrapText:true };
            cell.border = borderAll;
          });
          // Fondo muy suave por tipo de microciclo
          if(microColors){
            [1,2,3,4].forEach(c => { row.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:microColors.light} }; });
          }
          // Columna Tipo sesión
          if(isRest){
            row.getCell(7).font = { italic:true, color:{argb:'FF8A7E6B'}, size:10, name:'Calibri' };
            row.getCell(7).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF0EDE3'} };
          } else {
            row.getCell(7).font = { bold:true, size:10, name:'Calibri' };
          }
          row.getCell(8).numFmt = '0';
          row.getCell(9).numFmt = '0';
          row.getCell(4).font = { bold:true, size:10, name:'Calibri' };
        });
      });
    });
  }

  // ======================================================================
  // HOJA 5: SESIONES DETALLADAS
  // ======================================================================
  if(opts.includes('detalladas') && plan.detailedSessions){
    const dayLabels = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const rowsData = [];
    Object.keys(plan.detailedSessions).sort((a,b)=>{
      const [am,aw]=a.split('-').map(Number), [bm,bw]=b.split('-').map(Number);
      return am!==bm ? am-bm : aw-bw;
    }).forEach(key => {
      const [mNum, wNum] = key.split('-').map(Number);
      (plan.detailedSessions[key]||[]).forEach(ses => {
        const dayLabel = dayLabels[(ses.num||1)-1] || '';
        (ses.exercises||[]).filter(ex=>ex.name).forEach(ex => {
          rowsData.push([mNum, wNum, ses.num, dayLabel, ex.name||'', ex.kg||'', ex.s1||'', ex.s2||'', ex.s3||'', ex.s4||'', ex.rir||'', ex.descanso||'', ses.volume||'', ses.observations||'']);
        });
      });
    });
    if(rowsData.length){
      const ws = wb.addWorksheet('Sesiones detalladas', {
        views: [{ state:'frozen', ySplit:1, showGridLines:false }]
      });
      const headers = ['Mes','Micro','Sesión','Día','Ejercicio','Kg','Serie 1','Serie 2','Serie 3','Serie 4','RIR','Descanso','Vol. sesión','Observación'];
      const widths = [6, 8, 8, 6, 28, 8, 9, 9, 9, 9, 7, 11, 12, 32];
      ws.columns = headers.map((h,i)=>({ header:h, key:`c${i}`, width:widths[i] }));
      styleHeaderRow(ws.getRow(1));

      rowsData.forEach((rd, idx) => {
        const row = ws.addRow(rd);
        row.eachCell((cell, colNum) => {
          cell.font = { size:10, name:'Calibri' };
          cell.alignment = { vertical:'middle', horizontal: colNum===5?'left':'center', wrapText:true };
          cell.border = borderAll;
        });
        if(idx % 2 === 1){
          row.eachCell(cell => { cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.altRow} }; });
        }
        row.getCell(5).font = { bold:true, size:10, name:'Calibri' };
      });
    }
  }

  // ======================================================================
  // HOJA 6: EVALUACIONES
  // ======================================================================
  if(opts.includes('evaluaciones') && plan.evaluations && plan.evaluations.length){
    const ws = wb.addWorksheet('Evaluaciones', {
      views: [{ state:'frozen', ySplit:1, showGridLines:false }]
    });
    const headers = ['Nº','Fecha','Peso (kg)','Grasa (%)','Masa muscular (kg)','Bíceps (cm)','Pecho (cm)','Cintura (cm)','Cadera (cm)','Muslo (cm)','Gemelo (cm)','Observación'];
    const widths = [5, 13, 11, 10, 18, 11, 11, 11, 11, 11, 11, 35];
    ws.columns = headers.map((h,i)=>({ header:h, key:`c${i}`, width:widths[i] }));
    styleHeaderRow(ws.getRow(1));

    plan.evaluations.forEach((e, idx) => {
      const row = ws.addRow([
        e.num||'', e.date||'', e.peso||0, e.grasa||0, e.masaMuscular||0,
        e.biceps||0, e.pecho||0, e.cintura||0, e.cadera||0, e.muslo||0, e.gemelo||0,
        e.observations||''
      ]);
      row.eachCell((cell, colNum) => {
        cell.font = { size:10, name:'Calibri' };
        cell.alignment = { vertical:'middle', horizontal: colNum===12?'left':'center', wrapText:true };
        cell.border = borderAll;
      });
      if(idx % 2 === 1){
        row.eachCell(cell => { cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.altRow} }; });
      }
      // Formato numérico para medidas
      [3,4,5,6,7,8,9,10,11].forEach(c => { row.getCell(c).numFmt = '0.0'; });
      row.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb:COLORS.primaryL} };
      row.getCell(1).font = { bold:true, size:11, color:{argb:COLORS.primary}, name:'Calibri' };
    });
  }

  if(wb.worksheets.length === 0){ toast('No hay datos seleccionados para exportar','error'); return; }

  const fname = `Macrociclo_${(ath.name||'atleta').replace(/[^a-zA-Z0-9]+/g,'_')}_${TODAY}.xlsx`;
  try {
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    closeModal();
    toast(`Exportado: ${fname} (${wb.worksheets.length} hoja${wb.worksheets.length!==1?'s':''})`);
  } catch(e){
    console.error(e);
    toast('Error al generar Excel: '+e.message,'error');
  }
}

// ===== EXPORTAR MACROCICLO A PDF =====
function escHtml(s){
  if(s===null||s===undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function exportMacrocicloToPdf(athId){
  const ath = getAthleteById(athId);
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!ath){ toast('No se pudo exportar','error'); return; }
  const opts = Array.from(document.querySelectorAll('.exportOpt:checked')).map(cb=>cb.value);
  if(!opts.length){ toast('Selecciona al menos una sección','error'); return; }

  try{
    const html = buildPdfHtml(ath, plan, opts);
    const w = window.open('', '_blank', 'width=980,height=800');
    if(!w){ toast('El navegador bloqueó la ventana emergente. Permite popups e inténtalo de nuevo.','error'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    // Esperar a que cargue fuentes / layout antes de imprimir
    const tryPrint = () => {
      try {
        w.focus();
        w.print();
      } catch(err){ console.error('print error', err); }
    };
    if(w.document.readyState === 'complete'){
      setTimeout(tryPrint, 300);
    } else {
      w.addEventListener('load', () => setTimeout(tryPrint, 300));
    }
    closeModal();
    toast(`PDF preparado — elige "Guardar como PDF" en el diálogo`);
  } catch(e){
    console.error(e);
    toast('Error al generar PDF: '+e.message,'error');
  }
}

function buildPdfHtml(ath, plan, opts){
  const MICRO_LBL = {
    gradual:'Gradual', corriente:'Corriente', choque:'Choque',
    restablecimiento:'Restablecimiento', competicion:'Competición',
    aproximacion:'Aproximación', control:'Control'
  };
  const MICRO_COLOR = {
    gradual:'#2D7A5C', corriente:'#5B4F8A', choque:'#A04040',
    restablecimiento:'#4A7A5A', competicion:'#9E8035',
    aproximacion:'#C47820', control:'#7B6EAA'

    'Preparatorio':'#2D7A5C', 'Competitivo':'#9E8035', 'Transitorio':'#7B6EAA'

  const today = new Date().toLocaleDateString('es-ES', {year:'numeric',month:'long',day:'numeric'});
  let body = '';

  // ====== RESUMEN ======
  if(opts.includes('resumen')){
    const sport = ath.sport || '—';

    const comp = plan.competitionDate ? new Date(plan.competitionDate).toLocaleDateString('es-ES') : '—';
    const start = plan.startDate ? new Date(plan.startDate).toLocaleDateString('es-ES') : '—';
    const nWeeks = (plan.weeks||[]).length;
    const nMeso = (plan.mesociclos||[]).length;
    const goal = plan.mainGoal || plan.goal || '—';
    const obs = plan.notes || plan.observations || '';
    body += `
      <section class="pdf-sect pdf-avoid-break">
        <h2>Resumen</h2>
        <div class="pdf-grid2">
          <div class="pdf-kv"><span class="k">Atleta</span><span class="v">${escHtml(ath.name||'—')}</span></div>
          <div class="pdf-kv"><span class="k">Edad · Peso</span><span class="v">${escHtml(ath.age||'—')} años · ${escHtml(ath.weight||'—')} kg</span></div>
          <div class="pdf-kv"><span class="k">Deporte</span><span class="v">${escHtml(sport)}</span></div>
          <div class="pdf-kv"><span class="k">Macrociclo</span><span class="v">${escHtml(plan.title||plan.name||'—')}</span></div>
          <div class="pdf-kv"><span class="k">Tipo de periodización</span><span class="v">${escHtml(macroType)}</span></div>
          <div class="pdf-kv"><span class="k">Fecha de inicio</span><span class="v">${escHtml(start)}</span></div>
          <div class="pdf-kv"><span class="k">Competición principal</span><span class="v">${escHtml(comp)}</span></div>
          <div class="pdf-kv"><span class="k">Duración</span><span class="v">${nWeeks} semanas · ${nMeso} mesociclos</span></div>
          <div class="pdf-kv pdf-col2"><span class="k">Objetivo principal</span><span class="v">${escHtml(goal)}</span></div>
        </div>
        ${obs ? `<div class="pdf-note"><strong>Observaciones:</strong> ${escHtml(obs)}</div>` : ''}
      </section>`;
  }

  // ====== MACROCICLO (52 semanas) ======
  if(opts.includes('macrociclo') && (plan.weeks||[]).length){
    const rows = plan.weeks.map((w,i)=>{
      const tipoColor = MICRO_COLOR[w.tipo] || '#888';
      const perColor = PERIODO_COLOR[w.periodo] || '#555';
      const tipoLbl = w.tipo ? (MICRO_LBL[w.tipo] || w.tipo) : '—';
      return `<tr>
        <td class="c">${i+1}</td>
        <td class="c">${escHtml(w.date||'—')}</td>
        <td style="color:${tipoColor};font-weight:600">${escHtml(tipoLbl)}</td>
        <td class="c">${w.volumen!==undefined&&w.volumen!==''?escHtml(w.volumen):'—'}</td>
        <td class="c">${w.intensidad!==undefined&&w.intensidad!==''?escHtml(w.intensidad):'—'}</td>
        <td>${escHtml(w.mesociclo||'—')}</td>
        <td style="color:${perColor};font-weight:600">${escHtml(w.periodo||'—')}</td>
        <td>${escHtml(w.etapa||'—')}</td>
        <td>${escHtml(w.competicion||'')}</td>

    }).join('');
    body += `

            <th>#</th><th>Fecha</th><th>Tipo</th><th>Vol.</th><th>Int.</th>
            <th>Mesociclo</th><th>Periodo</th><th>Etapa</th><th>Comp.</th>

          <tbody>${rows}</tbody>

  }

  // ====== MESOCICLOS ======
  if(opts.includes('mesociclos') && (plan.mesociclos||[]).length){
    const rows = plan.mesociclos.map((m,i)=>{
      const micros = (m.microcycles||[]).length;
      const typeCounts = {};
      (m.microcycles||[]).forEach(mc => { typeCounts[mc.type] = (typeCounts[mc.type]||0)+1; });
      const dominant = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0];
      const domLbl = dominant ? (MICRO_LBL[dominant[0]] || dominant[0]) : '—';
      const domColor = dominant ? (MICRO_COLOR[dominant[0]] || '#555') : '#555';
      const avgVol = (m.microcycles||[]).reduce((s,mc)=>s+(+mc.volume||0),0) / (micros||1);

  // ====== MICROCICLOS Y SESIONES ======

          } else {

        <table class="pdf-table pdf-zebra">

          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
  }

  // ====== SESIONES DETALLADAS ======
  if(opts.includes('detalladas') && plan.detailedSessions){
    const keys = Object.keys(plan.detailedSessions).sort();
    let blocks = '';
    keys.forEach(k => {
      const arr = plan.detailedSessions[k] || [];
      arr.forEach((ses, idx) => {
        const exs = (ses.exercises||[]).filter(e=>e.name);
        if(!exs.length) return;
        const rows = exs.map((e,ei)=>`<tr>
          <td class="c">${ei+1}</td>

        blocks += `

              <tbody>${rows}</tbody>

          </div>`;
      });
    });
    if(blocks){
      body += `<section class="pdf-sect pdf-page-break"><h2>Sesiones detalladas</h2>${blocks}</section>`;
    }
  }

  // ====== EVALUACIONES ======
  if(opts.includes('evaluaciones') && (plan.evaluations||[]).length){
    const evs = plan.evaluations.filter(e => e.date || e.peso);
    if(evs.length){
      const rows = evs.map(e => `<tr>
        <td>${escHtml(e.date||'—')}</td>

      body += `

              <th>Cintura</th><th>Cadera</th><th>Notas</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </section>`;
    }
  }

  const title = `Macrociclo — ${ath.name||'Atleta'}`;
  return `<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>${escHtml(title)}</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Helvetica Neue',Arial,sans-serif;color:#222;background:#fff;font-size:11px;line-height:1.4;padding:24px}
  h1{margin:0 0 4px;font-size:22px;color:#8B7340;letter-spacing:.5px}
  h2{margin:18px 0 8px;font-size:15px;color:#5C4A2A;border-bottom:2px solid #8B7340;padding-bottom:4px}
  .pdf-header{border-bottom:3px solid #8B7340;padding-bottom:10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}
  .pdf-header .meta{font-size:10px;color:#666;text-align:right}
  .pdf-sect{margin-bottom:16px}
  .pdf-grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:6px}
  .pdf-kv{display:flex;justify-content:space-between;padding:5px 8px;background:#faf7f1;border-left:3px solid #8B7340;border-radius:0 3px 3px 0}
  .pdf-kv .k{color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .pdf-kv .v{color:#222;font-weight:500;text-align:right}
  .pdf-col2{grid-column:1/-1}
  .pdf-note{margin-top:10px;padding:8px 10px;background:#f4efe4;border-left:3px solid #9E8035;border-radius:0 3px 3px 0;font-size:10.5px}
  .pdf-table{width:100%;border-collapse:collapse;margin-top:4px}
  .pdf-table th{background:#8B7340;color:#fff;font-weight:700;text-align:left;padding:6px 7px;font-size:10.5px;letter-spacing:.2px;border:1px solid #6b5930}
  .pdf-table td{padding:5px 7px;border:1px solid #d9d2bf;vertical-align:top;font-size:10.5px}
  .pdf-table td.c{text-align:center}
  .pdf-zebra tbody tr:nth-child(even) td{background:#faf7f1}
  .pdf-small th,.pdf-small td{font-size:10px;padding:4px 6px}
  .pdf-sess{margin:10px 0 14px}
  .pdf-sess-hdr{display:flex;justify-content:space-between;align-items:center;background:#ede1c9;padding:6px 10px;border-radius:3px 3px 0 0;border:1px solid #d9d2bf;border-bottom:none}
  .pdf-sess-title{font-weight:700;color:#5C4A2A;font-size:12px}
  .pdf-sess-vol{font-size:10.5px;color:#555}
  .pdf-sess table{margin-top:0}
  @media print{
    body{padding:14px}
    .pdf-page-break{page-break-before:always}
    .pdf-avoid-break{page-break-inside:avoid}
    .pdf-header{page-break-after:avoid}
    table{page-break-inside:auto}
    tr{page-break-inside:avoid;page-break-after:auto}
    thead{display:table-header-group}
  }
  @page{size:A4;margin:12mm}
</style>
</head>
<body>
  <div class="pdf-header">
    <div>
      <h1>Macrociclo</h1>
      <div style="font-size:13px;color:#5C4A2A;font-weight:600">${escHtml(ath.name||'Atleta')} · ${escHtml(plan.title||plan.name||'—')}</div>
    </div>
    <div class="meta">
      <div><strong>FatigaMonitor Pro</strong></div>
      <div>Generado: ${escHtml(today)}</div>
    </div>

  ${body || '<p style="color:#888;text-align:center;padding:40px 0">No hay contenido para mostrar — selecciona al menos una sección con datos.</p>'}

</html>`;
}

// ===== RENAME MESOCICLO =====
function renameMesociclo(athId, mesoIdx){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  const newName = prompt('Nuevo nombre para el mesociclo:', plan.mesociclos[mesoIdx].name);
  if(newName && newName.trim()){
    plan.mesociclos[mesoIdx].name = newName.trim();
    save(); navigate('coach-mesociclo', S.params);
  }
}
function renameMesoInline(athId, mesoIdx, value){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  plan.mesociclos[mesoIdx].name = value.trim()||`Mes ${mesoIdx+1}`;
  save();
}

// ===== MOVE MESOCICLO (reorder) =====
function moveMesociclo(athId, mesoIdx, direction){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  const newIdx = mesoIdx + direction;
  if(newIdx<0 || newIdx>=plan.mesociclos.length) return;
  // Swap positions
  const temp = plan.mesociclos[mesoIdx];
  plan.mesociclos[mesoIdx] = plan.mesociclos[newIdx];
  plan.mesociclos[newIdx] = temp;
  // Renumber
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save();
  toast(`Mesociclo movido a posición ${newIdx+1}`);
  navigate('coach-mesociclo',{planAthlete:athId, mesoNum:newIdx+1});
}

// ===== SWAP MESOCICLOS =====
function swapMesociclos(athId, mesoIdxA, mesoIdxB){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  if(mesoIdxA===mesoIdxB) return;
  if(!plan.mesociclos[mesoIdxA]||!plan.mesociclos[mesoIdxB]) return;
  const temp = plan.mesociclos[mesoIdxA];
  plan.mesociclos[mesoIdxA] = plan.mesociclos[mesoIdxB];
  plan.mesociclos[mesoIdxB] = temp;
  plan.mesociclos.forEach((m,i)=>{m.num=i+1;});
  save();
  toast(`Mesociclos intercambiados: ${plan.mesociclos[mesoIdxA].name} ↔ ${plan.mesociclos[mesoIdxB].name}`);
  navigate('coach-mesociclo',{planAthlete:athId, mesoNum:mesoIdxA+1});
}

  `, 500);
}

function saveMicroEdit(athId, mesoIdx, weekIdx){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  const mc = plan.mesociclos[mesoIdx].microcycles[weekIdx];
  for(let si=0;si<7;si++){
    mc.sessions[si].type = document.getElementById(`mcType${si}`).value;
    mc.sessions[si].volume = parseInt(document.getElementById(`mcVol${si}`).value)||0;
    mc.sessions[si].intensity = parseInt(document.getElementById(`mcInt${si}`).value)||0;
  }
  mc.observations = document.getElementById('mcObs').value;
  save(); closeModal(); toast('Microciclo actualizado');
  navigate('coach-mesociclo', S.params);
}

function deleteMicrociclo(athId, mesoIdx, weekIdx){
  if(!confirm('¿Eliminar este microciclo?')) return;
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan) return;
  plan.mesociclos[mesoIdx].microcycles.splice(weekIdx,1);
  plan.mesociclos[mesoIdx].microcycles.forEach((mc,i)=>{mc.weekNum=i+1;});
  save(); closeModal(); toast('Microciclo eliminado');
  navigate('coach-mesociclo', S.params);
}

// ===== ADD MICROCICLO TO EXISTING MESOCICLO =====
function addMicrocicloToMeso(athId, mesoIdx){
  const plan = DB.plans.find(p=>p.athleteId===athId);
  if(!plan||!plan.mesociclos[mesoIdx]) return;
  const meso = plan.mesociclos[mesoIdx];
  const dayLabels=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const sesTypes=['Hipertrofia','Fuerza Máx.','Potencia','Aeróbica','Técnica'];
  meso.microcycles.push({
    weekNum:meso.microcycles.length+1,
    sessions: Array.from({length:7},(_,di)=>({
      num:di+1, day:dayLabels[di],
      type: di<5 ? sesTypes[di%5] : 'Descanso',
      volume: di<5 ? 80 : 0,
      intensity: di<5 ? 70 : 0
    })),
    observations:''
  });
  save(); toast(`Microciclo ${meso.microcycles.length} añadido`);
  navigate('coach-mesociclo', S.params);
}

function addAthlete(){
  const name=document.getElementById('newAthName').value.trim();
  let sport=document.getElementById('newAthSport').value.trim();
  if(sport==='__otro'){ sport = (document.getElementById('newAthSportCustom').value||'').trim(); }
  const age=parseInt(document.getElementById('newAthAge').value);
  const weight=parseInt(document.getElementById('newAthWeight').value);
  const height=parseInt(document.getElementById('newAthHeight').value);
  const cmjBase=parseFloat(document.getElementById('newAthCMJ').value);
  const level = document.getElementById('newAthLevel').value || 'Intermedio';
  const goals = Array.from(document.querySelectorAll('.newAthGoal:checked')).map(cb=>cb.value);
  const competitionType = document.getElementById('newAthCompType').value || '';
  const competitionDates = Array.from(document.querySelectorAll('.newAthCompDate')).map(i=>i.value).filter(Boolean).sort();
  let email=document.getElementById('newAthEmail').value.trim();
  if(!name){toast('Indica al menos el nombre del atleta','error');return;}

  const athId = DB.athletes.length?Math.max(...DB.athletes.map(a=>a.id))+1:1;
  const userId = DB.users.length?Math.max(...DB.users.map(u=>u.id))+1:1;
  const initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  if(!email){ const slug = name.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')||'atleta'; email = `${slug}.${athId}@fatiga.local`; }
  const sportCategory = getSportCategory(sport);

  DB.users.push({id:userId, name, email, pass:'atleta123', type:'athlete', athleteId:athId});
  DB.athletes.push({
    id:athId, userId, name,
    sport:sport||'—', sportCategory,
    age:age||0, weight:weight||0, height:height||0, cmjBase:cmjBase||35,
    coachId:S.user.id, photo:initials,
    level, goals, competitionDates, competitionType
  });

  const plan = buildAdaptiveMacrociclo({
    athId, coachId:S.user.id, name, sport, sportCategory,
    level, goals, competitionDates, competitionType
  });
  DB.plans.push(plan);
  save();
  closeModal();
  const adaptMsg = sportCategory!=='Otro' ? ` (${sportCategory}/${level})` : '';
  toast(`Atleta ${name} creado con macrociclo adaptado${adaptMsg}`);
  navigate(S.view);
  renderSidebar();
